<script>window.__SL_WEB={"url": "https://uuknyarkqefebmjclddc.supabase.co", "anonKey": "sb_publishable_UaDiGhxKlF6cJSi6DPz4hQ_M8TJ7rEW"};</script>
<script>
/* Site Ledger standalone runtime: the same window.__SL_RUNTIME contract the app uses inside Claude
 * (db / assets / user / downloads / sample), backed by Supabase instead of the claude.ai artifact.
 *   db        → table public.docs (coll, id, data jsonb), live via Realtime; update() = server-side deep merge (rpc doc_update)
 *   assets    → private Storage bucket "receipts"; display URLs are signed and fed to U.assetUrl via window.__SL_DEV_BLOB
 *   user      → Supabase Auth (email sign-in link) + public.members roles: owner / editor write, viewer reads
 *   downloads → a normal browser download;  sample → null (photos are read in Claude Code)
 * Config: window.__SL_WEB = {url, anonKey}. Loads before the app; the app waits on use("db") until sign-in completes. */
(function () {
  "use strict";
  const CFG = window.__SL_WEB || {};
  if (!window.supabase || !CFG.url || !CFG.anonKey) { console.error("[web] Supabase config missing"); return; }

  /* A sign-in link lands with tokens in the URL hash, which the app's router also reads: take them first. */
  const hashParams = new URLSearchParams(String(location.hash || "").replace(/^#/, ""));
  const linkTokens = hashParams.get("access_token") ? { access_token: hashParams.get("access_token"), refresh_token: hashParams.get("refresh_token") } : null;
  const linkError = hashParams.get("error_description");
  if (linkTokens || linkError) { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }

  const sb = window.supabase.createClient(CFG.url, CFG.anonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  window.__SL_SB = sb;
  window.__SL_DEV_BLOB = window.__SL_DEV_BLOB || {};

  let session = null, member = null, ready = null;
  const writable = () => !!member && (member.role === "owner" || member.role === "editor");

  /* ---------------- errors: map Supabase/PostgREST codes onto the artifact db's codes ---------------- */
  function mapErr(e) {
    if (!e) return { code: "upstream_error", message: "Unknown error" };
    if (e.code && e.message && ["invalid_argument", "unavailable", "not_found"].includes(e.code)) return e;
    const c = String(e.code || ""), m = String(e.message || e);
    if (c === "42501" || /row-level security|not allowed|permission denied/i.test(m)) return { code: "invalid_argument", message: "View only: this login can't change the ledger" };
    if (c === "P0002") return { code: "invalid_argument", message: m };               // update of a missing doc
    if (c === "PGRST116") return { code: "not_found", message: m };
    if (/fetch|network|timeout|Failed to fetch|Load failed/i.test(m)) return { code: "unavailable", message: "Connection problem" };
    return { code: "upstream_error", message: m };
  }
  const hex = (n) => Array.from(crypto.getRandomValues(new Uint8Array(n))).map((b) => b.toString(16).padStart(2, "0")).join("");
  const clone = (o) => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));
  const freeze = (o) => { if (o && typeof o === "object") { Object.freeze(o); Object.values(o).forEach(freeze); } return o; };
  function deepMerge(a, b) {
    if (!a || typeof a !== "object" || Array.isArray(a) || !b || typeof b !== "object" || Array.isArray(b)) return clone(b);
    const r = Object.assign({}, a);
    for (const k of Object.keys(b)) r[k] = b[k] && typeof b[k] === "object" && !Array.isArray(b[k]) && r[k] && typeof r[k] === "object" && !Array.isArray(r[k]) ? deepMerge(r[k], b[k]) : clone(b[k]);
    return r;
  }

  /* ---------------- db ---------------- */
  const cache = {};  // coll → Map(id → {data, snap})
  const subs = {};   // coll → Set({next, err})
  const loading = {};
  const META = Object.freeze({ fromCache: false, hasPendingWrites: false });
  function docSnap(id, data) { const d = data === undefined ? undefined : freeze(clone(data)); return Object.freeze({ id, exists: data !== undefined, data: () => d, metadata: META }); }
  function put(coll, id, data) { (cache[coll] = cache[coll] || new Map()).set(id, { data, snap: docSnap(id, data) }); }
  async function fetchColl(coll) {
    let rows = [], from = 0;
    for (;;) {
      const { data, error } = await sb.from("docs").select("id,data").eq("coll", coll).order("id").range(from, from + 999);
      if (error) throw mapErr(error);
      rows = rows.concat(data || []);
      if (!data || data.length < 1000) break;
      from += 1000;
    }
    const m = new Map();
    for (const r of rows) { const prev = cache[coll] && cache[coll].get(r.id); m.set(r.id, prev && JSON.stringify(prev.data) === JSON.stringify(r.data) ? prev : { data: r.data, snap: docSnap(r.id, r.data) }); }
    cache[coll] = m;
  }
  function snapOf(coll) {
    const docs = [...(cache[coll] || new Map()).entries()].sort(([a], [b]) => (a < b ? -1 : a > b ? 1 : 0)).map(([, v]) => v.snap);
    return Object.freeze({ docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: META });
  }
  const pending = new Set();
  function emit(coll) {
    if (pending.has(coll)) return;
    pending.add(coll);
    setTimeout(() => { pending.delete(coll); const s = snapOf(coll); (subs[coll] || new Set()).forEach((x) => { try { x.next(s); } catch (e) { console.error(e); } }); signAssets(); }, 0);
  }
  async function refetch(coll) { try { await fetchColl(coll); emit(coll); } catch (e) { console.warn("[web] refetch failed", coll, e.message); } }
  const refetchAll = () => Object.keys(subs).filter((c) => subs[c].size).forEach(refetch);

  let channel = null, down = false;
  function ensureRealtime() {
    if (channel) return;
    channel = sb.channel("sl-docs")
      .on("postgres_changes", { event: "*", schema: "public", table: "docs" }, (p) => {
        const row = p.eventType === "DELETE" ? p.old : p.new;
        if (!row || !row.coll || !cache[row.coll]) return;
        if (p.eventType === "DELETE") cache[row.coll].delete(row.id);
        else if (row.data === undefined) return refetch(row.coll);
        else put(row.coll, row.id, row.data);
        emit(row.coll);
      })
      .subscribe((status) => {
        if (status === "SUBSCRIBED") { if (down) refetchAll(); down = false; }
        else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") down = true;
      });
  }
  // a phone brought back to the foreground may have missed changes: catch up (at most every 15 s)
  let lastCatchUp = 0;
  document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - lastCatchUp > 15000) { lastCatchUp = Date.now(); refetchAll(); } });
  window.addEventListener("online", refetchAll);

  function splitPath(path) { const s = String(path).split("/").filter(Boolean); if (s.length !== 2) throw new TypeError("expected collection/id path: " + path); return s; }
  function docRef(path) {
    const [coll, id] = splitPath(path);
    return Object.freeze({
      id, path,
      async get() {
        const { data, error } = await sb.from("docs").select("data").eq("coll", coll).eq("id", id).maybeSingle();
        if (error) throw mapErr(error);
        return docSnap(id, data ? data.data : undefined);
      },
      async set(body) {
        if (!writable()) throw mapErr({ code: "42501" });
        const { error } = await sb.from("docs").upsert({ coll, id, data: body }, { onConflict: "coll,id" });
        if (error) throw mapErr(error);
        if (cache[coll]) { put(coll, id, clone(body)); emit(coll); }
      },
      async update(patch) {
        if (!writable()) throw mapErr({ code: "42501" });
        const { error } = await sb.rpc("doc_update", { p_coll: coll, p_id: id, p_patch: patch });
        if (error) throw mapErr(error);
        const cur = cache[coll] && cache[coll].get(id);
        if (cur) { put(coll, id, deepMerge(cur.data, patch)); emit(coll); } else if (cache[coll]) refetch(coll);
      },
      async delete() {
        if (!writable()) throw mapErr({ code: "42501" });
        const { error } = await sb.from("docs").delete().eq("coll", coll).eq("id", id);
        if (error) throw mapErr(error);
        if (cache[coll]) { cache[coll].delete(id); emit(coll); }
      },
      onSnapshot(next, err) {
        return collection(coll).onSnapshot((s) => next(s.docs.find((d) => d.id === id) || docSnap(id, undefined)), err);
      },
    });
  }
  function collection(coll) {
    if (String(coll).includes("/")) throw new TypeError("nested collections are not used by Site Ledger: " + coll);
    return Object.freeze({
      path: coll,
      doc: (id) => docRef(coll + "/" + (id || hex(10))),
      async add(body) { const r = docRef(coll + "/" + hex(10)); await r.set(body); return r; },
      async get() { await fetchColl(coll); return snapOf(coll); },
      onSnapshot(next, err) {
        const s = { next, err };
        (subs[coll] = subs[coll] || new Set()).add(s);
        ensureRealtime();
        const p = cache[coll] ? Promise.resolve() : (loading[coll] = loading[coll] || fetchColl(coll).finally(() => { delete loading[coll]; }));
        p.then(() => { if (subs[coll].has(s)) { next(snapOf(coll)); signAssets(); } }, (e) => { if (err) err(mapErr(e)); });
        return () => subs[coll].delete(s);
      },
    });
  }
  const db = Object.freeze({ doc: docRef, collection });

  /* ---------------- receipts: private bucket, signed display URLs ---------------- */
  const BUCKET = "receipts", signed = {};
  function referencedAssets() {
    const ids = new Set();
    for (const coll of ["costs", "quotes", "jobs"]) for (const v of (cache[coll] || new Map()).values()) for (const f of (v.data && v.data.files) || []) if (f) ids.add(f);
    for (const v of (cache.inbox || new Map()).values()) if (v.data && v.data.assetId) ids.add(v.data.assetId);
    return [...ids];
  }
  let signing = false;
  async function signAssets(force) {
    if (signing) return;
    const ids = referencedAssets().filter((id) => force || !signed[id]);
    if (!ids.length) return;
    signing = true;
    try {
      const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(ids, 7 * 24 * 3600);
      if (error) throw error;
      let changed = false;
      for (const r of data || []) if (r.signedUrl && r.path) { signed[r.path] = true; window.__SL_DEV_BLOB[r.path] = r.signedUrl; changed = true; }
      for (const id of ids) signed[id] = signed[id] || "missing";
      if (changed && window.SL && SL.ui && SL.ui.render) SL.ui.render();
    } catch (e) { console.warn("[web] could not sign receipt links", e.message || e); }
    finally { signing = false; }
  }
  setInterval(() => signAssets(true), 12 * 3600 * 1000);
  const assets = Object.freeze({
    async upload(blob, opts) {
      if (!writable()) throw { code: "not_granted", message: "View only" };
      const id = hex(16), type = (opts && opts.type) || blob.type || "application/octet-stream";
      const { error } = await sb.storage.from(BUCKET).upload(id, blob, { contentType: type, upsert: false });
      if (error) throw { code: /size|large/i.test(error.message) ? "too_large" : /mime|type/i.test(error.message) ? "unsupported_type" : "upstream_error", message: error.message };
      const { data } = await sb.storage.from(BUCKET).createSignedUrl(id, 7 * 24 * 3600);
      const url = (data && data.signedUrl) || "";
      signed[id] = true; window.__SL_DEV_BLOB[id] = url;
      return { id, url, sizeBytes: blob.size, contentType: type };
    },
    async list() { return { assets: [], usage: { files: 0, bytes: 0, maxFiles: 100000, maxBytes: 1 << 30 } }; },
    async delete(ref) { const { error } = await sb.storage.from(BUCKET).remove([String(ref).split("/").pop()]); return { deleted: !error }; },
  });

  /* ---------------- user, downloads ---------------- */
  const user = Object.freeze({
    isOwner: async () => !!member && member.role === "owner",
    canEdit: async () => writable(),
    can: async (name) => (name === "data.write" || name === "assets.write" ? writable() : false),
    id: async () => (session ? session.user.id : null),
    me: async () => ({ id: session ? session.user.id : null, name: (member && member.name) || (session && session.user.email) || "", avatarUrl: "", color: "#888", email: session ? session.user.email : null, isOwner: !!member && member.role === "owner", canEdit: writable() }),
    profiles: async (ids) => Object.fromEntries([].concat(ids).map((i) => [i, { id: i, name: "", avatarUrl: "", color: "#888", email: null, isMe: session && i === session.user.id, guest: false }])),
  });
  const downloads = Object.freeze({
    async save({ filename, data }) {
      const type = /\.csv$/i.test(filename) ? "text/csv;charset=utf-8" : /\.json$/i.test(filename) ? "application/json" : "text/plain;charset=utf-8";
      const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type }));
      const a = document.createElement("a"); a.href = url; a.download = filename || "download"; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      return { saved: true };
    },
  });

  /* ---------------- sign-in gate ---------------- */
  const CSS = `.sl-auth{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px 16px;background:var(--bg,#EEEFEB);color:var(--ink,#1B2429);font-family:var(--font,system-ui,sans-serif)}
.sl-auth .box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.sl-auth h1{margin:0;font-size:1.75rem;font-weight:700;font-stretch:80%}.sl-auth p{margin:0;color:var(--ink-2,#56626A);font-size:.875rem;line-height:1.45}
.sl-auth input{width:100%;min-height:48px;padding:10px 12px;font-size:1rem;border:1px solid var(--line-2,#B9BCB5);border-radius:3px;background:var(--paper,#FAFAF7);color:inherit}
.sl-auth button{width:100%;min-height:48px;padding:0 16px;border:0;border-radius:3px;background:var(--float,#F2C200);color:#1B2429;font-weight:700;font-size:1rem;cursor:pointer}
.sl-auth button.sec{background:transparent;color:var(--ink,#1B2429);box-shadow:inset 0 0 0 1.5px var(--ink,#1B2429)}
.sl-auth .msg{font-size:.875rem;font-weight:600}.sl-auth .err{color:var(--stop,#C4232B)}.sl-auth .ok{color:var(--prepaid,#2C7A57)}`;
  let gateEl = null;
  const bodyReady = () => (document.body ? Promise.resolve() : new Promise((r) => document.addEventListener("DOMContentLoaded", r, { once: true })));
  async function gate(html) {
    await bodyReady(); // this script runs in <head>, before <body> exists
    if (!gateEl) {
      const st = document.createElement("style"); st.textContent = CSS; document.head.appendChild(st);
      gateEl = document.createElement("div"); gateEl.className = "sl-auth"; gateEl.setAttribute("role", "dialog"); gateEl.setAttribute("aria-label", "Sign in");
      document.body.appendChild(gateEl);
    }
    gateEl.innerHTML = '<div class="box">' + html + "</div>";
    const f = gateEl.querySelector("input,button"); if (f) setTimeout(() => f.focus(), 30);
  }
  function ungate() { if (gateEl) { gateEl.remove(); gateEl = null; } }
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  async function showSignIn(note, cls) {
    let lastEmail = ""; try { lastEmail = localStorage.getItem("sl.lastEmail") || ""; } catch (e) {}
    await gate(`<h1>Site Ledger</h1><p>Sign in with your email. We'll send you a link. Open it on this device and you stay signed in.</p>
      <form id="sl-auth-form" novalidate><input id="sl-auth-email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" value="${esc(lastEmail)}" aria-label="Email" required>
      <div style="height:10px"></div><button type="submit" id="sl-auth-send">Email me a sign-in link</button></form>
      <div class="msg ${cls || ""}" id="sl-auth-msg" role="status">${note ? esc(note) : ""}</div>`);
    const form = gateEl.querySelector("#sl-auth-form");
    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const email = gateEl.querySelector("#sl-auth-email").value.trim(), msg = gateEl.querySelector("#sl-auth-msg"), btn = gateEl.querySelector("#sl-auth-send");
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { msg.className = "msg err"; msg.textContent = "Enter a valid email address."; return; }
      btn.disabled = true; btn.textContent = "Sending…";
      try { localStorage.setItem("sl.lastEmail", email); } catch (e) {}
      const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: true } });
      btn.disabled = false; btn.textContent = "Email me a sign-in link";
      if (error) { msg.className = "msg err"; msg.textContent = /rate|too many|seconds/i.test(error.message) ? "Too many emails just now. Wait a minute and try again." : "Couldn't send the link: " + error.message; return; }
      msg.className = "msg ok"; msg.textContent = "Link sent to " + email + ". Open it on this device (check spam if it doesn't arrive).";
    });
  }
  async function showNotMember(email) {
    await gate(`<h1>Site Ledger</h1><p>You're signed in as <b>${esc(email)}</b>, but this email isn't on the ledger's access list.</p><p>Ask Ryan to add it, then reload this page.</p>
      <button class="sec" id="sl-auth-out" type="button">Sign out</button>`);
    gateEl.querySelector("#sl-auth-out").addEventListener("click", signOut);
  }
  async function signOut() { try { await sb.auth.signOut(); } catch (e) {} location.replace(location.pathname); }
  window.__SL_SIGNOUT = signOut;

  async function loadMember() {
    const email = session.user.email || "";
    const { data, error } = await sb.from("members").select("email,role,name").ilike("email", email).maybeSingle();
    if (error) throw error;
    return data;
  }
  function start() {
    return new Promise((resolve) => {
      const finish = async (s) => {
        session = s;
        try { member = await loadMember(); } catch (e) { member = null; console.warn("[web] member lookup failed", e.message); }
        if (!member) { showNotMember(s.user.email); return; }
        window.__SL_WHO = { email: s.user.email, role: member.role };
        ungate(); resolve();
      };
      (async () => {
        if (linkTokens) { const { data, error } = await sb.auth.setSession(linkTokens); if (!error && data.session) return finish(data.session); }
        const { data } = await sb.auth.getSession();
        if (data && data.session) return finish(data.session);
        // listen first, then show the form, so a sign-in completing in another tab or a fast link is never missed
        const { data: sub } = sb.auth.onAuthStateChange((ev, s) => { if (s && ev === "SIGNED_IN") { sub.subscription.unsubscribe(); finish(s); } });
        showSignIn(linkError ? "That sign-in link didn't work (" + linkError + "). Send a new one." : "", linkError ? "err" : "");
      })();
    });
  }
  // signed out in another tab, or the session could not be refreshed: start over
  sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT" && session) location.replace(location.pathname); });

  ready = start();
  const caps = { db, assets: null, user, downloads, sample: null };
  window.__SL_RUNTIME = Object.freeze({
    use: async (name) => {
      await ready;
      if (name === "assets") return writable() ? assets : null;
      return caps[name] || null;
    },
  });
})();

</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ---- 00-tokens.css ---- */
/* Site Ledger — design tokens (spec §3.1–3.3). Light on bare :root; dark redefined twice. */
:root{
  --bg:#EEEFEB; --paper:#FAFAF7; --sunk:#E4E6E1; --line:#D5D7D1; --line-2:#B9BCB5;
  --ink:#1B2429; --ink-2:#56626A; --ink-3:#7C868C;
  --owed:#A8421A; --owed-bg:#F5E4DC;
  --prepaid:#2C7A57; --prepaid-bg:#DCEFE4;
  --committed:#566674;
  --float:#F2C200; --float-ink:#6B5500; --float-bg:#FFF4C2;
  --stop:#C4232B; --stop-bg:#FBE3E3;
  --warn:#8F5A00; --warn-bg:#FBEFD6;
  --info:#36648F; --info-bg:#E1EBF4;
  --scrim:rgba(10,14,18,.55);
  --on-float:#1B2429;
  --on-ink-accent:#F2C200; /* an accent that reads on an --ink fill (toast Undo) */

  --font:"Archivo","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-ar:"IBM Plex Sans Arabic","Archivo",system-ui,sans-serif;
  --t-11:.6875rem; --t-12:.75rem; --t-13:.8125rem; --t-14:.875rem; --t-16:1rem; --t-20:1.25rem; --t-28:1.75rem;

  --s1:2px; --s2:4px; --s3:8px; --s4:12px; --s5:16px; --s6:24px; --s7:32px;
  --gutter:16px; --gap:16px;
  --r-ctl:3px; --r-pill:2px; --r-sheet:10px;
  --hdr-h:44px; --tab-h:56px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121619; --paper:#1A1F23; --sunk:#0E1215; --line:#2B3237; --line-2:#3C454B;
    --ink:#E7E9E5; --ink-2:#9AA5AC; --ink-3:#7A858C;
    --owed:#E07A4F; --owed-bg:#3A2319;
    --prepaid:#5FC093; --prepaid-bg:#173226;
    --committed:#8FA0AD;
    --float:#F2C200; --float-ink:#F2C200; --float-bg:#3A3210;
    --stop:#FF6B6B; --stop-bg:#3D1A1C;
    --warn:#E0A43A; --warn-bg:#372A12;
    --info:#7FAEDB; --info-bg:#172838;
    --scrim:rgba(0,0,0,.6);
    --on-ink-accent:#6B5500;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121619; --paper:#1A1F23; --sunk:#0E1215; --line:#2B3237; --line-2:#3C454B;
  --ink:#E7E9E5; --ink-2:#9AA5AC; --ink-3:#7A858C;
  --owed:#E07A4F; --owed-bg:#3A2319;
  --prepaid:#5FC093; --prepaid-bg:#173226;
  --committed:#8FA0AD;
  --float:#F2C200; --float-ink:#F2C200; --float-bg:#3A3210;
  --stop:#FF6B6B; --stop-bg:#3D1A1C;
  --warn:#E0A43A; --warn-bg:#372A12;
  --info:#7FAEDB; --info-bg:#172838;
  --scrim:rgba(0,0,0,.6);
  --on-ink-accent:#6B5500;
  color-scheme:dark;
}
@media (min-width:1100px){ :root{ --gutter:24px; --gap:24px; } }

/* ---- 10-base.css ---- */
/* Base, layout shell and shared components (spec §2.2–2.3, §3.2–3.13). View-specific CSS lives in 30-*.css. */
*,*::before,*::after{box-sizing:border-box}
html{font-size:16px;height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--t-14);line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font-size:var(--t-16)}
a{color:var(--info)}
h1,h2,h3,h4{margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 4px var(--float)}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- type helpers ---------- */
.num{font-variant-numeric:tabular-nums;font-stretch:80%;white-space:nowrap}
.num .h{font-size:80%;color:var(--ink-2)}
.owed .num .h,.num.owed .h,.stop .num .h{color:inherit;opacity:.8}
.ar{font-family:var(--font-ar);font-size:1.04em}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.lbl{font-size:var(--t-11);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.t12{font-size:var(--t-12)} .t13{font-size:var(--t-13)} .t16{font-size:var(--t-16)} .t20{font-size:var(--t-20);font-weight:700;font-stretch:80%;line-height:1.15} .t28{font-size:var(--t-28);font-weight:700;font-stretch:78%;line-height:1.1}
.c-owed{color:var(--owed)} .c-prepaid{color:var(--prepaid)} .c-committed{color:var(--committed)} .c-float{color:var(--float-ink)} .c-stop{color:var(--stop)} .c-warn{color:var(--warn)} .c-info{color:var(--info)}
.unk{color:var(--warn);font-weight:600}
.zero{color:var(--ink-3)}
.est{text-decoration:underline dotted 1px;text-underline-offset:3px}

/* ---------- app shell ---------- */
.app{min-height:100%;padding-inline:var(--gutter);padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 24px)}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:var(--hdr-h);margin-inline:calc(-1 * var(--gutter));padding-inline:var(--gutter);display:flex;align-items:center;gap:var(--s3);background:var(--bg);border-bottom:1px solid var(--line)}
.hdr .back{min-width:32px;height:44px;display:grid;place-items:center;font-size:20px;color:var(--ink-2);position:relative}
.hdr .back::after{content:"";position:absolute;inset:0 0 0 -12px} /* 44 px target, reaching into the gutter */
.hdr .pname{flex:1;min-width:0;display:flex;align-items:center;gap:4px;font-weight:700;font-size:var(--t-16);height:44px;text-align:left}
.hdr .pname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr .pname i{font-style:normal;color:var(--ink-2);font-size:12px}
.chip-float{position:relative;flex:none;height:28px;padding:0 8px;border-radius:var(--r-ctl);background:var(--float-bg);color:var(--float-ink);font-weight:700;font-size:var(--t-13);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.chip-float.short{background:var(--stop-bg);color:var(--stop)}
.chip-flags{position:relative;flex:none;height:28px;padding:0 8px;border-radius:var(--r-ctl);background:var(--sunk);font-weight:700;font-size:var(--t-13);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip-flags.hasstop{background:var(--stop-bg)}
.chip-flags .s{color:var(--stop)} .chip-flags .c{color:var(--warn)}
.chip-float::after,.chip-flags::after{content:"";position:absolute;inset:-8px -2px} /* 28 px pill, 44 px target (§3.3) */
@media (max-width:767px){.hdr{gap:var(--s2)}}
@media (max-width:399px){.chip-float .nm{display:none}} /* leave the project name room on small phones */
.hdr .more{flex:none;width:36px;height:44px;font-size:20px;color:var(--ink-2);position:relative}
.hdr .more::after{content:"";position:absolute;inset:0 -8px 0 0}
.strip{margin-inline:calc(-1 * var(--gutter));padding:4px var(--gutter);font-size:var(--t-12);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.strip.ro{background:var(--sunk);color:var(--ink-2)}
#strips{display:contents}
.strip.asof{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr-h));z-index:19;background:var(--info-bg);color:var(--info);font-weight:600}
@media (min-width:768px){.strip.asof{top:calc(env(safe-area-inset-top,0px) + var(--hdr-h) + 40px)}} /* below the sticky tablet tabs */
@media (min-width:1100px){body.desk .strip.asof{top:calc(env(safe-area-inset-top,0px) + var(--hdr-h))}}
.strip.offline{background:var(--warn-bg);color:var(--warn)}
.strip.full{background:var(--stop-bg);color:var(--stop);font-weight:600}
.strip button{color:inherit;text-decoration:underline;font-weight:600}
main.view{padding-top:var(--s5);display:flex;flex-direction:column;gap:var(--gap);min-width:0}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;height:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--paper);border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);align-items:center}
.tabs button{height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:var(--t-11);font-weight:600;color:var(--ink-2);position:relative}
.tabs button .ic{font-size:18px;line-height:1}
.tabs button.on{color:var(--ink)}
.tabs button.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;background:var(--ink)}
.tabs .plus{justify-self:center;width:56px;height:56px;margin-top:-18px;border-radius:3px;background:var(--float);color:var(--on-float);font-size:28px;font-weight:700;display:grid;place-items:center}
.tabs .badge{position:absolute;top:6px;left:calc(50% + 8px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--info);color:var(--paper);font-size:10px;line-height:16px;font-weight:700}

.rail,.rrail{display:none}
@media (min-width:768px){
  .tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr-h));bottom:auto;height:40px;padding:0;margin-inline:calc(-1 * var(--gutter));display:flex;gap:4px;padding-inline:var(--gutter);border-top:0;border-bottom:1px solid var(--line);background:var(--bg)}
  .tabs button{height:40px;flex-direction:row;padding:0 12px;font-size:var(--t-13)}
  .tabs button .ic{font-size:14px}
  .tabs button.on::before{top:auto;bottom:0;left:8px;right:8px}
  .tabs .plus{margin:0 0 0 auto;width:auto;height:32px;padding:0 14px;font-size:var(--t-14);align-self:center}
  .tabs .plus::after{content:" Add";font-size:var(--t-14)}
  .app{padding-bottom:48px}
}
@media (min-width:1100px){
  body.desk{display:grid;grid-template-columns:200px minmax(0,1fr) auto}
  body.desk .rail{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto;padding:12px 8px;border-right:1px solid var(--line);background:var(--paper)}
  body.desk .rail button{text-align:left;padding:7px 10px;border-radius:var(--r-ctl);font-weight:600;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center}
  body.desk .rail button.on{background:var(--sunk);color:var(--ink)}
  body.desk .rail button.rail-p{padding-left:22px}
  body.desk .rail .sep{height:1px;background:var(--line);margin:8px 4px}
  body.desk .rail .meter{margin-top:auto;padding:8px 10px;font-size:var(--t-12);color:var(--ink-2)}
  body.desk .tabs{display:none}
  body.desk .rrail{display:flex;flex-direction:column;gap:12px;width:320px;position:sticky;top:0;height:100vh;overflow-y:auto;padding:12px;border-left:1px solid var(--line)}
  body.desk.rr-off .rrail{display:none}
}

/* ---------- sections, rows ---------- */
.sec{display:flex;flex-direction:column;min-width:0}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 0 6px;border-bottom:1px solid var(--line-2)}
.sech h2,.sech h3{font-size:var(--t-11);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.sech .tot{font-weight:700;font-size:var(--t-13)}
.sech .act{font-size:var(--t-12);font-weight:600;color:var(--info)}
.title{font-size:var(--t-16);font-weight:700}
.row{display:grid;grid-template-columns:14px minmax(0,1fr) auto 16px;column-gap:8px;row-gap:1px;align-items:baseline;min-height:44px;padding:6px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row>.sw{grid-column:1;grid-row:1/3;align-self:center}
.row>.t{grid-column:2;grid-row:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row>.a{grid-column:3;grid-row:1;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;font-stretch:80%;white-space:nowrap}
.row>.f{grid-column:4;grid-row:1;align-self:center;text-align:center;font-size:12px;line-height:1}
.row>.m{grid-column:2;grid-row:2;font-size:var(--t-12);color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row>.w{grid-column:3/5;grid-row:2;font-size:var(--t-12);font-weight:600;text-align:right;white-space:nowrap}
.row.nosw{grid-template-columns:minmax(0,1fr) auto 16px}
.row.nosw>.sw{display:none}
.row.nosw>.t,.row.nosw>.m{grid-column:1}
.row.nosw>.a{grid-column:2}
.row.nosw>.f{grid-column:3}
.row.nosw>.w{grid-column:2/4}
.row.stopped{box-shadow:inset 2px 0 0 var(--stop);padding-left:6px}
.row .unrev::before{content:"• ";color:var(--info)}
.row>.a.unrev-amt{text-decoration:underline dotted 1px var(--info);text-underline-offset:3px}
.fslot{position:relative;display:inline-block;min-width:16px;cursor:pointer}
.fslot::after{content:"";position:absolute;inset:-14px -12px -14px -16px} /* 44 px wide target over a 12 px glyph (§3.3) */
.row.tap{cursor:pointer}
.row.tap:hover{background:color-mix(in srgb,var(--sunk) 50%,transparent)}
.rowx{padding:8px 0 12px 22px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;font-size:var(--t-13)}
.more-link{padding:10px 0;font-size:var(--t-12);font-weight:600;color:var(--info);text-align:left}

/* state swatches (§3.4) */
.sw{display:inline-block;width:10px;height:10px;flex:none}
.sw.paid{background:var(--ink)}
.sw.owed,.pat-owed{background:repeating-linear-gradient(135deg,var(--owed) 0 1.5px,transparent 1.5px 4px);box-shadow:inset 0 0 0 1px var(--owed)}
.sw.prepaid,.pat-prepaid{background:radial-gradient(var(--paper) .8px,transparent 1px) 0 0/4px 4px,var(--prepaid)}
.sw.committed,.pat-committed{background:transparent;border:1px dashed var(--committed)}
.sw.planned{border:1px dotted var(--committed)}
.sw.part{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%),repeating-linear-gradient(135deg,var(--owed) 0 1.5px,transparent 1.5px 4px);box-shadow:inset 0 0 0 1px var(--owed)}
.sw.noprice{border:1px solid var(--warn);position:relative}
.sw.noprice::after{content:"?";position:absolute;inset:-3px 0 0;font-size:9px;font-weight:700;color:var(--warn);text-align:center}
.sw.none{background:var(--sunk)}
.sw.cash{background:var(--float)}

/* monograms (§3.9) */
.mono{display:inline-grid;place-items:center;width:14px;height:14px;border:1px solid var(--ink-2);color:var(--ink-2);font-size:9px;font-weight:700;line-height:1;flex:none;vertical-align:1px}

/* pills (§3.5) */
.pill{display:inline-flex;align-items:center;gap:3px;height:18px;padding:0 6px;border:1px solid currentColor;border-radius:var(--r-pill);font-size:var(--t-11);font-weight:600;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;vertical-align:1px;color:var(--ink-2)}
.pill.st-planned{color:var(--ink-2)} .pill.st-active{color:var(--ink)} .pill.st-hold{color:var(--warn)} .pill.st-done{color:var(--ink-3);border-color:transparent}
.pill.k-invoice{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pill.k-simplified,.pill.k-receipt{color:var(--ink)} .pill.k-handwritten{color:var(--ink-2)}
.pill.k-quote{color:var(--committed);border-style:dashed}
.pill.k-delivery{color:var(--ink-3)}
.pill.call{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-bg)}
.pill.review{color:var(--info)}
.pill.paper{color:var(--warn)}
.pill.est{color:var(--ink-2);border-style:dotted}

/* flag glyphs (§3.6) */
.fg{font-style:normal;font-size:12px;line-height:1}
.fg.stop{color:var(--stop)} .fg.check{color:var(--warn)} .fg.note{color:var(--ink-2)}
.pricedev{font-size:var(--t-12);font-weight:600;color:var(--warn);white-space:nowrap}

/* ---------- money bar (§3.7) ---------- */
.mbar{position:relative;display:flex;gap:1px;height:8px;background:var(--sunk);margin:6px 0 4px}
.mbar .seg{display:block;height:100%;min-width:0;max-width:none;border:0;border-radius:0;background:none;overflow:visible} /* undo the .seg control rule */
.mbar .seg.w{min-width:2px}
.mbar .seg.paid{background:var(--ink)}
.mbar .seg.owed{background:repeating-linear-gradient(135deg,var(--owed) 0 1.5px,transparent 1.5px 4px);box-shadow:inset 0 0 0 1px var(--owed)}
.mbar .seg.prepaid{background:radial-gradient(var(--paper) .8px,transparent 1px) 0 0/4px 4px,var(--prepaid)}
.mbar .seg.committed{background:transparent;box-shadow:inset 0 0 0 1px var(--committed);background-image:none;outline:1px dashed var(--committed);outline-offset:-1px}
.mbar .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.mbar .budget{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--ink-2)}
.mbar .budget::after{content:"B";position:absolute;top:-11px;left:-3px;font-size:9px;color:var(--ink-2);font-weight:700}
.mbar.over{box-shadow:0 0 0 1px var(--stop)}
@media (min-width:1100px){.mbar{height:10px}}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:var(--t-12);align-items:center}
.legend span{display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.legend .zeros{color:var(--ink-3)}
.ident{font-size:var(--t-12);color:var(--ink-2)}

/* float gauge (§3.8) */
.fgauge{position:relative;display:flex;height:10px;background:var(--float-bg)}
.fgauge .claimed{height:100%;background:repeating-linear-gradient(135deg,var(--owed) 0 1.5px,transparent 1.5px 4px),var(--float-bg);box-shadow:inset 0 0 0 1px var(--owed)}
.fgauge .free{height:100%;background:var(--float)}
.fgauge .short{height:100%;border:1px dashed var(--stop)}

/* ---------- cards (only float, flags, pay-week) ---------- */
.card{background:var(--paper);border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.float{background:var(--float-bg);border-color:color-mix(in srgb,var(--float) 60%,var(--line))}
.card.stop{border-color:var(--stop);box-shadow:inset 3px 0 0 var(--stop)}
.card.check{box-shadow:inset 3px 0 0 var(--warn)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;font-size:var(--t-13)}
.kv .v{text-align:right;font-variant-numeric:tabular-nums;font-stretch:80%;font-weight:600}
.kv .tot{border-top:1px solid var(--ink);padding-top:4px;font-weight:700}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:var(--r-ctl);background:var(--ink);color:var(--paper);font-weight:700;font-size:var(--t-14);white-space:nowrap}
.btn.float{background:var(--float);color:var(--on-float)}
.btn.sec{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.ghost{background:transparent;color:var(--info);padding:0 8px}
.btn.danger{background:transparent;color:var(--stop);box-shadow:inset 0 0 0 1.5px var(--stop)}
.btn.sm{min-height:34px;padding:0 12px;font-size:var(--t-13)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.lnk{color:var(--info);font-weight:600;font-size:var(--t-13);text-align:left}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;height:36px;border:1px solid var(--line-2);border-radius:var(--r-ctl);overflow:hidden;background:var(--paper);max-width:100%}
.seg button{padding:0 12px;font-weight:600;font-size:var(--t-13);color:var(--ink-2);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button.on{background:var(--ink);color:var(--paper)}
.seg.full{display:flex}.seg.full button{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:34px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r-ctl);background:var(--paper);font-weight:600;font-size:var(--t-13);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--ink-2)}
.chips select.chip{width:auto;max-width:100%;padding:0 8px;color:var(--ink-2);font-size:var(--t-16)} /* "More jobs…" picker (16 px: no iOS focus zoom) */
@media (max-width:1099px){.seg{height:44px}.chip{min-height:44px}}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>label,.fld>.lb{font-size:var(--t-12);color:var(--ink-2);font-weight:600}
.fld input,.fld select,.fld textarea,.inp{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line-2);border-radius:var(--r-ctl);background:var(--sunk);font-size:var(--t-16)}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--float) 70%,transparent)}
.fld .hint{font-size:var(--t-12);color:var(--ink-2)}
.fld .err{font-size:var(--t-12);color:var(--stop);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 10px}
.stack{display:flex;flex-direction:column;gap:12px}
.hrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
table.t{width:100%;border-collapse:collapse;font-size:var(--t-13)}
table.t th{position:sticky;top:0;background:var(--bg);font-size:var(--t-11);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line-2);white-space:nowrap}
table.t td{padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:baseline}
table.t .r{text-align:right;font-variant-numeric:tabular-nums;font-stretch:80%;white-space:nowrap}
table.t tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}

/* ---------- digit strip (§5.3) ---------- */
.digits{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.digits button{height:48px;border-radius:var(--r-ctl);background:var(--paper);border:1px solid var(--line-2);font-weight:700;font-size:var(--t-16);font-variant-numeric:tabular-nums}
.digits button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.digits button:active{background:var(--sunk)}

/* ---------- sheet, toast, menu ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:var(--paper);border-radius:var(--r-sheet) var(--r-sheet) 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);transform:translateY(0);transition:transform .2s ease-out;max-width:720px;margin:0 auto}
.sheet.enter{transform:translateY(105%)}
.sheet .sh-h{display:flex;align-items:center;gap:8px;padding:12px var(--gutter) 8px;border-bottom:1px solid var(--line)}
.sheet .sh-h h2{flex:1;font-size:var(--t-16);font-weight:700;min-width:0}
.sheet .sh-h .x{width:40px;height:40px;font-size:22px;color:var(--ink-2)}
.sheet .sh-b{flex:1;overflow-y:auto;padding:12px var(--gutter) 16px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.sheet .sh-f{padding:10px var(--gutter) calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:var(--paper)}
.sheet .sh-f .btn{flex:1}
.sheet .sh-note{font-size:var(--t-12);color:var(--warn);padding:6px var(--gutter);background:var(--warn-bg)}
@media (min-width:1100px){
  .sheet{left:auto;top:0;bottom:0;right:0;width:480px;max-width:none;max-height:none;border-radius:0;margin:0;box-shadow:-6px 0 24px rgba(0,0,0,.18)}
  .sheet.enter{transform:translateX(105%)}
  .sheet.wide{width:min(960px,92vw)}
}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.toast{position:fixed;left:0;right:0;margin-inline:auto;width:max-content;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 12px);z-index:50;max-width:min(560px,calc(100vw - 32px));background:var(--ink);color:var(--paper);padding:10px 12px;border-radius:var(--r-ctl);display:flex;gap:12px;align-items:center;font-size:var(--t-13)}
.toast button{color:var(--on-ink-accent);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:var(--t-12);min-height:32px}
@media (min-width:768px){.toast{bottom:24px}}
.menu{display:flex;flex-direction:column}
.menu button{text-align:left;min-height:48px;padding:0 4px;border-bottom:1px solid var(--line);font-weight:600;display:flex;align-items:center;gap:10px}

/* ---------- system states (§3.12) ---------- */
.empty{padding:14px 0;color:var(--ink-2);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.skel{height:44px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--sunk) 60%,transparent),transparent)}
.notsaved{color:var(--stop);font-weight:600;font-size:var(--t-12)}
.fullpage{min-height:60vh;display:grid;place-items:center;text-align:center;color:var(--ink-2);padding:24px}
.notice{padding:10px 12px;background:var(--warn-bg);color:var(--warn);font-size:var(--t-13);font-weight:600}
.prose{max-width:72ch}

/* receipt thumbnails (ui.photo) */
.ph-btn{display:inline-block;width:44px;height:44px;padding:0;border:1px solid var(--line-2);border-radius:var(--r-ctl);overflow:hidden;background:var(--sunk);vertical-align:middle;flex:none}
.ph-btn .ph{width:100%;height:100%;object-fit:cover;display:block}

/* ---- 15-flags.css ---- */
/* 15-flags.css: the #flags view (.v-flags) and the flag sheet (.v-flag). Colours via tokens only. */
.v-flags .fl-top{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3) var(--s4);margin:var(--s3) 0 var(--s2)}
.v-flags .fl-top .seg{flex:0 1 auto}
.v-flags .fl-top .seg button{min-height:44px}
.v-flags .fl-sum{color:var(--ink-2);white-space:nowrap}
.v-flags .fl-grp{margin-top:var(--s5)}
.v-flags .fl-grp .sech h3{letter-spacing:.05em}
.v-flags .fl-g-stop .sech h3{color:var(--stop)}
.v-flags .fl-g-check .sech h3{color:var(--warn)}
.v-flags .fl-g-note .sech h3{color:var(--ink-2)}
.v-flags .fl-item{border-bottom:1px solid var(--line)}
.v-flags .fl-item>.row{border-bottom:0;background:none;border-left:0;border-right:0;border-top:0;font:inherit;color:inherit;cursor:pointer}
.v-flags .fl-item>.row.stopped{box-shadow:inset 2px 0 0 var(--stop);padding-left:var(--s3)}
.v-flags .fl-item>.row>.t .fg{display:inline-block;width:14px;text-align:center;font-style:normal}
.v-flags .fl-item>.row>.m{padding-left:18px}
.v-flags .fl-item>.row>.w{color:var(--ink-3);font-weight:400}
.v-flags .fl-fx{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s3);padding:0 0 var(--s3) 18px;margin-top:-2px}
.v-flags .fl-item.fl-stop .fl-fx{padding-left:calc(18px + var(--s3));box-shadow:inset 2px 0 0 var(--stop)}
.v-flags .fl-fx .btn{min-height:36px;position:relative}
.v-flags .fl-fx .btn::after{content:"";position:absolute;inset:-4px 0}
.v-flags .more-link{display:block;width:100%;text-align:left;min-height:44px;margin-top:var(--s5);color:var(--info);background:none;border:0;border-top:1px solid var(--line-2);font:inherit;padding:var(--s3) 0;cursor:pointer}
.v-flags .empty .lnk{margin-left:var(--s2)}

/* desktop: one line per flag, fixes on the right, full width */
@media (min-width:1100px){
  .v-flags .fl-item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:var(--s5)}
  .v-flags .fl-fx{padding:0;margin:0;justify-content:flex-end;box-shadow:none}
  .v-flags .fl-item.fl-stop .fl-fx{padding-left:0;box-shadow:none}
  .v-flags .fl-fx .btn{min-height:32px}
}

/* the flag sheet */
.v-flag .fl-detail{margin:0 0 var(--s4);font-size:var(--t-14);line-height:1.45;color:var(--ink)}
.v-flag .kv{margin-bottom:var(--s3)}
.v-flag .fl-why{margin:0 0 var(--s4)}
.v-flag .fl-ack{margin:0 0 var(--s4);padding:var(--s3) var(--s4);background:var(--sunk);color:var(--ink-2)}
.v-flag .fl-fixes{margin:0 0 var(--s5);flex-wrap:wrap}
.v-flag .fl-fixes .btn{min-height:44px}
.v-flag .fl-acksec{border-top:1px solid var(--line);padding-top:var(--s4)}
.v-flag .fl-acksec .lbl{margin-bottom:var(--s3)}
.v-flag .fl-acksec .chips{margin-bottom:var(--s3)}
.v-flag .fl-acksec .chip{min-height:44px}

/* ---- 30-today.css ---- */
/* 30-today.css — Today (.v-today), Week (.v-week), cell sheet (.cs-*), crew sheet. Owner: today. */

/* header seg + day strip */
.v-today,.v-week{display:flex;flex-direction:column;gap:var(--s5);min-width:0}
.v-today .td-top,.v-week .td-top{display:flex;align-items:center;gap:var(--s3);padding-top:var(--s3)}
.v-today .td-top .seg button,.v-week .td-top .seg button{min-width:72px}
.v-today .td-strip{display:flex;align-items:stretch;gap:2px;margin-inline:calc(-1 * var(--s2))}
.td-nav{flex:none;width:32px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;font-size:var(--t-20);font-weight:700;color:var(--ink-2);border-radius:var(--r-ctl)}
.td-nav:hover{background:var(--sunk)}
.v-today .td-days{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;min-width:0}
.v-today .td-day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:48px;padding:4px 0;border-radius:var(--r-ctl);min-width:0;overflow:hidden}
.v-today .td-day .td-dl{font-size:var(--t-11);font-weight:600;letter-spacing:.03em;color:var(--ink-2)}
.v-today .td-day .td-dn{font-size:var(--t-13);font-weight:700;font-stretch:80%;white-space:nowrap;display:flex;gap:1px}
.v-today .td-day.off{opacity:.55}
.v-today .td-day.now .td-dl{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.v-today .td-day.on{background:var(--ink);color:var(--paper)}
.v-today .td-day.on .td-dl,.v-today .td-day.on .zero,.v-today .td-day.on .faint{color:var(--paper)}
.v-today .td-day.on .c-committed{color:var(--paper);opacity:.8}
.v-today .td-banner{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);flex-wrap:wrap}
.v-today .td-banner .lnk{min-height:32px;font-weight:700}

/* crews today */
.v-today .td-allcame{margin:var(--s3) 0 var(--s2);min-height:52px;font-size:var(--t-16)}
.v-today .td-crew{display:grid;grid-template-columns:14px minmax(0,1fr) auto;column-gap:8px;row-gap:2px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.v-today .td-st{grid-column:1;grid-row:1;font-size:12px;line-height:1;text-align:center}
.v-today .td-name{grid-column:2;grid-row:1;min-height:40px;text-align:left;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.v-today .td-name .muted{font-weight:500}
.v-today .td-amt{grid-column:3;grid-row:1;text-align:right;font-weight:700;white-space:nowrap}
.v-today .td-ctl{grid-column:2/4;grid-row:2;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.v-today .td-crew.idle .td-ctl{justify-content:space-between}
.v-today .td-crew.idle .td-came{min-height:44px}
.v-today .td-cell{display:inline-flex;align-items:baseline;justify-content:center;gap:2px;min-width:52px;min-height:44px;padding:0 8px;border:1px solid var(--line-2);border-radius:var(--r-ctl);background:var(--paper);font-size:var(--t-12);font-weight:600;color:var(--ink-2);align-items:center}
.v-today .td-cell b{font-size:var(--t-20);font-weight:700;color:var(--ink);line-height:1}
.v-today .td-cell.plan{border:1px dotted var(--committed)}
.v-today .td-cell.plan b{color:var(--committed)}
.v-today .td-food,.v-today .td-job{min-height:44px;padding:0 10px;border:1px solid var(--line-2);border-radius:var(--r-ctl);font-size:var(--t-13);font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;white-space:nowrap}
.v-today .td-food.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.v-today .td-job{color:var(--ink)}
.v-today .td-pw{margin-left:auto}
.v-today .td-add{padding:var(--s3) 0 0}
.v-today .td-add .lnk,.td-pick+.td-add .lnk{min-height:44px;font-weight:700}

/* on site + bought */
.v-today .td-kit .t{display:flex;gap:4px;align-items:baseline;min-width:0}
.v-today .td-kit{align-items:center;padding-block:4px}
.v-today .td-kitname{min-height:40px;font-weight:600;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.v-today .td-kit .w{display:flex;gap:8px;justify-content:flex-end;align-items:center}
/* Set: a real 40 px box; the negative block margin keeps the row compact (the box overlaps only the amount above) */
.v-today .td-set{position:relative;display:inline-flex;align-items:center;min-height:40px;padding:0 10px;margin:-8px -10px -8px 0;font-weight:700}
.v-today .td-addbuy{padding-top:var(--s4)}
.v-today .td-addbuy .btn{flex:1}

/* week matrix */
.v-week .wk-nav{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.v-week .wk-title{font-size:var(--t-16);font-weight:700;min-width:0;text-align:center}
.v-week .wk-this{margin-left:auto}
.v-week table.wk{border-collapse:separate;border-spacing:0;font-size:var(--t-13);min-width:100%}
.v-week table.wk th,.v-week table.wk td{padding:0;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle;white-space:nowrap}
.v-week table.wk thead th{position:sticky;top:0;z-index:1;background:var(--bg);font-size:var(--t-11);font-weight:600;letter-spacing:.03em;color:var(--ink-2);height:28px;border-bottom:1px solid var(--line-2)}
.v-week table.wk thead th.off,.v-week table.wk td.off{opacity:.6}
.v-week table.wk thead th.now{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.v-week .wk-c{position:sticky;left:0;z-index:2;background:var(--bg);text-align:left!important;min-width:96px;max-width:132px;padding-right:6px!important;box-shadow:1px 0 0 var(--line-2)}
.v-week thead .wk-c{z-index:3}
.v-week .wk-name{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:44px;width:100%;text-align:left;min-width:0}
.v-week .wk-n{font-weight:600;overflow:hidden;text-overflow:ellipsis;max-width:124px}
.v-week .wk-meta{font-size:var(--t-11);color:var(--ink-2);font-weight:600}
.v-week td.wk-d{min-width:40px}
.v-week .wk-in{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-width:40px;min-height:44px;padding:0 2px;font-weight:600;font-stretch:80%;color:var(--ink)}
.v-week button.wk-in:hover{background:var(--sunk)}
.v-week td.plan .wk-in{outline:1px dotted var(--committed);outline-offset:-4px;color:var(--committed)}
.v-week td.now{background:color-mix(in srgb,var(--sunk) 60%,transparent)}
.v-week .wk-food{position:absolute;top:6px;right:6px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.75}
.v-week .wk-j{font-size:10px;font-weight:700;color:var(--info);line-height:1}
.v-week .wk-tot{min-width:64px;padding:0 6px!important;font-weight:700}
.v-week table.wk tfoot td,.v-week table.wk tfoot th{height:32px;font-weight:700;border-bottom:0}
.v-week table.wk tfoot tr:first-child td,.v-week table.wk tfoot tr:first-child th{border-top:2px solid var(--ink)}
.v-week table.wk tfoot th.wk-c{font-size:var(--t-11);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2)}
.v-week table.wk td.r{text-align:right;padding:0 4px;font-variant-numeric:tabular-nums;font-stretch:80%}
.v-week .wk-acts{padding-top:var(--s2)}

/* cell sheet */
.cs-nav{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s3)}
.cs-sum{font-weight:700;font-size:var(--t-16);font-variant-numeric:tabular-nums;font-stretch:80%}
.cs-boxes{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-bottom:var(--s3)}
.cs-box{display:flex;align-items:baseline;justify-content:center;gap:var(--s3);min-height:72px;border:1.5px solid var(--line-2);border-radius:var(--r-ctl);background:var(--paper)}
.cs-box.plan{border-style:dotted;border-color:var(--committed)}
.cs-box.plan .cs-v{color:var(--committed)}
/* the box the digits go into: a solid fill, like .chip.on / .seg .on (ink; the planned colour on a planned day) */
.cs-box.on{background:var(--ink);border-color:var(--ink);border-style:solid}
.cs-box.plan.on{background:var(--committed);border-color:var(--committed)}
.cs-box.on .cs-v,.cs-box.on .cs-l,.cs-box.on .faint{color:var(--paper)}
.cs-v{font-size:var(--t-28);font-weight:700;font-stretch:78%;line-height:1;align-self:center}
.cs-l{font-size:var(--t-13);font-weight:600;color:var(--ink-2);align-self:center}
.cs-bigrow{margin-top:var(--s3);align-items:flex-end}
.cs-food{display:flex;align-items:flex-end;gap:var(--s3);margin:var(--s4) 0 var(--s3)}
.cs-food .chip{min-height:44px}
.cs-st{margin:var(--s4) 0 var(--s2)}
.cs-st .seg{height:44px}
.fld>.td-lb{margin-bottom:2px}
.td-pick .row{min-height:48px}

/* desktop: use the width */
@media (min-width:1100px){
  .v-today .td-crew{grid-template-columns:14px minmax(180px,280px) minmax(0,1fr) auto;row-gap:0}
  .v-today .td-ctl{grid-column:3;grid-row:1}
  .v-today .td-amt{grid-column:4}
  .v-today .td-cell,.v-today .td-food,.v-today .td-job{min-height:36px}
  .v-today .td-allcame{max-width:420px}
  .v-today .td-strip{max-width:720px}
  .v-week td.wk-d,.v-week .wk-in{min-width:56px}
  .v-week .wk-in{min-height:36px}
  .v-week .wk-c{min-width:180px;max-width:none}
  .v-week .wk-n{max-width:none}
}
@media (prefers-reduced-motion:reduce){.v-week button.wk-in,.v-today .td-day{transition:none}}
/* ▼ n ▲ steppers on crew rows */
.v-today .td-step{display:inline-flex;align-items:stretch;gap:0}
.v-today .td-step .td-cell{border-radius:0;min-width:44px;padding:0 6px}
.v-today .td-arr{min-width:34px;min-height:44px;border:1px solid var(--line-2);background:var(--sunk);color:var(--ink);font-size:var(--t-12);display:inline-flex;align-items:center;justify-content:center;padding:0}
.v-today .td-arr:first-child{border-radius:var(--r-ctl) 0 0 var(--r-ctl);border-right:0}
.v-today .td-arr:last-child{border-radius:0 var(--r-ctl) var(--r-ctl) 0;border-left:0}
.v-today .td-arr:active{background:var(--line)}
.v-today .td-arr:disabled{color:var(--ink-3);opacity:.5}
@media (min-width:1100px){ .v-today .td-arr{min-height:36px} }
.v-today .td-rm{min-height:44px;padding:0 10px;border:1px solid var(--line-2);border-radius:var(--r-ctl);font-size:var(--t-12);font-weight:600;color:var(--stop);margin-left:auto;white-space:nowrap}
@media (min-width:1100px){ .v-today .td-rm{min-height:36px} }

/* ---- 31-crew.css ---- */
/* 31-crew: crew week grid, equipment attach, bulk pricing */
.v-crew{display:flex;flex-direction:column;gap:var(--s4);padding-top:var(--s4);min-width:0}
.v-crew h2{font-size:var(--t-20);line-height:1.15;font-weight:700;font-stretch:80%;text-wrap:balance}
.v-crew .ar2{font-size:var(--t-16);font-weight:500;color:var(--ink-2);font-stretch:100%}
.v-crew .c-head{display:flex;flex-direction:column;gap:2px;min-width:0}
.v-crew .c-rates{display:flex;align-items:center;gap:8px;font-size:var(--t-14);font-weight:600;min-height:32px}
.v-crew .c-rates .lnk{min-height:44px;padding:0 6px;margin:-6px 0}
.v-crew .c-job{display:block;min-height:44px;line-height:44px;text-align:left;color:var(--ink);max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.v-crew button.c-job{border-bottom:1px dashed var(--line-2);align-self:flex-start}
.v-crew .c-nav{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line)}
.v-crew .c-arr{height:44px;font-size:22px;font-weight:700;color:var(--ink)}
.v-crew .c-wk{text-align:center;font-weight:600;font-size:var(--t-14);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-crew .c-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:calc(-1 * var(--s2))}
.v-crew .c-tools .btn.sm,.v-crew .c-tools .chip{min-height:44px}

/* the week grid */
.v-crew .c-grid{display:flex;flex-direction:column;min-width:0}
.v-crew .c-row{display:grid;grid-template-columns:2.9rem 44px 44px 44px minmax(38px,1fr) 44px minmax(58px,1.4fr);column-gap:2px;align-items:center;min-height:48px;border-bottom:1px solid var(--line)}
.v-crew .c-row>*{min-width:0}
.v-crew .c-hd{min-height:30px;font-size:var(--t-11);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);background:var(--sunk);border-bottom:1px solid var(--line-2)}
.v-crew .c-hd>span{text-align:center;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.v-crew .c-hd>span:first-child{align-items:flex-start;padding-left:4px}
.v-crew .c-hd small{font-size:10px;letter-spacing:0;text-transform:none;font-weight:500}
.v-crew .c-hd .r,.v-crew .c-row .r{text-align:right;align-items:flex-end;padding-right:2px}
.v-crew .c-d{font-weight:600;font-size:var(--t-13);padding-left:4px;white-space:nowrap}
.v-crew .c-row.today .c-d{font-weight:700;text-transform:uppercase}
.v-crew .c-row.today{box-shadow:inset 3px 0 0 var(--ink)}
.v-crew .c-tk,.v-crew .c-n,.v-crew .c-f,.v-crew .c-j{height:44px;display:flex;align-items:center;justify-content:center;font-size:var(--t-13);font-weight:600;font-stretch:80%;border-radius:var(--r-ctl);color:var(--ink);white-space:nowrap;overflow:hidden}
.v-crew button.c-tk,.v-crew button.c-n{border:1px solid var(--line-2);background:var(--paper)}
.v-crew button.c-f,.v-crew button.c-j{background:transparent}
.v-crew .c-tk{font-size:var(--t-16);font-weight:700}
.v-crew .c-row.conf .c-tk{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.v-crew .c-row.plan .c-tk,.v-crew .c-row.plan button.c-n{border:1px dotted var(--committed);color:var(--committed);background:transparent}
.v-crew .c-row.plan .c-f,.v-crew .c-row.plan .c-a,.v-crew .c-row.plan .c-j{color:var(--committed)}

/* sticky action bar. On phones it rests on the tab bar, whose raised (+) sticks 18px above it (10-base .tabs .plus):

.v-crew .c-bar{--c-plus-rise:18px;position:sticky;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));z-index:5;display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:8px 0 calc(var(--c-plus-rise) + 8px);margin-top:var(--s2);background:var(--bg);border-top:1px solid var(--line-2)}

  .v-ledger .lg-tot{top:calc(env(safe-area-inset-top,0px) + var(--hdr-h,44px) + 40px)}
  .v-ledger .lg-long{display:inline}
  .v-ledger .lg-chips{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}
  .v-ledger .lg-g{flex-wrap:wrap}
  .v-ledger .lg-chip{min-height:36px}
  .v-ledger .lg-srow{grid-template-columns:minmax(0,28rem) minmax(0,14rem)}
}

/* as-of band sits under the header: push the sticky totals below it */
.v-ledger .lg-tot.past{top:calc(env(safe-area-inset-top,0px) + var(--hdr-h,44px) + 24px)}
@media (min-width:768px){ .v-ledger .lg-tot.past{top:calc(env(safe-area-inset-top,0px) + var(--hdr-h,44px) + 64px)} }

/* desktop ≥1100: use the width — one-line rows (swatch · title · meta · state words · amount · flag) */
@media (min-width:1100px){
  body.desk .v-ledger .lg-tot{top:calc(env(safe-area-inset-top,0px) + var(--hdr-h,44px))}
  body.desk .v-ledger .lg-tot.past{top:calc(env(safe-area-inset-top,0px) + var(--hdr-h,44px) + 24px)}
  body.desk .v-ledger .lg-tot{gap:2px var(--s6)}
  /* tracks shrink to 0 so rows fit the main column between the rails (532px at 1100, 712px at 1280) */
  body.desk .v-ledger .lg-row{grid-template-columns:14px minmax(0,2fr) minmax(0,2fr) minmax(0,1fr) 8rem 16px;min-height:32px;padding:4px 0;align-items:center}
  body.desk .v-ledger .lg-row>.sw{grid-column:1;grid-row:1}
  body.desk .v-ledger .lg-row>.t{grid-column:2;grid-row:1}
  body.desk .v-ledger .lg-row>.m{grid-column:3;grid-row:1}
  body.desk .v-ledger .lg-row>.w{grid-column:4;grid-row:1;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis}
  body.desk .v-ledger .lg-row>.a{grid-column:5;grid-row:1}
  body.desk .v-ledger .lg-row>.f{grid-column:6;grid-row:1}
  body.desk .v-ledger .lg-x{padding-left:22px;padding-right:calc(8rem + 24px)}
  body.desk .v-ledger .lg-detail .lg-lines table.t td.lg-desc{max-width:none}
}

/* ---- 42-timeline.css ---- */
/* 42-timeline.css — Timeline (Gantt). Everything scoped under .v-timeline. */

/* controls */
.v-timeline .tl-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px}
.v-timeline .tl-h{font-size:var(--t-11);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.v-timeline .tl-ctl .seg button{min-height:36px;min-width:44px}

/* scroll container + chart surface */
.v-timeline .tl-sc{position:relative;overflow-x:auto;overflow-y:hidden;max-width:100%;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);overscroll-behavior-x:contain}
.v-timeline .tl{position:relative;min-width:100%}
.v-timeline .tl-row{display:grid;grid-template-columns:var(--tl-lab) var(--tl-w);border-bottom:1px solid var(--line);position:relative}
.v-timeline .tl-row:last-child{border-bottom:0}
.v-timeline .tl-trk{position:relative;height:var(--tl-rh);z-index:1}

/* sticky label column */
.v-timeline .tl-lab{position:sticky;left:0;z-index:3;background:var(--bg);display:grid;grid-template-columns:22px minmax(0,1fr);align-items:stretch;border-right:1px solid var(--line-2);min-width:0}
.v-timeline .tl.desk .tl-lab{grid-template-columns:22px minmax(0,1fr) repeat(3,var(--tl-mcw))}
.v-timeline .tl-go{display:flex;flex-direction:column;justify-content:center;min-width:0;text-align:left;padding:0 6px 0 0;color:var(--ink);font:inherit}
.v-timeline button.tl-go{cursor:pointer}
.v-timeline .tl-nm{font-weight:600;font-size:var(--t-13);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.v-timeline .tl-sub{font-size:var(--t-12);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.v-timeline .tl-code{font-weight:700;font-stretch:80%;color:var(--ink-2);margin-right:2px}
.v-timeline .tl-car,.v-timeline .tl-car0{display:flex;align-items:center;justify-content:center;width:22px;color:var(--ink-2);font-size:var(--t-12)}
.v-timeline .tl-car{cursor:pointer;position:relative}
.v-timeline .tl-car::after{content:"";position:absolute;inset:-9px -6px}
.v-timeline .tl-car.on{color:var(--ink)}
.v-timeline .tl-mc{display:flex;align-items:center;justify-content:flex-end;padding:0 8px;font-size:var(--t-13);font-weight:600;font-variant-numeric:tabular-nums;font-stretch:80%;white-space:nowrap;border-left:1px solid var(--line)}

/* phone line 2: spans the full row, text sticks to the left edge */
.v-timeline .tl-l2{grid-column:1/-1;height:18px;position:relative;z-index:3}
.v-timeline .tl-l2i{position:sticky;left:0;display:inline-block;max-width:calc(100vw - 2*var(--gutter,16px));padding:0 8px 0 22px;font-size:var(--t-12);line-height:16px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--bg);text-align:left;font-family:inherit}
.v-timeline .tl-l2i .num{font-variant-numeric:tabular-nums;font-stretch:80%;font-weight:600;color:var(--ink)}
.v-timeline .tl-l2i .c-owed .num{color:var(--owed)}
.v-timeline .tl.ph .tl-row.has2{grid-template-rows:var(--tl-rh) 18px}
.v-timeline .tl.ph .tl-row.has2 .tl-lab{grid-row:1}

/* header row */
.v-timeline .tl-hd .tl-trk{height:34px}
.v-timeline .tl-hlab{align-items:end}
.v-timeline .tl-hname{grid-column:1/3;align-self:end;padding:0 6px 4px 6px;font-size:var(--t-11);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.v-timeline .tl-hlab .tl-mc{align-items:flex-end;padding-bottom:4px;font-size:var(--t-11);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);font-stretch:100%}
.v-timeline .tl-wks .wk{position:absolute;top:2px;height:14px;line-height:14px;padding-left:3px;font-size:var(--t-11);font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.v-timeline .tl-dls .dl{position:absolute;top:18px;height:14px;line-height:14px;text-align:center;font-size:10px;color:var(--ink-3);overflow:hidden}
.v-timeline .tl-dls .dl.on{background:var(--ink);color:var(--paper);font-weight:700}

/* background: Fridays + week rules; today line */
.v-timeline .tl-bg{position:absolute;top:0;bottom:0;z-index:0;pointer-events:none}
.v-timeline .tl-bg .fr{position:absolute;top:0;bottom:0;background:var(--sunk)}
.v-timeline .tl-bg .wr{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.v-timeline .tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);z-index:2;pointer-events:none}

/* group rows */
.v-timeline .tl-grp .tl-trk{height:22px}
.v-timeline .tl-grp .tl-lab{display:flex;align-items:flex-end}
.v-timeline .tl-gh{padding:0 6px 3px;font-size:var(--t-11);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* bars: geometry (inside tracks) */
.v-timeline .tl-trk .br,.v-timeline .tl-trk .cd,.v-timeline .tl-trk .pd,.v-timeline .tl-trk .bd,.v-timeline .tl-trk .ov,.v-timeline .tl-trk .rl{position:absolute;display:block;box-sizing:border-box}
.v-timeline .tl-trk .br{top:3px;height:calc(var(--tl-rh) / 2 - 2px);border:1.5px solid var(--ink-2);border-bottom:0}
.v-timeline .tl-trk .br.ol{border-left:0}
.v-timeline .tl-trk .br.or{border-right:0}
.v-timeline .tl-trk .cd,.v-timeline .tl-trk .pd{top:42%;bottom:3px}
.v-timeline .tl-trk .bd{bottom:5px;width:6px;height:6px}
.v-timeline .tl-trk .ov{bottom:0;height:2px;background:var(--stop)}

/* bars: fills (shared with the legend) */
.v-timeline .cd{background:var(--ink)}
.v-timeline .cd.s1{opacity:.32}
.v-timeline .cd.s2{opacity:.62}
@supports (background:color-mix(in srgb,red 50%,transparent)){
  .v-timeline .cd.s1{opacity:1;background:color-mix(in srgb,var(--ink) 30%,transparent)}
  .v-timeline .cd.s2{opacity:1;background:color-mix(in srgb,var(--ink) 60%,transparent)}
}
.v-timeline .pd{border:1px dotted var(--committed);background:transparent}
.v-timeline .bd{background:var(--ink-2)}
.v-timeline .br{border:1.5px solid var(--ink-2);border-bottom:0}
.v-timeline .ov{background:var(--stop)}

/* crews mode: job code on change + m·l digits (desktop) */
.v-timeline .tl-crew .tl-trk .cd,.v-timeline .tl-crew .tl-trk .pd{top:12px}
.v-timeline .tl.desk .tl-crew .tl-trk .cd,.v-timeline .tl.desk .tl-crew .tl-trk .pd{top:14px;bottom:4px}
.v-timeline .tl-trk .jc{position:absolute;top:1px;font-size:9px;line-height:10px;font-weight:700;color:var(--ink-2);white-space:nowrap;z-index:1}
.v-timeline .tl.desk .tl-trk .jc{font-size:10px;line-height:12px}
.v-timeline .tl-trk .dg{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:10px;font-weight:700;font-stretch:80%;font-variant-numeric:tabular-nums;color:var(--ink);overflow:hidden;white-space:nowrap}
.v-timeline .tl-trk .cd.s3.dg{color:var(--paper)}
.v-timeline .tl-trk .pd.dg{color:var(--committed)}

/* rental lanes */
.v-timeline .tl-rent{--tl-rh:22px}
.v-timeline .tl-rent .tl-lab{background:var(--bg)}
.v-timeline .tl-rn{font-size:var(--t-12);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.v-timeline .tl-trk .rl{top:9px;height:4px;background:var(--ink-2)}
.v-timeline .tl-trk .rl.np{top:8px;height:6px;background:repeating-linear-gradient(135deg,var(--warn) 0 1.5px,transparent 1.5px 4px);box-shadow:inset 0 0 0 1px var(--warn)}
.v-timeline .tl-trk .rl.idle::after{content:"";position:absolute;right:0;top:-4px;bottom:-4px;width:3px;background:var(--owed)}
.v-timeline .tl-trk .rq{position:absolute;top:3px;height:16px;line-height:16px;padding:0 4px;font-size:10.5px;font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:var(--r-pill);white-space:nowrap;z-index:1}

/* money lane */
.v-timeline .tl-cash .tl-trk{height:var(--tl-rh)}
.v-timeline .tl-trk .mk{position:absolute;top:0;width:22px;height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1;color:var(--float-ink);cursor:pointer;z-index:2}
.v-timeline .tl-trk .mk::after{content:"";position:absolute;inset:-9px -4px}
.v-timeline .tl-trk .mk.cp{color:var(--ink)}
.v-timeline .tl-trk span.mk{cursor:default}
.v-timeline .tl-cash .tl-nm{color:var(--ink-2)}

/* empty state inside the chart */
.v-timeline .tl .empty{position:sticky;left:0;width:max-content;max-width:calc(100vw - 2*var(--gutter,16px));padding:12px 8px;z-index:3}

/* legend */
.v-timeline .tl-leg{display:flex;flex-wrap:wrap;gap:4px 12px;padding:8px 0 0;font-size:var(--t-12);color:var(--ink-2)}
.v-timeline .tl-leg>span{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.v-timeline .tl-leg .lg{display:inline-block;width:9px;height:10px;box-sizing:border-box;vertical-align:middle}
.v-timeline .tl-leg .lg.bd{width:6px;height:6px}
.v-timeline .tl-leg .lg.br{width:14px;height:7px}
.v-timeline .tl-leg .lg.ov{width:14px;height:2px}
.v-timeline .tl-leg .lg-t{font-size:10px;font-weight:700;color:var(--ink-2)}
.v-timeline .tl-leg .lg-t.c-float{color:var(--float-ink)}

/* desktop */
.v-timeline .tl.desk .tl-nm{font-size:var(--t-14)}
.v-timeline .tl.desk .tl-rn{font-size:var(--t-12)}
@media (min-width:1100px){
  .v-timeline .tl-ctl{margin-bottom:12px}
}

/* export (investor report) */
.v-timeline.tl-export .tl-leg{padding-top:6px}
@media print{
  .v-timeline .tl-sc{overflow:visible}
  .v-timeline .tl-lab,.v-timeline .tl-l2i{position:static}
}
.v-timeline .tl-row.tl-sep{border-top:1px solid var(--line-2)}
@media (max-width:767px){.v-timeline .tl-ctl .tl-h{display:none}.v-timeline .tl-ctl .spacer{display:none}}

/* ---- 43-balances.css ---- */
/* 43-balances: Balances table. The table scrolls sideways inside its box (never the page); Description stays pinned. */
.v-bal{display:flex;flex-direction:column;gap:var(--s3);min-width:0}

.v-bal .bl-help{margin:0}

.v-bal .bl{border-collapse:collapse;width:100%;min-width:520px;font-size:var(--t-13)}
.v-bal .bl th,.v-bal .bl td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
.v-bal .bl thead th{font-size:var(--t-11);font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;background:var(--sunk);position:sticky;top:0}
.v-bal .bl .r{text-align:right}
.v-bal .bl .bl-d{position:sticky;left:0;z-index:1;background:var(--paper);text-align:left;font-weight:500;white-space:normal;min-width:150px;max-width:190px;box-shadow:1px 0 0 var(--line)}
.v-bal .bl thead .bl-d{background:var(--sunk);z-index:2}
.v-bal .bl .bl-d > span{display:block}
.v-bal .bl .bl-t{font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.v-bal .bl tr.tap{cursor:pointer}
.v-bal .bl tr.tap:hover td,.v-bal .bl tr.tap:hover .bl-d{background:var(--sunk)}
.v-bal .bl .bl-tot th,.v-bal .bl .bl-tot td{font-weight:700;font-size:var(--t-14);background:var(--float-bg);border-bottom:2px solid var(--line-2)}
.v-bal .bl .bl-tot .bl-d{background:var(--float-bg)}
.v-bal .t11{font-size:var(--t-11)}
.v-bal .bl-foot{margin:0}
.v-bal .bl tfoot .bl-tot th,.v-bal .bl tfoot .bl-tot td{border-top:2px solid var(--line-2);border-bottom:0}
.v-bal .bl-sum .kv > span small{display:block;font-size:var(--t-11);font-weight:400}
.v-bal .bl-sum .kv .v{font-size:var(--t-16);font-weight:700}
@media (max-width:600px){
  .v-bal .bl{min-width:0;font-size:var(--t-12)}
  .v-bal .bl th,.v-bal .bl td{padding:7px 4px}
  .v-bal .bl thead th{font-size:10px;letter-spacing:0}
  .v-bal .bl .bl-d{min-width:92px;max-width:104px;padding-left:6px;font-size:var(--t-12)}
  .v-bal .bl .bl-t{font-size:var(--t-12)}
  .v-bal .bl td.num{font-stretch:80%}
  .v-bal .bl .bl-tot th,.v-bal .bl .bl-tot td{font-size:var(--t-12)}
  .v-bal .bl td:last-child,.v-bal .bl th:last-child{padding-right:8px}
}
.v-bal .bl-me{color:var(--info)}
.v-bal .bl thead th.bl-me{color:var(--info)}
.v-bal .bl td.bl-me{background:color-mix(in srgb,var(--info-bg) 60%,transparent)}
.v-bal .bl .bl-leak{box-shadow:inset 3px 0 0 var(--stop)}
.v-bal .bl .bl-leak > span.c-stop{display:block}
.v-bal .bl-pf{display:inline-flex;align-items:center;gap:1px;vertical-align:-2px;margin-right:2px;position:relative}
.v-bal .bl-pf.ok{color:var(--prepaid);text-decoration:none}
.v-bal .bl-pf.ok::after{content:"";position:absolute;inset:-12px -10px}
.v-bal .bl-pf.no{color:var(--warn);opacity:.8}
.v-bal .bl-pf small{font-size:10px;font-weight:700}
.v-bal .bl .bl-pc{width:52px;min-width:52px;text-align:center;padding-left:6px;padding-right:2px}
.v-bal .bl td.bl-pc .bl-pf{flex-direction:column;gap:0;margin:0}
.v-bal .bl td.bl-pc svg{width:18px;height:18px}
.v-bal .bl td.bl-pc small{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.v-bal .bl-dlv{margin-top:4px;min-height:32px}
.v-bal .bl-seg{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
@media (max-width:600px){ .v-bal .bl .bl-pc{width:40px;min-width:40px;padding-left:4px} }
.v-bal .bl .bl-pc{position:sticky;left:0;z-index:1;background:var(--paper)}
.v-bal .bl thead .bl-pc{background:var(--sunk);z-index:2}
