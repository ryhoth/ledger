/* ---- job view: header, money strip, category sections ---- */
(function (SL) {
  "use strict";
  const U = SL.util, M = SL.model, ui = SL.ui;
  const X = (SL._project = SL._project || {});

  X.jobHead = (j, pid, D, t) => {
    const ro = X.noWrite(), st = M.jobStatus(j), b = X.budgetH(j), pct = X.pctDone(j, D);
    const pill = ro ? ui.statusPill(st) : `<button type="button" class="v-job-pill" data-act="editJob" data-id="${U.esc(j.id)}" id="job-status" aria-label="Change status">${ui.statusPill(st)}</button>`;
    const setL = (txt) => (ro ? `<span class="faint">${txt}</span>` : `<button type="button" class="lnk" data-act="editJob" data-id="${U.esc(j.id)}">${txt}</button>`);
    const ps = j.plannedStart, pe = j.plannedEnd;
    const plan = ps || pe ? `Plan ${ps ? U.esc(U.dShort(ps)) : "?"} – ${pe ? U.esc(U.dShort(pe)) : "?"}` : "Plan " + setL("set dates");
    const bud = b ? `Budget <b class="num">${ui.mw(b)}</b> · ` + (t.cost > b ? `<span class="c-stop">over by ${ui.mw(t.cost - b)}</span>` : `${Math.round((t.cost / b) * 100)}% used`) : "Budget " + setL("set");
    const done = pct != null ? `<b class="num">${pct}%</b> done` : "% done " + setL("set");
    const ar = j.ar ? ` <span class="v-job-ar">${U.t(j.ar)}</span>` : "";
    return `<div class="sec v-job-head">
      <h2 class="t20"><b class="v-prj-code">${U.esc(j.code || M.jobCode(j.id) || "")}</b> ${U.t(j.name)}${ar}</h2>
      <div class="hrow v-job-st">${pill}<span class="t12 muted">${X.statusWords(j, D, t, true)}</span></div>
      <div class="t12 muted v-job-plan">${plan} · ${bud} · ${done}</div></div>`;
  };

  X.jobStrip = (j, pid, D, t) => {
    const comm = (M.committed(pid).byJob || {})[j.id] || 0, k = "job.ident." + j.id, open = ui.isOpen(k, false);
    return `<div class="sec v-prj-strip v-job-strip">
      <button type="button" class="v-prj-hero" data-act="toggle" data-k="${U.esc(k)}" aria-expanded="${open}" aria-label="Cost to date; tap for the identity">
        <span class="lbl">Cost to date · SAR</span><span class="t20 num">${ui.m(t.cost)}</span></button>
      ${ui.moneyBar(t, { committed: comm, budget: X.budgetH(j) })}
      ${ui.legend(t, { committed: comm })}
      <div class="v-prj-ident${open ? " open" : ""}">${ui.identity(t)}</div></div>`;
  };

  X.crewLine = (u, D, jid) => {
    const cs = M.crewStats(u, D, jid);
    const pl = (n, w) => n + " " + w + (n === 1 ? "" : "s");
    let s = `${pl(cs.mDays, "master-day")} · ${pl(cs.lDays, "laborer-day")} · wages ${ui.mw(cs.wages)} + food ${ui.mw(cs.food)}`;
    if (cs.planDays) s += ` · <span class="c-committed">(${ui.mw(cs.plannedH)}) Planned</span>`;
    return `<div class="t12 muted v-job-crew">${s}</div>`;
  };

  X.catSections = (j, pid, D, t) => {
    const jid = j.id, keys = t.unitKeys ? [...t.unitKeys] : [];
    const units = keys.map((k) => M.unit(k)).filter(Boolean);
    let h = "";
    for (const c of M.CAT_ORDER) {
      const us = units.filter((u) => u.cat === c);
      if (!us.length) continue;
      const ct = (t.byCat && t.byCat[c]) || { cost: 0, owed: 0, prepaid: 0, noPrice: 0 };
      let right = ct.cost || !ct.noPrice ? ui.m(ct.cost) : '<span class="zero">–</span>';
      if (ct.noPrice) right += ` <span class="unk">? ${ct.noPrice}</span>`;
      if (ct.owed) right += ` <span class="c-owed t12">Owed ${ui.mw(ct.owed)}</span>`;
      h += `<div class="sec v-job-cat">` + ui.sech(`${ui.mono(c)} ${U.esc(X.catLabel(c))} <span class="muted">${us.length}</span>`, right);
      us.sort((a, b) => (a.date || a.weekStart || "") < (b.date || b.weekStart || "") ? 1 : -1);
      for (const u of us) {
        const sp = M.splitByJob(u, D)[jid] || { cost: 0 };
        const files = (u.kind !== "crew" && u.doc && u.doc.files) || [];
        const extra = c === "P" && files.length ? ui.photo(files[0], { link: true }) : "";
        h += ui.unitRow(u, D, { amountH: sp.cost, extraMeta: extra });
        if (u.kind === "crew") h += X.crewLine(u, D, jid);
      }
      h += "</div>";
    }
    if (!h) h = `<div class="empty">No costs on this job yet${X.noWrite() ? "" : ` · <button class="lnk" data-act="add" data-job="${U.esc(jid)}">+ Add cost</button>`}</div>`;
    return h;
  };
})(window.SL);

/* ---- job view: crew-days matrix, files, flags, registration ---- */
(function (SL) {
  "use strict";
  const U = SL.util, M = SL.model, ui = SL.ui;
  const X = (SL._project = SL._project || {});

  X.crewMatrix = (jid, pid, D) => {
    const sat = U.weekStart(D);
    const days = U.weekDays(sat).filter((d) => M.isWorkDay(pid, d));
    const crews = M.unitsFor(pid).filter((u) => u.kind === "crew" && u.weekStart === sat && u.days.some((d) => (d.job || "") === jid));
    if (!crews.length) return "";
    const head = days.map((d) => `<th scope="col" class="r${d === D ? " v-job-today" : ""}">${U.esc(U.dStrip(d))}</th>`).join("");
    const rows = crews.map((u) => {
      const cells = days.map((d) => {
        const x = u.days.find((y) => y.date === d && (y.job || "") === jid);
        const cls = "r num" + (d === D ? " v-job-today" : "");
        if (!x) return `<td class="${cls}"><span class="faint">·</span></td>`;
        const n = (x.m || 0) + (x.l || 0);
        return x.plan ? `<td class="${cls} c-committed" title="Planned">(${n})</td>` : `<td class="${cls}" title="${x.m || 0} M · ${x.l || 0} L">${n}</td>`;
      }).join("");
      return `<tr><th scope="row" class="tap" data-go="${U.esc(ui.href("crew", u.crewId))}">${U.t(M.crewName(u.crewId))}</th>${cells}</tr>`;
    }).join("");
    return `<div class="sec v-job-days">${ui.sech("Crew days", U.esc(U.dWeek(sat)))}
      <div class="tscroll"><table class="t"><thead><tr><th scope="col">heads</th>${head}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
  };

  X.files = (j, t) => {
    const out = [], seen = new Set();
    const push = (id, label) => { if (!id || seen.has(id)) return; seen.add(id); out.push(`<div class="v-job-file">${ui.photo(id)}<span class="t12">${U.t(label)}</span></div>`); };
    for (const id of j.files || []) push(id, "Job file");
    const keys = t && t.unitKeys ? [...t.unitKeys] : [];
    for (const k of keys) {
      const u = M.unit(k); if (!u || u.kind === "crew" || !u.doc) continue;
      (u.doc.files || []).forEach((id, i) => push(id, u.title + (u.date ? " · " + U.dDM(u.date) : "") + (i ? " (" + (i + 1) + ")" : "")));
    }
    if (!out.length) return "";
    return `<div class="sec v-job-files">${ui.sech("Files", out.length)}<div class="v-job-filelist">${out.join("")}</div></div>`;
  };

  /** Open flags on the job. Read-only viewers get no section at all: titles and details are for the
   *  owner (spec part 2 §G; ui.flagSlot shows them no glyph either). */
  X.flags = (jid) => {
    if (X.ro() || !SL.flags || !SL.flags.forRef) return "";
    const fs = (SL.flags.forRef("job:" + jid) || []).filter((f) => !f.acked);
    if (!fs.length) return "";
    return `<div class="sec v-job-flags">${ui.sech("Flags", fs.length)}` + fs.map((f) =>
      `<button type="button" class="row nosw tap" data-act="flag" data-id="${U.esc(f.id)}"><span class="t">${ui.sevGlyph(f.sev)} ${U.t(f.title)}</span><span class="a"></span><span class="f"></span><span class="m">${U.t(f.detail || "")}</span></button>`).join("") + "</div>";
  };

  X.renderJob = (route, pid) => {
    const jid = (route.args || [])[0], j = jid && M.job(jid), D = ui.D();
    const back = `<a class="lnk v-job-back" href="${U.esc(ui.href("project"))}" data-go="${U.esc(ui.href("project"))}">‹ Project</a>`;
    if (!j || j.void || M.pidOf(j) !== pid) return `<div class="v-job"><div class="hrow v-prj-top">${back}<span class="spacer"></span>${ui.asOfChip()}</div><div class="empty">This job isn't in this project. ${back}</div></div>`;
    const t = M.byJob(pid, D)[jid] || { cost: 0, paid: 0, paidOff: 0, owed: 0, prepaid: 0, noPrice: 0, units: 0, unitKeys: new Set(), byCat: {} };
    let h = `<div class="v-job"><div class="hrow v-prj-top">${back}<span class="spacer"></span>${ui.asOfChip()}</div>`;
    h += X.jobHead(j, pid, D, t) + X.jobStrip(j, pid, D, t) + X.catSections(j, pid, D, t);
    h += X.crewMatrix(jid, pid, D) + X.files(j, t) + X.flags(jid);
    if (!X.noWrite()) h += `<div class="btns v-job-btns"><button class="btn" data-act="add" data-job="${U.esc(jid)}" id="job-add">+ Add cost</button><button class="btn sec" data-act="editJob" data-id="${U.esc(jid)}" id="job-edit">Edit job</button></div>`;
    return h + "</div>";
  };

  SL.views.job = { tab: "project", asOf: true, render: (route, pid) => X.renderJob(route, pid) };
})(window.SL);

/* ---- job sheet: A.newJob({pick}) / A.editJob({id}) ---- */
(function (SL) {
  "use strict";
  const U = SL.util, M = SL.model, ui = SL.ui, A = SL.actions;
  const X = (SL._project = SL._project || {});
  const STS = [["planned", "Pending start"], ["active", "In progress"], ["hold", "On hold"], ["done", "Done"]];

  /** Code from a name: first letter + next consonant (TL, PL, SH), else first two letters; unique in the project. */
  X.autoCode = (name, pid, selfId) => {
    const used = new Set(M.jobs(pid).filter((j) => j.id !== selfId).map((j) => String(j.code || "").toUpperCase()));
    const words = String(name || "").normalize("NFKD").replace(/[^A-Za-z]+/g, " ").trim().toUpperCase().split(" ").filter(Boolean);
    if (!words.length) return "";
    const w = words[0], c = [];
    for (let i = 1; i < w.length; i++) if (!"AEIOU".includes(w[i])) c.push(w[0] + w[i]);
    if (w.length > 1) c.push(w.slice(0, 2));
    if (words.length > 1) c.push(words.slice(0, 4).map((x) => x[0]).join(""));
    for (let i = 1; i < w.length; i++) c.push(w[0] + w[i]);
    if (w.length > 2) c.push(w.slice(0, 3));
    const ok = c.filter((x) => x.length >= 2 && x.length <= 4);
    return ok.find((x) => !used.has(x)) || ok[0] || "";
  };

  const pick = (s) => { const o = Object.assign({}, s); delete o.codeTouched; return JSON.stringify(o); };

  X.jobBody = (sh) => {
    const s = sh.state;
    return `${ui.field({ id: "job-name", f: "name", label: "Name", value: s.name, attrs: 'autocomplete="off" autofocus' })}
      ${ui.field({ id: "job-ar", f: "ar", label: "Arabic name", value: s.ar, attrs: 'dir="rtl" lang="ar" autocomplete="off"' })}
      ${ui.field({ id: "job-code", f: "code", label: "Code", value: s.code, attrs: 'maxlength="4" autocapitalize="characters" autocomplete="off"', hint: "2–4 letters, shown on rows (PL, TL)" })}
      <div class="fld"><span class="lbl">Status</span>${ui.seg("status", STS, s.status, { full: true, label: "Status" })}</div>
      <div class="grid2">${ui.field({ id: "job-ps", f: "plannedStart", label: "Planned start", type: "date", value: s.plannedStart })}${ui.field({ id: "job-pe", f: "plannedEnd", label: "Planned end", type: "date", value: s.plannedEnd })}</div>
      <div class="grid2">${ui.field({ id: "job-budget", f: "budget", label: "Budget (SAR)", value: s.budget, num: true, hint: "incl. VAT · empty = none" })}${ui.field({ id: "job-pct", f: "pct", label: "% done today", value: s.pct, num: true, hint: "0–100" })}</div>`;
  };

  X.saveJob = async (sh, j, pid, pickField) => {
    const s = sh.state, name = String(s.name || "").trim(), code = String(s.code || "").trim().toUpperCase(), today = U.today();
    if (!name) return sh.error("Give the job a name.");
    if (!/^[A-Z]{2,4}$/.test(code)) return sh.error("Code: 2–4 letters, like PL or TL.");
    const clash = M.jobs(pid).find((x) => x.id !== (j && j.id) && String(x.code || "").toUpperCase() === code);
    if (clash) return sh.error("Code " + code + " is already used by " + clash.name + ".");
    if (s.plannedStart && s.plannedEnd && s.plannedEnd < s.plannedStart) return sh.error("Planned end is before the planned start.");
    const budget = s.budget === "" || s.budget == null ? 0 : U.num(s.budget);
    if (!(budget >= 0)) return sh.error("Budget can't be below zero.");
    const pct = s.pct === "" || s.pct == null ? null : U.num(s.pct);
    if (pct != null && !(pct >= 0 && pct <= 100)) return sh.error("% done is 0 to 100.");
    const data = { name, ar: String(s.ar || "").trim(), code, status: s.status || "planned", plannedStart: s.plannedStart || "", plannedEnd: s.plannedEnd || "", budget: U.round2(budget) };
    sh.busy(true);
    if (j) {
      const before = U.clone(SL.S.jobs[j.id] || j); delete before.id;
      if (pct != null && pct !== X.pctDone(j, today)) data.pct = { [today]: pct };
      const r = await SL.store.patch("jobs", j.id, data);
      sh.busy(false);
      if (!r || !r.ok) return sh.error(SL.store.errText(r));
      sh.close(true);
      ui.toast(`Saved <b>${U.esc(code)}</b> ${U.t(name)}`, { undo: async () => { const r2 = await SL.store.put("jobs", j.id, before); if (!r2 || !r2.ok) ui.toast(U.esc(SL.store.errText(r2))); } });
      return;
    }
    const base = "job-" + U.slug(name); let id = base, n = 2;
    while ((SL.S.jobs || {})[id]) id = base + "-" + n++;
    const order = Math.max(0, ...M.jobs(pid).map((x) => U.num(x.order) || 0)) + 1;
    const doc = Object.assign({ projectId: pid }, data, { pct: pct != null ? { [today]: pct } : {}, order, createdAt: Date.now(), acks: {} });
    const r = await SL.store.put("jobs", id, doc);
    sh.busy(false);
    if (!r || !r.ok) return sh.error(SL.store.errText(r));
    const under = ui.sheets[ui.sheets.length - 2];
    if (pickField && under && under !== sh) {
      ui.setPath(under.state, pickField, id);
      // the form isn't live and jobChips reads SL.S: refresh it when the job's snapshot arrives
      SL.store.waitFor("jobs", id).then(() => { if (ui.sheets.includes(under)) under.refresh(); });
    }
    ui.rememberJob(pid, id);
    sh.close(true);
    ui.toast(`Added job <b>${U.esc(code)}</b> ${U.t(name)}`, pickField ? {} : { undo: async () => { const r2 = await SL.store.patch("jobs", id, { void: true }); if (!r2 || !r2.ok) ui.toast(U.esc(SL.store.errText(r2))); } });
  };

  X.openJobSheet = (j, pickField) => {
    if (X.ro()) return;
    const pid = j ? M.pidOf(j) : ui.pid();
    const s0 = j ? { name: j.name || "", ar: j.ar || "", code: j.code || M.jobCode(j.id) || "", status: M.jobStatus(j), plannedStart: j.plannedStart || "", plannedEnd: j.plannedEnd || "",
      budget: U.num(j.budget) > 0 ? U.num(j.budget) : "", pct: X.pctDone(j, U.today()) != null ? X.pctDone(j, U.today()) : "", codeTouched: true }
      : { name: "", ar: "", code: "", status: pickField ? "active" : "planned", plannedStart: "", plannedEnd: "", budget: "", pct: "", codeTouched: false };
    const init = pick(s0);
    return ui.sheet({
      title: j ? "Edit job" : "New job", state: U.clone(s0), body: X.jobBody,
      foot: () => `<button class="btn sec" data-act="close" id="job-cancel">Cancel</button><button class="btn" data-act="jobSave" id="job-save">${j ? "Save" : "Add job"}</button>`,
      acts: { jobSave: (d, el, ev, sh) => X.saveJob(sh, j, pid, pickField) },
      onInput: (sh, f, v) => {
        if (f === "code") sh.state.codeTouched = true;
        if (f === "name" && !sh.state.codeTouched) { const c = X.autoCode(v, pid, j && j.id); sh.state.code = c; const ci = sh.el.querySelector("#job-code"); if (ci) ci.value = c; }
      },
      dirty: (sh) => pick(sh.state) !== init,
    });
  };

  A.newJob = (d) => X.openJobSheet(null, (d && d.pick) || "");
  A.editJob = (d) => { const j = d && d.id && M.job(d.id); if (j) X.openJobSheet(j, ""); };
})(window.SL);

/* ---- A.tagUntagged: put costs / crew weeks that have no job onto a job ---- */
(function (SL) {
  "use strict";
  const U = SL.util, M = SL.model, ui = SL.ui, A = SL.actions;
  const X = (SL._project = SL._project || {});

  X.untagged = (pid) => M.unitsFor(pid).filter((u) => (u.kind === "crew" ? (u.days || []).some((d) => !d.job) : !u.jobId && !(u.doc && u.doc.void)));

  X.tagOne = async (sh, d) => {
    const u = M.unit(d.key), jid = d.job || "", pid = sh.state.pid;
    if (!u || !jid || sh.isBusy) return;
    sh.busy(true);
    let r, undo;
    if (u.kind === "crew") {
      const old = (u.doc && u.doc.job) || "";
      r = await SL.store.patchBlock(pid, u.weekStart, u.crewId, { job: jid });
      undo = () => SL.store.patchBlock(pid, u.weekStart, u.crewId, { job: old });
    } else {
      const old = u.jobId || "";
      r = await SL.store.patch("costs", u.id, { jobId: jid });
      undo = () => SL.store.patch("costs", u.id, { jobId: old });
    }
    sh.busy(false);
    if (!r || !r.ok) return sh.error(SL.store.errText(r));
    sh.err = ""; ui.rememberJob(pid, jid); sh.refresh();
    ui.toast(`Tagged ${U.t(u.title)} → <b>${U.esc(M.jobCode(jid))}</b>`, { undo: async () => { const r2 = await undo(); if (!r2 || !r2.ok) ui.toast(U.esc(SL.store.errText(r2))); } });
  };

  X.tagBody = (sh) => {
    const pid = sh.state.pid, D = U.today(), us = X.untagged(pid);
    if (!us.length) return `<div class="empty">Every cost is on a job.</div>`;
    return `<p class="t12 muted">Tap a job to move each cost onto it. ${us.length} without a job.</p>` + us.map((u) => {
      const r = M.calc(u, D), part = u.kind === "crew" ? ' <span class="t12 muted">(days with no job)</span>' : "";
      return `<div class="v-tag-item"><div class="row nosw"><span class="t">${ui.mono(u.cat)} ${U.t(u.title)}${part}</span>
        <span class="a num">${u.noPrice && !r.paid ? '<span class="unk">?</span>' : ui.m(r.inc)}</span><span class="f"></span>
        <span class="m">${ui.unitMeta(u, D)}</span><span class="w">${ui.stateWords(u, D)}</span></div>
        ${ui.jobChips(pid, "", { act: "prjTagSet", extra: ` data-key="${U.esc(u.key)}"`, add: false })}</div>`;
    }).join("");
  };

  A.tagUntagged = () => {
    if (X.ro()) return;
    const pid = ui.pid();
    return ui.sheet({
      title: "Tag costs to jobs", state: { pid }, live: true, body: X.tagBody,
      foot: () => `<button class="btn sec" data-act="newJob" id="tag-newjob">+ New job</button><button class="btn" data-act="close" id="tag-done">Done</button>`,
      acts: { prjTagSet: (d, el, ev, sh) => X.tagOne(sh, d) },
    });
  };
})(window.SL);

/* ---- 41-ledger.js ---- */
/* 41-ledger: the Ledger view (#ledger[.<cat>[.<state>]]), the unit detail block / sheet (openUnit) and the CSV export. */
/* chunk 1: filter state, persistence, route presets, filtering, grouping */
(function (SL) {
  "use strict";
  const U = SL.util, M = SL.model, ui = SL.ui;
  const X = (SL._ledger = SL._ledger || {});

  X.STATES = [["owed", "Owed"], ["paid", "Paid off"], ["prepaid", "Prepaid"], ["noprice", "No price"], ["planned", "Planned"]];
  X.VIAS = [["float", "Float"], ["ryan", "Ryan"], ["unpaid", "Unpaid"]];
  X.blank = () => ({ cats: [], job: "*", st: [], via: [], photo: false, q: "" });
  X.byPid = X.byPid || {};

(function (SL) {
  "use strict";

  };

  const txt = (v) => { const s = v == null ? "" : String(v); return /^[=+\-@\t\r]/.test(s) ? "'" + s : s; };
  const amt = (h) => (h / 100).toFixed(2);

  X.csvText = (pid, D) => {
    const fj = X.get(pid).job, ro = ui.readOnlyUI();
    const units = X.groups(X.filtered(pid, D), D, fj).reduce((a, g) => a.concat(g.units), []);
    // notes are hidden from read-only viewers (spec part 2 §G): their file has no note column, only a
    // "marks" column with the figure markers below (job part, no price, estimate), which are not notes
    const head = ["date", "type", "title", "supplier/payee", "job", "cost_to_date", "paid", "paid_off", "owed", "prepaid", "paid_via", "doc_no", ro ? "marks" : "note"];
    const rows = units.map((u) => {
      const r = X.calcFor(u, D, fj), d = u.doc || {};
      const date = u.kind === "crew" ? u.weekStart : u.date || "";
      const via = X.viaOf(u, D).map((v) => (v === "ryan" ? "Ryan" : v === "float" ? "float" : "unpaid")).join("+");
      const job = u.kind === "crew" ? U.uniq(u.days.map((x) => M.jobCode(x.job || u.jobId)).filter(Boolean)).join("+") : M.jobCode(u.jobId);
      const title = u.kind === "crew" ? u.title + " · week of " + u.weekStart : u.title;
      let note = ro ? "" : d.note || "";
      if (r.part) note = (M.jobCode(fj) || "no job") + " part of " + amt(r.full.inc) + (note ? " · " + note : "");
      if (u.noPrice && !r.paid) note = "No price · counts 0" + (note ? " · " + note : "");
      if (u.est) note = "est." + (note ? " · " + note : "");
      return [date, (M.CATS[u.cat] || {}).label || u.cat, txt(title), txt(u.payee || ""), job || "", u.noPrice && !r.paid ? "?" : amt(r.inc), amt(r.paid), amt(r.paidOff), amt(r.owed), amt(r.prepaid), via, txt((d.doc && d.doc.no) || ""), txt(note)];
    });
    const lines = [head].concat(rows).map((row) => row.map(q).join(","));
    lines.push("", q("All amounts SAR incl. VAT · as of " + D));
    return lines.join("\r\n") + "\r\n";
  };

  A.csv = async () => {
    const pid = ui.pid(), D = ui.D();
    const csv = X.csvText(pid, D);
    const name = "site-ledger-" + pid + "-" + D + ".csv";
    const r = await SL.store.download(name, "﻿" + csv);

/* 42-timeline.js — Timeline (Gantt): jobs/crews rows over day columns, money lane, SL.timeline export.
 * Pure HTML/CSS: one grid per row (sticky label + relative track), absolutely positioned bars. */

/* ---- chunk 1: geometry, range, small formatters ---- */
(function (SL) {
  "use strict";
  const U = SL.util, M = SL.model, ui = SL.ui;
  const X = (SL._timeline = SL._timeline || {});
  const ZK = "sl.timelineZoom";

  X.isDesk = () => typeof window !== "undefined" && window.innerWidth >= 1100;
  X.zoom = () => {
    const z = U.lsGet(ZK, null);
    return z === "2w" || z === "month" || z === "all" ? z : X.isDesk() ? "month" : "2w";
  };
  X.setZoom = (z) => U.lsSet(ZK, z);

  /** Geometry constants for phone or desktop. */
  X.geo = (desk) => ({
    desk: !!desk,
    dw: desk ? 26 : 22, fw: 10,                 // day width, Friday width
    lw: desk ? 220 : 120,                        // label column
    mcw: desk ? 76 : 0, mcn: desk ? 3 : 0,       // money columns (Cost | Owed | Budget)
    rh: desk ? 40 : 26,                          // bar-track height of a main row
    l2: desk ? 0 : 18,                           // phone second line height
    sub: 22,                                     // rental lane height
  });

  /** Latest planned date anywhere in the project (jobs' plannedEnd and plan crew days). */
  X.planHorizon = (pid) => {
    let mx = "";
    for (const j of M.jobs(pid)) if (U.isISO(j.plannedEnd)) mx = U.maxDate(mx, j.plannedEnd);
    for (const u of M.unitsFor(pid)) if (u.kind === "crew") for (const d of u.days) if (d.plan) mx = U.maxDate(mx, d.date);
    return mx;
  };
  X.planDaysMax = (pid) => {
    let mx = "";
    for (const u of M.unitsFor(pid)) if (u.kind === "crew") for (const d of u.days) if (d.plan) mx = U.maxDate(mx, d.date);
    return mx;
  };
  /** Earliest date with anything on it (project start, activity, plans, cash). */
  X.projectStart = (pid) => {
    const p = M.project(pid) || {};
    let mn = U.isISO(p.startDate) ? p.startDate : "";
    for (const j of M.jobs(pid)) if (U.isISO(j.plannedStart)) mn = U.minDate(mn, j.plannedStart);
    for (const u of M.unitsFor(pid)) {
      if (u.kind === "crew") { for (const d of u.days) mn = U.minDate(mn, d.date); }
      else if (u.kind === "rental") { if (U.isISO(u.in)) mn = U.minDate(mn, u.in); }
      else if (U.isISO(u.date)) mn = U.minDate(mn, u.date);
    }
    return mn;
  };

  /** Date range {from, to} (Sat … Fri) for a zoom, as of D. */
  X.range = (pid, D, zoom) => {
    const sat = U.weekStart(D);
    let from, to;
    if (zoom === "all") {
      from = U.weekStart(X.projectStart(pid) || U.addDays(sat, -7));
      to = U.maxDate(X.planHorizon(pid), U.addDays(D, 14));
    } else if (zoom === "month") {
      from = U.addDays(sat, -14); to = U.addDays(sat, 20);
    } else {
      from = U.addDays(sat, -7); to = U.addDays(sat, 6);
      const pm = X.planDaysMax(pid);
      if (pm && pm > to) to = U.minDate(pm, U.addDays(sat, 27));
    }
    if (from > D) from = U.weekStart(D);
    to = U.addDays(U.weekStart(to), 6);          // end on a Friday
    return { from, to };
  };

  /** Columns: [{date, x, w, fri, sat, i}], plus index by date and total width. */
  X.cols = (range, g) => {
    const days = [], at = {};
    let x = 0, d = range.from, i = 0;
    while (d <= range.to && i < 800) {
      const fri = U.isFri(d), w = fri ? g.fw : g.dw;
      const c = { date: d, x, w, fri, sat: U.dow(d) === 6, i };
      days.push(c); at[d] = c; x += w; d = U.addDays(d, 1); i++;
    }
    return { days, at, width: x, from: range.from, to: range.to };
  };
  /** Left px of a date (clamped to the range); edge: "start"|"end"|"mid". */
  X.xOf = (C, date, edge) => {
    if (!date || date < C.from) return 0;
    if (date > C.to) return C.width;
    const c = C.at[date];
    if (!c) return 0;
    return edge === "end" ? c.x + c.w : edge === "mid" ? c.x + c.w / 2 : c.x;
  };
  /** Span {left, width} for [a, b] inclusive, or null when outside the range. */
  X.span = (C, a, b) => {
    if (!a || !b || b < C.from || a > C.to) return null;
    const l = X.xOf(C, a < C.from ? C.from : a, "start"), r = X.xOf(C, b > C.to ? C.to : b, "end");

  X.step = (n) => (n >= 8 ? 3 : n >= 4 ? 2 : n > 0 ? 1 : 0);

(function (SL) {

(function (SL) {

      X.parties[party].owed += r.owed; X.parties[party].prepaid += r.prepaid;

          meta: [U.dShort(u.date), M.jobCode(u.jobId), r.paid ? "paid ahead: Prepaid until " + w : "not paid either"].filter(Boolean).join(" · ") }));
      } else if (r.inc) {

        let title = U.t(u.title), meta = M.unitMeta(u).map((x) => U.t(x));
        if (u.kind === "rental") { const n = r.parts.length; title += " on site"; meta = ["in " + U.dShort(u.in) + (u.out ? " → " + U.dShort(u.out) : ""), n + " day" + (n > 1 ? "s" : "") + " × " + U.mw(u.daily / 100), M.jobCode(u.jobId)].filter(Boolean); }
        else if (u.kind === "purchase") title += " delivered";

          meta: [U.dShort(p.date), u.kind === "crew" ? "wk " + U.dDM(u.weekStart) : U.t(u.title), note].filter(Boolean).join(" · ") }));

  const NODOC = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 1.5h5.5L13 5v9.5H4z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2 1.6" stroke-linejoin="round"/></svg>';

/* ---- chunk 2: form state + money math (halalas) ---- */
(function (SL) {
  "use strict";
  const U = SL.util, M = SL.model;
  const X = (SL._docs = SL._docs || {});
  const VAT = 0.15;
  X.VAT = VAT;
  const H = (v) => (v === "" || v == null ? null : U.hal(v));
  X.H = H;

  X.blankLine = (o) => Object.assign({ desc: "", ar: "", item: "", itemId: "", qty: 1, unit: "", price: "", amt: "", amtEd: false }, o || {});

  /** Line amount in halalas: qty × price unless the amount was typed. null when unknown. */
  X.lineH = (l) => {
    if (l.amtEd && l.amt !== "" && l.amt != null) return U.hal(l.amt);
    if (l.price === "" || l.price == null) return l.amt !== "" && l.amt != null ? U.hal(l.amt) : null;
    const q = l.qty === "" || l.qty == null ? 1 : U.num(l.qty);
    return Math.round(q * U.num(l.price) * 100);
  };

  /** Purchase totals: {sumH, sub, vat, total, calc:{sub,vat,total}, checks:[[label, ok|null]]} (all h). */
  X.totals = (st) => {
    const out = { sumH: 0, checks: [] };
    const lines = st.mode === "total" ? [] : st.lines || [];
    for (const l of lines) out.sumH += X.lineH(l) || 0;
    let c;
    if (st.mode === "plus") c = { sub: out.sumH, vat: Math.round(out.sumH * VAT), total: 0 };
    else if (st.mode === "incl") { const s = Math.round(out.sumH / (1 + VAT)); c = { sub: s, vat: out.sumH - s, total: out.sumH }; }
    else {
      const t = H(st.total) || 0;
      if (st.totVat === "none") c = { sub: t, vat: 0, total: t };
      else { const s = Math.round(t / (1 + VAT)); c = { sub: s, vat: t - s, total: t }; }
    }
    if (st.mode === "plus") c.total = c.sub + c.vat;
    out.calc = c;
    out.sub = st.subEd && H(st.subtotal) != null ? H(st.subtotal) : c.sub;
    out.vat = st.vatEd && H(st.vat) != null ? H(st.vat) : c.vat;
    out.total = st.mode === "total" ? c.total : st.totEd && H(st.total) != null ? H(st.total) : st.subEd || st.vatEd ? out.sub + out.vat : c.total;
    const tol = Math.max(5, lines.length);
    if (st.mode !== "total" && lines.length) out.checks.push(["Σ lines = subtotal", Math.abs((st.mode === "incl" ? c.sub : out.sumH) - out.sub) <= tol]);
    if (out.vat > 0 || st.mode === "plus") out.checks.push(["VAT = 15%", Math.abs(Math.round(out.sub * VAT) - out.vat) <= 5]);
    else out.checks.push(["no VAT", null]);
    out.checks.push(["subtotal + VAT = total", Math.abs(out.sub + out.vat - out.total) <= 2]);
    return out;
  };

  /** Service / other amount (h): qty × unit price unless typed. */
  X.svcH = (st) => {
    if (st.type === "other") return H(st.amount);
    if (st.amtEd && H(st.amount) != null) return H(st.amount);
    if (st.unitPrice === "" || st.unitPrice == null) return H(st.amount);
    const q = st.qty === "" || st.qty == null ? 1 : U.num(st.qty);
    return Math.round(q * U.num(st.unitPrice) * 100);
  };
  /** The cost (h) of whatever form this is. */
  X.costH = (st) => (st.type === "purchase" ? X.totals(st).total : X.svcH(st));

  /* ---- catalog lookups ---- */
  const norm = (s) => String(s || "").trim().toLowerCase().replace(/\s+/g, " ");
  X.norm = norm;
  X.findItem = (text) => {
    const n = norm(text); if (!n) return "";
    const items = M.items();
    if (items[text]) return text;
    for (const [id, it] of Object.entries(items)) {
      if (norm(it.name) === n || norm(it.ar) === n || (it.aliases || []).some((a) => norm(a) === n)) return id;
    }
    return "";
  };
  X.findSupplier = (text) => {
    const n = norm(text); if (!n) return "";
    for (const [id, s] of Object.entries(M.suppliers())) {
      if (norm(s.name) === n || norm(s.ar) === n || (s.aliases || []).some((a) => norm(a) === n)) return id;
    }
    return "";
  };
  X.itemName = (id) => { const it = M.items()[id]; return it ? it.name || it.ar || id : ""; };
  /** Supplier names: catalog first, then any seen on costs. */
  X.supplierNames = () => {
    const names = Object.values(M.suppliers()).map((s) => s.name).filter(Boolean);
    for (const c of Object.values(SL.S.costs || {})) if (c && c.supplier && !c.void) names.push(c.supplier);
    return U.uniq(names).sort((a, b) => a.localeCompare(b));
  };
})(window.SL);

(function (SL) {

      st.lines = lines.map((l) => {
        const L = X.blankLine({ desc: l.desc || "", ar: l.ar || "", itemId: l.itemId || "", item: X.itemName(l.itemId) || "",
          qty: l.qty == null ? "" : l.qty, unit: l.unit || "", price: l.unitPrice == null ? "" : l.unitPrice, amt: l.amount == null ? "" : l.amount });
        const auto = X.lineH(Object.assign({}, L, { amtEd: false }));
        L.amtEd = l.amount != null && (auto == null || auto !== U.hal(l.amount));
        return L;
      });
      if (!st.lines.length) st.lines = [X.blankLine()];
      st.total = c.amount == null ? "" : c.amount;
      const t = X.totals(st);
      if (c.subtotal != null && st.mode !== "total") { st.subtotal = c.subtotal; st.subEd = U.hal(c.subtotal) !== t.calc.sub; }
      if (c.vat != null && st.mode !== "total") { st.vat = c.vat; st.vatEd = U.hal(c.vat) !== t.calc.vat; }
      const t2 = X.totals(Object.assign({}, st, { totEd: false }));
      st.totEd = st.mode !== "total" && c.amount != null && U.hal(c.amount) !== t2.total;
    } else if (c.type === "service") {
      Object.assign(st, { sub: c.sub || "other", desc: c.desc || "", supplier: c.supplier || "", qty: c.qty == null ? "" : c.qty,
        unit: c.unit || "lump", unitPrice: c.unitPrice == null ? "" : c.unitPrice, amount: c.amount == null ? "" : c.amount });
      const auto = X.svcH(Object.assign({}, st, { amtEd: false, amount: "" }));
      st.amtEd = c.amount != null && (auto == null || auto !== U.hal(c.amount));
    } else {
      Object.assign(st, { desc: c.desc || "", amount: c.amount == null ? "" : c.amount, crewId: c.crewId || "" });
    }
    return st;
  };

  /** A typed price quote: the purchase form, saved to quotes/ (open), never a cost. */

/* ---- chunk 1: shared helpers + the Docs segment bar ---- */

  X.docNo = (c) => (c.doc && c.doc.no) || c.no || "";

/* ---- chunk 2: #invoices (purchases + services by day) ---- */

(function (SL) {

      R2: (k) => pl(k, "rental") + " may be idle on site.",

      J1: (k) => "Some costs are not yet assigned to a job; they show under “Not on a job”.",

      C1: (k) => pl(k, "crew week") + " " + (k === 1 ? "has" : "have") + " been owed for more than a week.",
      C2: (k) => pl(k, "planned crew day") + " " + (k === 1 ? "is" : "are") + " not yet confirmed; planned days are never counted as cost.",
      C4: (k) => pl(k, "crew day") + " with an unusual headcount " + (k === 1 ? "is" : "are") + " being checked.",
      I1: (k) => pl(k, "paid cost") + " " + (k === 1 ? "has" : "have") + " no receipt photo yet.",
      I3: (k) => "Some documents are billed to another name and are being checked.",

      I6: (k) => pl(k, "large document") + " " + (k === 1 ? "is" : "are") + " awaiting review.",

    let x = 0, y = 0;
    for (const u of M.unitsFor(pid)) {
      if (u.kind === "crew") continue;

      y++; if (u.doc && Array.isArray(u.doc.files) && u.doc.files.length) x++;
    }
    let lastCount = null;

  X.frozenList = (pid, curId) => {

        const s = sh.state;
        let h = '<div class="lbl">Default day rates (SAR) for new crews</div><div class="grid3">' +
          ui.field({ id: "adm-r-m", f: "m", label: "M · master", num: true, value: s.m }) + ui.field({ id: "adm-r-l", f: "l", label: "L · laborer", num: true, value: s.l }) +
          ui.field({ id: "adm-r-food", f: "food", label: "Food / day", num: true, value: s.food }) + "</div>";
        h += '<div class="lbl">Trades</div>';
        h += s.trades.map((t, i) => `<div class="v-settings-trade">
          <div class="grid2">${ui.field({ id: "adm-t-name-" + i, f: "trades." + i + ".name", label: "Name", value: t.name })}${ui.field({ id: "adm-t-ar-" + i, f: "trades." + i + ".ar", label: "Arabic", value: t.ar, attrs: 'dir="rtl" lang="ar"' })}</div>
          <div class="hrow">${ui.seg("trades." + i + ".role", [["master", "M · master"], ["laborer", "L · laborer"]], t.role, { label: "Role" })}${ui.field({ id: "adm-t-rate-" + i, f: "trades." + i + ".rate", label: "Rate", num: true, value: t.rate, style: "width:96px" })}<button class="btn sm ghost" data-act="rm" data-i="${i}" aria-label="Remove trade ${i + 1}">×</button></div></div>`).join("");
        return h + '<button class="btn sm sec" data-act="addTrade" id="adm-t-add">+ Add trade</button>';
      },
      foot: () => '<button class="btn sec" data-act="close">Cancel</button><button class="btn" data-act="save" id="adm-r-save">Save rates</button>',
      acts: {
        addTrade: (d, el, ev, sh) => { sh.state.trades.push({ key: "", name: "", ar: "", role: "master", rate: sh.state.m || 200 }); sh.refresh(); },
        rm: (d, el, ev, sh) => { sh.state.trades.splice(+d.i, 1); sh.refresh(); },
        save: async (d, el, ev, sh) => {
          const s = sh.state;
          for (const k of ["m", "l", "food"]) if (!(U.num(s[k]) >= 0) || s[k] === "") return sh.error("Default rates must be numbers.");
          const keys = new Set();
          const trades = [];
          for (const t of s.trades) {
            const name = String(t.name || "").trim(), ar = String(t.ar || "").trim();
            if (!name && !ar) continue;
            if (!(U.num(t.rate) >= 0)) return sh.error("Rate for " + (name || ar) + " must be a number.");
            let key = t.key || U.slug(name || ar) || U.rid("t"); while (keys.has(key)) key += "2";
            keys.add(key);
            trades.push({ key, name: name || ar, ar, role: t.role === "laborer" ? "laborer" : "master", rate: U.round2(U.num(t.rate)) });
          }
          const before = { defaults: U.clone(cfg().defaults || {}), trades: U.clone(cfg().trades || []) };
          sh.busy(true);
          const r = await X.save(SL.store.configPatch({ defaults: { m: U.round2(U.num(s.m)), l: U.round2(U.num(s.l)), food: U.round2(U.num(s.food)) }, trades }), sh);
          if (!r) return;
          sh.close(true); ui.toast("Rates saved · existing crews keep their own rates", { undo: async () => { await SL.store.configPatch(before); } });
        },
      },
    });
  };

  X.sec.rates = (pid, ro) => {
    const c = cfg(), df = c.defaults || {};
    const v = (x) => (x == null || x === "" ? '<span class="unk">?</span>' : U.m(U.num(x)));
    let h = `<div class="sec">${ui.sech("Default day rates", null, ro ? "" : X.editBtn("adminRates", {}, "Edit", "adm-rates-edit"))}<div class="kv v-settings-kv">
      <span>M · masters (معلمين)</span><span class="v num">${v(df.m)}</span><span>L · laborers (عمال)</span><span class="v num">${v(df.l)}</span><span>Food per crew-day</span><span class="v num">${v(df.food)}</span></div>
      <p class="t12 muted">New crews start with these. Each crew keeps its own rates (Settings › Crews).</p></div>`;
    const ts = c.trades || [];
    h += `<div class="sec">${ui.sech("Trades · " + ts.length)}${ts.map((t) => `<div class="row nosw"><span class="t">${U.t(t.name || t.key)}${t.ar ? " · " + U.t(t.ar) : ""}</span><span class="a num">${v(t.rate)}</span><span class="f"></span><span class="m">${t.role === "laborer" ? "L · laborer" : "M · master"}</span></div>`).join("") || '<p class="t12 muted">No trades yet.</p>'}</div>`;
    return h;
  };
})(window.SL);

/* ---- chunk 13: flag thresholds, data, theme ---- */
(function (SL) {
  "use strict";
  const U = SL.util, M = SL.model, ui = SL.ui, A = SL.actions;
  const X = (SL._admin = SL._admin || {});
  // [key, label, unit, pct?]  pct → stored as a fraction, shown as %
  const FL = [
    ["tolerance", "Price above / below usual", "%", true], ["wayOff", "Price way off (stop)", "%", true], ["minObs", "Buys needed for a usual price", "buys"],
    ["noPhotoDays", "No photo after", "days"], ["paperDays", "Paper still with Sayed after", "days"], ["crewUnpaidDays", "Crew unpaid after", "days"],
    ["idleDays", "Rental idle after", "work days"], ["countDiff", "Float count off by more than", "SAR"], ["quoteDays", "Quote valid for (if not printed)", "days"], ["bigDoc", "Big document from", "SAR"],
  ];
  const fcfg = () => Object.assign({}, (SL.store.DEFAULT_CONFIG && SL.store.DEFAULT_CONFIG.flags) || {}, (SL.S.config || {}).flags || {});
  const show = (k, pct, v) => (v == null ? "?" : pct ? Math.round(U.num(v) * 1000) / 10 : U.num(v));

  A.adminFlagCfg = () => {
    if (ui.readOnlyUI()) return;
    const f = fcfg(), init = {};
    for (const [k, , , pct] of FL) init[k] = show(k, pct, f[k]);
    ui.sheet({
      title: "Flag thresholds",
      state: U.clone(init),
      dirty: (sh) => JSON.stringify(sh.state) !== JSON.stringify(init),
      body: (sh) => '<div class="grid2">' + FL.map(([k, l, unit]) => ui.field({ id: "adm-fl-" + k, f: k, label: U.esc(l) + " (" + unit + ")", num: true, value: sh.state[k] })).join("") + "</div>",
      foot: () => '<button class="btn sec" data-act="close">Cancel</button><button class="btn" data-act="save" id="adm-fl-save">Save</button>',
      acts: {
        save: async (d, el, ev, sh) => {
          const out = {};
          for (const [k, l, , pct] of FL) {
            const v = sh.state[k];
            if (v === "" || !(U.num(v) >= 0)) return sh.error(l + " must be a number.");
            out[k] = pct ? Math.round(U.num(v) * 10) / 1000 : U.num(v);
          }
          if (out.wayOff < out.tolerance) return sh.error("“Way off” must be at least the normal tolerance.");
          const before = U.clone((SL.S.config || {}).flags || {});
          sh.busy(true);
          const r = await X.save(SL.store.configPatch({ flags: out }), sh);
          if (!r) return;
          sh.close(true); ui.toast("Flag thresholds saved", { undo: async () => { await SL.store.configPatch({ flags: before }); } });
        },
      },
    });
  };

  X.sec.flags = (pid, ro) => {
    const f = fcfg();
    const rows = FL.map(([k, l, unit, pct]) => `<span>${U.esc(l)}</span><span class="v num">${f[k] == null ? '<span class="unk">?</span>' : U.esc(String(show(k, pct, f[k]))) + " " + U.esc(unit)}</span>`).join("");
    return `<div class="sec">${ui.sech("Flag thresholds", null, ro ? "" : X.editBtn("adminFlagCfg", {}, "Edit", "adm-fl-edit"))}<div class="kv v-settings-kv">${rows}</div><p class="t12 muted">Flags are raised when a figure passes these limits. ${ro ? "" : '<a class="lnk" href="' + U.esc(ui.href("flags")) + '">Open flags ›</a>'}</p></div>`;
  };

  const LIMIT = 5000;
  X.sec.data = (pid, ro) => {
    const S = SL.S, n = SL.store.docCount();
    const colls = ["projects", "wallets", "jobs", "timesheets", "costs", "cash", "quotes", "inbox", "reports", "archive"];
    const rows = colls.map((c) => [c, Object.keys(S[c] || {}).length]);
    rows.push(["catalog", ["crews", "equipment", "items", "suppliers"].filter((k) => S.catalog && S.catalog[k] && S.catalog[k].id).length]);
    rows.push(["config", S.config && S.config.id ? 1 : 0]);
    if (S.legacyCount) rows.push(["v1 records", S.legacyCount]);
    const pc = Math.min(100, (n / LIMIT) * 100);
    const lvl = pc >= 90 ? "c-stop" : pc >= 70 ? "c-warn" : "";
    let h = `<div class="sec">${ui.sech("Storage", `<span class="${lvl}">${n.toLocaleString("en-US")} / 5,000</span>`)}
      <div class="v-settings-meter" role="img" aria-label="${n} of 5000 documents used"><i class="${pc >= 90 ? "stop" : pc >= 70 ? "warn" : ""}" style="width:${pc.toFixed(1)}%"></i></div>
      <div class="kv v-settings-kv">${rows.map(([c, k]) => `<span>${U.esc(c)}</span><span class="v num">${k ? k.toLocaleString("en-US") : '<span class="zero">–</span>'}</span>`).join("")}</div></div>`;
    // Save UI only where the downloads capability can run (null, or a lifecycle rejection, means it can't here).
    const canSave = !!S.downloads && !X.dlGone;
    const btns = canSave ? (ro ? "" : '<button class="btn sec" data-act="backup" id="adm-data-json">Download JSON backup</button>') + (A.csv ? '<button class="btn sec" data-act="csv" id="adm-data-csv">Download CSV</button>' : "") : "";
    h += `<div class="sec">${ui.sech("Export")}${btns ? '<div class="btns">' + btns + "</div>" : canSave ? "" : '<p class="t13 muted">Downloads aren\'t available in this view.</p>'}
      <p class="t12 muted">The JSON backup holds every collection. To archive a finished project${canSave ? "" : " or get a backup"}, ask Claude Code.</p></div>`;
    return h;
  };

  /** What to tell the viewer after store.download failed → {msg ("" = say nothing), gone (hide the save UI)}. Codes: downloads capability. */
  X.dlOutcome = (r) => {
    const code = (r && r.code) || "unavailable";
    if (code === "declined") return { msg: "", gone: false }; // the viewer said no: never nag
    if (code === "rate_limited") return { msg: "A save prompt is already open", gone: false };
    if (code === "too_large") return { msg: "The file is too large to save here. Ask Claude Code for a backup.", gone: false };
    if (code === "rejected_extension" || code === "extension_not_enabled") return { msg: "This file type can't be saved here.", gone: false };
    if (code === "bad_request" || code === "transform_error" || code === "request_unknown") return { msg: "Couldn't prepare the file. Try again.", gone: false };
    // unavailable, not_granted, capability_disabled, capability_removed and unknown codes: saving can't run in this view
    return { msg: "Downloads aren't available here. Ask Claude Code for a backup.", gone: true };
  };
  X.dlGone = false;

  A.backup = async () => {
    const S = SL.S, out = { app: "site-ledger", schema: 2, exportedAt: new Date().toISOString(), config: S.config || {}, catalog: S.catalog || {} };
    for (const c of ["projects", "wallets", "jobs", "timesheets", "costs", "cash", "quotes", "inbox", "reports", "archive"]) out[c] = S[c] || {};
    const r = await SL.store.download("site-ledger-backup-" + U.today() + ".json", JSON.stringify(out, null, 1));
    if (r && r.ok) { ui.toast("Backup ready · " + SL.store.docCount().toLocaleString("en-US") + " documents"); return; }
    const o = X.dlOutcome(r);
    if (o.gone && !X.dlGone) { X.dlGone = true; ui.render(); }
    if (o.msg) ui.toast(U.esc(o.msg));
  };

  const THEMES = [["system", "System"], ["light", "Light"], ["dark", "Dark"]];
  X.theme = () => { const t = U.lsGet("sl.theme", ""); return t === "light" || t === "dark" ? t : "system"; };
  A.adminTheme = (ds) => {
    const v = ds.val === "light" || ds.val === "dark" ? ds.val : "system";
    if (v === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = v;
    U.lsSet("sl.theme", v === "system" ? "" : v);
    ui.render();
  };
  X.sec.theme = () => `<div class="sec">${ui.sech("Theme")}${ui.seg("theme", THEMES, X.theme(), { act: "adminTheme", full: true, label: "Theme" })}<p class="t12 muted">Saved on this device only. System follows your phone's light or dark setting.</p></div>`;
})(window.SL);

/* ---- 99-boot.js ---- */
/* Boot: start live data, then the router/render loop. */
(function (SL) {
  SL.store.boot();
  SL.ui.start();
})(window.SL);

</script>
