.v-bal .bl .bl-d{left:52px}
@media (max-width:600px){ .v-bal .bl .bl-d{left:40px} }

/* ---- 50-pay.css ---- */
/* 50-pay.css: Pay view (#pay) and the pay / top-up / why sheets. Every selector is scoped under .v-pay. */
.v-pay{display:flex;flex-direction:column;gap:var(--gap,16px);min-width:0}
/* the Pay page and its lists are size containers: layout follows the space the view really gets (rails included), not the viewport */
.v-pay.pay-page{container:paypage / inline-size}
.v-pay .pay-grid{display:flex;flex-direction:column;gap:var(--gap,16px);min-width:0}
.v-pay .pay-cards{display:flex;flex-direction:column;gap:12px;min-width:0}
.v-pay .pay-lists{display:flex;flex-direction:column;gap:var(--gap,16px);min-width:0;container:paylists / inline-size}
.v-pay .sec{min-width:0}

/* float card */
.v-pay .pay-card{display:flex;flex-direction:column;gap:8px;padding:12px}
.v-pay .pay-card.short{border-color:var(--stop);box-shadow:inset 3px 0 0 var(--stop)}
.v-pay .pay-flbl{color:var(--float-ink)}
.v-pay .pay-kv{font-size:var(--t-13)}
.v-pay .pay-kv .t20{font-size:var(--t-20);font-weight:700;font-stretch:80%;line-height:1.15}
.v-pay .pay-holds{color:var(--ink)}
.v-pay .pay-need{min-height:32px;align-items:center}
.v-pay .pay-need .num{font-variant-numeric:tabular-nums;font-stretch:80%}
.v-pay .pay-why{min-height:44px;padding:0 4px 0 12px}
.v-pay .pay-topup{font-size:var(--t-14)}
.v-pay .pay-links{display:flex;flex-wrap:wrap;align-items:center;gap:0 6px;color:var(--ink-3)}
.v-pay .pay-links .lnk{display:inline-flex;align-items:center;min-height:44px;text-decoration:none}
.v-pay .pay-gauge .short{box-sizing:border-box}

/* as-of set: pay buttons hidden, this says why */
.v-pay .pay-past{display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;padding-top:4px;padding-bottom:4px}
.v-pay .pay-past .lnk{min-height:44px;padding:0 4px;color:inherit;text-decoration:underline}

/* section header extras */
.v-pay .pay-range{margin-left:8px;color:var(--ink-3);letter-spacing:0;text-transform:none;font-weight:400;font-size:var(--t-12)}

/* one payable item: row + its buttons, separated by a hairline */
.v-pay .pay-item{border-bottom:1px solid var(--line)}
.v-pay .pay-item>.row{border-bottom:0;padding-bottom:2px}
.v-pay .pay-comp{font-weight:400;font-size:var(--t-12);margin-left:4px}
.v-pay .pay-row>.a.c-owed{color:var(--owed)}
.v-pay .pay-row>.a.c-owed .h{color:inherit;opacity:.8}
.v-pay .pay-btns{display:flex;align-items:center;gap:12px;padding:2px 0 8px 22px}
.v-pay .pay-btns .pay-main{min-height:40px;padding:0 14px;font-size:var(--t-13)}
.v-pay .pay-btns .pay-other{min-height:44px;padding:0 8px;margin-left:auto}
.v-pay .pay-all{margin-top:10px}

/* other owed */
.v-pay .pay-none{padding:10px 0}
.v-pay .pay-noprice{min-height:44px;gap:8px;border-bottom:1px solid var(--line)}
.v-pay .pay-noprice .lnk{min-height:44px;padding:0 8px}
.v-pay .pay-someone{display:flex;justify-content:flex-end}
.v-pay .pay-someone .lnk{min-height:44px;padding:0 8px}

/* paid this week */
.v-pay .pay-split{display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;width:100%;min-height:44px;padding:0;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink-2);text-align:left;font:inherit;font-size:var(--t-13);cursor:pointer}
.v-pay .pay-split .num{font-variant-numeric:tabular-nums;font-stretch:80%}
.v-pay .pay-split .spacer{flex:1}
.v-pay .pay-prow>.a{font-weight:600}

/* sheets: pay / review / pick / top-up / why */
.v-pay.pay-sheet,.v-pay.pay-topsheet,.v-pay.pay-review,.v-pay.pay-pick,.v-pay.pay-why-sheet{gap:12px}
.v-pay .pay-sum{display:flex;flex-direction:column;gap:6px}
.v-pay .pay-sum .kv{padding-top:4px;border-top:1px solid var(--line)}
.v-pay table.pay-days{width:100%;font-size:var(--t-13)}
.v-pay table.pay-days td,.v-pay table.pay-days th{padding:4px 6px}
.v-pay table.pay-days td:first-child,.v-pay table.pay-days th:first-child{padding-left:0}
.v-pay table.pay-days .num{font-variant-numeric:tabular-nums;font-stretch:80%}
.v-pay table.pay-days tr.pay-plan td{color:var(--committed);border-top:1px dotted var(--committed)}
.v-pay .pay-dn{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
.v-pay .pay-chips .chip{min-height:44px;gap:4px}
.v-pay .pay-chips .chip .num{font-variant-numeric:tabular-nums;font-stretch:80%}
.v-pay .pay-review .kv{padding-top:6px}
.v-pay .pay-whykv{row-gap:4px}
.v-pay .pay-whykv .tot{border-top:1px solid var(--ink);padding-top:4px;font-weight:700}
.v-pay .pay-whykv .pay-subl{font-size:var(--t-12);color:var(--ink-2)}
.v-pay .pay-whykv .pay-sub{display:inline-block;padding-left:12px}
.v-pay .pay-whykv .pay-topl{font-weight:700;color:var(--float-ink)}
.v-pay .pay-pick .row{border-bottom:1px solid var(--line)}
.v-pay .pay-pick>.lnk,.v-pay.pay-pick>.lnk,.v-pay.pay-sheet>.lnk,.v-pay.pay-why-sheet>.lnk{min-height:44px;align-self:flex-start;padding:0 4px}

/* lists wide enough: buttons sit beside the row (a container query, so the desktop rails can't squeeze the row to nothing) */
@container paylists (min-width:520px){
  .v-pay .pay-item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:16px}
  .v-pay .pay-item>.row{padding-bottom:6px}
  .v-pay .pay-btns{padding:0;justify-content:flex-end}
  .v-pay .pay-btns .pay-other{margin-left:0}
}
/* view wide enough for card + lists: float card(s) on the left, sticky below the header (and the tab bar when it shows) */
@container paypage (min-width:880px){
  .v-pay .pay-grid{display:grid;grid-template-columns:minmax(320px,380px) minmax(0,1fr);gap:24px;align-items:start}
  .v-pay .pay-cards{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr-h,44px) + 52px)}
  body.desk .v-pay .pay-cards{top:calc(env(safe-area-inset-top,0px) + var(--hdr-h,44px) + 12px)}
  .v-pay .pay-lists{gap:24px}
}

/* ---- 51-float.css ---- */
/* 51-float — float ledger, statement & count, capital (sources & uses). Tokens only. */

/* shared top row: ‹ Pay … link */
.v-float .v-fl-top,.v-statement .v-fl-top,.v-capital .v-fl-top{min-height:44px;align-items:center}
.v-float .lnk,.v-statement .lnk,.v-capital .lnk{min-height:44px;display:inline-flex;align-items:center}
.v-float .sec,.v-statement .sec,.v-capital .sec{min-width:0}
/* as-of set: money buttons hidden, this says why */
.v-float .v-fl-past,.v-statement .v-fl-past{display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;margin-top:8px;padding-top:4px;padding-bottom:4px}
.v-float .v-fl-past .lnk,.v-statement .v-fl-past .lnk{padding:0 4px;color:inherit;text-decoration:underline}

/* ---- float ledger ---- */
.v-float .v-fl-kv{padding:8px 0 4px}
.v-float .v-fl-kv .tot{font-size:var(--t-14)}
.v-float .v-fl-kv .v-fl-holds{font-size:var(--t-20);color:var(--float-ink)}
.v-float .v-fl-kv .v-fl-last{font-weight:400;font-size:var(--t-12)}
.v-float .v-fl-acts{padding:8px 0 0}
.v-float .v-fl-acts .btn{min-height:44px;flex:1 1 auto}
.v-float .v-fl-filt{padding:0 0 8px}
.v-float .v-fl-filt .seg{height:44px}
.v-float .v-fl-row .a.c-float{color:var(--float-ink)}
.v-float .v-fl-io,.v-statement .v-fl-io{font-weight:400;font-size:var(--t-12);color:var(--ink-2)}
.v-float .v-fl-row .v-fl-bal{font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;font-stretch:80%}
.v-float .v-fl-row .v-fl-bal .c-stop{color:var(--stop)}
.v-float .v-fl-row .t .mono{margin-right:2px}
.v-float .v-fl-foot{padding-top:6px}

/* ---- statement: week nav ---- */
.v-statement .v-st-week{align-items:center;gap:8px;padding:4px 0 12px}
.v-statement .v-st-nav{min-width:44px;min-height:44px;font-size:var(--t-20);line-height:1}
.v-statement .v-st-nav[disabled]{opacity:.35}
.v-statement .v-st-wt{flex:1 1 auto;min-width:0;text-align:center}
.v-statement .v-st-wt .t16{font-weight:700;text-wrap:balance}

/* ---- statement: lettered lines ---- */
.v-statement .v-st-line{border-bottom:1px solid var(--line)}
.v-statement .v-st-lh{display:grid;grid-template-columns:20px minmax(0,1fr) auto 16px;column-gap:8px;align-items:baseline;width:100%;min-height:44px;padding:10px 0;text-align:left;color:var(--ink);background:none;border:0}
.v-statement button.v-st-lh{cursor:pointer}
.v-statement button.v-st-lh[disabled]{cursor:default;color:var(--ink)}
.v-statement .v-st-lh:hover:not([disabled]){background:color-mix(in srgb,var(--sunk) 50%,transparent)}
.v-statement .v-st-let{font-size:var(--t-11);font-weight:700;color:var(--ink-2);letter-spacing:.05em}
.v-statement .v-st-lab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.v-statement .v-st-lab .t12{font-weight:400}
.v-statement .v-st-amt{font-weight:700;text-align:right;white-space:nowrap}
.v-statement .v-st-car{color:var(--ink-3);text-align:center}
.v-statement .v-st-line.nil .v-st-lab{font-weight:400;color:var(--ink-2)}
.v-statement .v-st-h{border-top:2px solid var(--ink);border-bottom:0}
.v-statement .v-st-h .v-st-lab{font-weight:700}
.v-statement .v-st-h .v-st-amt{font-size:var(--t-20)}
.v-statement .v-st-rows{padding:0 0 6px 28px}
.v-statement .v-st-rows .row:last-child{border-bottom:0}
.v-statement .v-st-ctl{padding-top:8px}

/* ---- statement: count ---- */
.v-statement .v-st-count .fld{margin-top:8px}
.v-statement .v-st-count input{font-size:var(--t-16);min-height:44px}
.v-statement #st-count{font-variant-numeric:tabular-nums;font-weight:700}
.v-statement .v-st-kv{padding:8px 0}
.v-statement .v-st-kv .v-st-let{margin-right:6px}
.v-statement .v-st-why{padding-top:4px}
.v-statement .v-st-reasons{padding:4px 0}
.v-statement .v-st-reasons .chip{min-height:44px}
.v-statement .v-st-count .btns{padding-top:8px}
.v-statement .v-st-count .btns .btn{min-height:44px}
.v-statement #st-err:empty{display:none}
.v-statement .v-st-cnt .w{font-weight:600}
.v-statement .v-st-wa-b{align-items:center}
.v-statement .v-st-wa-b .seg{height:44px}
.v-statement .v-st-wa-b .seg button{min-width:88px}
.v-st-wa{width:100%;box-sizing:border-box;font-size:var(--t-14);font-family:var(--font);line-height:1.45;padding:8px;background:var(--sunk);color:var(--ink);border:1px solid var(--line-2);border-radius:var(--r-ctl);resize:vertical}

/* ---- capital: sources & uses ---- */
.v-capital .v-cap-grid{display:flex;flex-direction:column;gap:var(--gap,16px)}
.v-capital .kv{padding:8px 0 4px}
.v-capital .kv .muted{color:var(--ink-2);font-weight:400}
.v-capital .kv .c-warn{color:var(--warn)}
.v-capital .kv .c-float{color:var(--float-ink)}
.v-capital .v-cap-ind{padding-left:12px}
.v-capital .v-cap-kv .sw{margin-right:6px;vertical-align:baseline}
.v-capital .v-cap-fronted{margin-top:8px;padding:8px 0 8px 10px;box-shadow:inset 3px 0 0 var(--warn);background:var(--warn-bg)}
.v-capital .v-cap-fronted .hrow{align-items:baseline}
.v-capital .v-cap-fronted .btns{padding:6px 10px 0 0}
.v-capital .v-cap-fronted .btn{min-height:44px;flex:1 1 auto}
.v-capital .v-cap-ident{padding:6px 0;border-top:1px solid var(--line)}
.v-capital .v-cap-ident.c-stop{color:var(--stop)}
.v-capital .v-cap-row .v-cap-void{color:var(--stop);min-height:32px;font-size:var(--t-12)}
.v-capital .sech .act{min-height:44px;display:inline-flex;align-items:center}
.v-capital .sech{align-items:center}

/* sheets opened from this module */
.v-fl-sheet .chips .chip,.v-cap-sheet .chips .chip{min-height:44px}
.v-cap-sheet .seg.full{height:44px}

/* ---- desktop: use the width ---- */
@media (min-width:1100px){
  .v-statement .v-st-grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:24px;align-items:start}
  .v-statement .v-st-side{display:flex;flex-direction:column;gap:24px}
  .v-statement .v-st-lh{min-height:36px;padding:6px 0}
  .v-capital .v-cap-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:start}
  .v-float .v-fl-acts .btn{flex:0 0 auto}
  .v-float .v-fl-list .row{min-height:32px}
}
@media (min-width:768px) and (max-width:1099px){
  .v-capital .v-cap-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
}

/* ---- 60-docs.css ---- */
/* 60-docs.css — (+) Add sheet (.v-add) and manual cost forms (.v-dc). Owner: docs. */

/* ---- (+) Add sheet ---- */
.v-add{display:flex;flex-direction:column;gap:var(--s5)}
.v-add-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.v-add-tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:var(--s2);min-height:96px;padding:var(--s4) var(--s3);border:1px solid var(--line-2);border-radius:var(--r-ctl);background:var(--paper);color:var(--ink);text-align:left}
.v-add-tile b{font-size:var(--t-11);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.v-add-tile span{font-size:var(--t-12);line-height:1.3;color:var(--ink-2)}
.v-add-tile.last{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.v-add-tile:active{background:var(--sunk)}
.v-add-list{display:grid;grid-template-columns:1fr;border-top:1px solid var(--line)}
.v-add-txt{display:flex;align-items:center;gap:var(--s3);min-height:48px;padding:0 var(--s1);border-bottom:1px solid var(--line);color:var(--ink);font-size:var(--t-14);font-weight:600;text-align:left}
.v-add-txt .muted{font-weight:400;margin-left:var(--s2)}
.v-add-chev{margin-left:auto;color:var(--ink-3);font-size:var(--t-16)}
@media (min-width:768px){
  .v-add-tiles{gap:var(--s4)}
  .v-add-tile{min-height:112px;padding:var(--s5) var(--s4)}
  .v-add-list{grid-template-columns:1fr 1fr;column-gap:var(--s5)}
}

/* ---- forms: shared ---- */
.v-dc{display:flex;flex-direction:column;gap:var(--s4)}
.v-dc .lbl{display:block;margin-bottom:var(--s1)}
.v-dc .err{font-size:var(--t-12);color:var(--stop);font-weight:600}
.v-dc .seg.full button{padding:0 6px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.v-dc .seg.full{width:100%}
.v-dc .seg+.seg{margin-top:var(--s3)}
.v-dc textarea{resize:vertical;min-height:60px;font-family:inherit}
.v-dc input.ed{border-color:var(--ink);font-weight:600}
.v-dc .chips{display:flex;flex-wrap:wrap;gap:var(--s3)}
.v-dc .chip{min-height:44px}
.v-dc-chips .chip .ar{color:inherit;opacity:.8}
.v-dc-files{flex-wrap:wrap;gap:var(--s3);align-items:center;min-height:44px}
.v-dc-fileinp{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.v-dc-filebtn{min-height:44px;cursor:pointer}
.v-dc-bigfile{min-height:56px;cursor:pointer;font-size:var(--t-16)}
.v-dc :has(>.v-dc-fileinp:focus-visible)>label{outline:2px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 4px var(--float)}

/* ---- purchase lines ---- */
.v-dc-lines{display:flex;flex-direction:column;border-top:1px solid var(--line-2);container-type:inline-size}
.v-dc-lh{display:block;padding:var(--s2) 0}
.v-dc-lh1{display:none}
.v-dc-lh2,.v-dc-l3{display:grid;grid-template-columns:1fr 1fr 1.3fr 1.3fr;gap:var(--s2)}
.v-dc-lh2 span{text-align:right}
.v-dc-lh2 span:nth-child(-n+2){text-align:left}
.v-dc-line{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.v-dc-line input{width:100%;min-width:0;min-height:44px;padding:6px 8px;border:1px solid var(--line-2);border-radius:var(--r-ctl);background:var(--paper);font-size:var(--t-16);color:var(--ink)}
.v-dc-line input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--float) 70%,transparent)}
.v-dc-l1{display:flex;gap:var(--s2);align-items:center}
.v-dc-l1 input{flex:1;font-weight:600}
.v-dc-rm{flex:none;width:44px;height:44px;font-size:22px;color:var(--ink-2)}
.v-dc-l2 input{min-height:40px;color:var(--ink-2)}
.v-dc-l3 input[inputmode=decimal]{text-align:right;font-variant-numeric:tabular-nums;font-stretch:80%}
.v-dc-l4{display:flex;align-items:center;gap:var(--s3);font-size:var(--t-12)}
.v-dc-add{min-height:44px;align-self:flex-start}
@container (min-width:640px){
  .v-dc-lh,.v-dc-line{display:grid;grid-template-columns:minmax(0,1fr) 360px 44px;column-gap:var(--s2);row-gap:var(--s1);align-items:center}
  .v-dc-lh1{display:block;grid-column:1}
  .v-dc-lh2{grid-column:2}
  .v-dc-lh2,.v-dc-l3{grid-template-columns:64px 72px 104px 104px}
  .v-dc-l1{display:contents}
  .v-dc-l1 input{grid-column:1;grid-row:1}
  .v-dc-rm{grid-column:3;grid-row:1}
  .v-dc-l2{grid-column:1;grid-row:2}
  .v-dc-l3{grid-column:2;grid-row:1}
  .v-dc-l4{grid-column:2 / -1;grid-row:2}
}

/* ---- totals ---- */
.v-dc-tot{display:flex;flex-direction:column;gap:var(--s2);padding-top:var(--s2)}
.v-dc-trow{display:grid;grid-template-columns:1fr minmax(120px,42%);align-items:center;gap:var(--s3);min-height:44px}
.v-dc-trow>span:first-child,.v-dc-trow>label{font-size:var(--t-13);color:var(--ink-2);font-weight:600}
.v-dc-trow>.num{text-align:right;font-weight:600;padding-right:10px}
.v-dc-trow input{width:100%;min-height:44px;padding:6px 10px;border:1px solid var(--line-2);border-radius:var(--r-ctl);background:var(--paper);font-size:var(--t-16);text-align:right;font-variant-numeric:tabular-nums;font-stretch:80%;color:var(--ink)}
.v-dc-trow.big{border-top:2px solid var(--ink);padding-top:var(--s2)}
.v-dc-trow.big label{color:var(--ink);font-size:var(--t-14);font-weight:700}
.v-dc-trow.big input{font-size:var(--t-20);font-weight:700}
.v-dc-checks{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s3);color:var(--ink-2)}
.v-dc-ok{color:var(--ink-2)}
.v-dc-bad{color:var(--stop);font-weight:600}
.v-dc-tot .fld input.t20{font-size:var(--t-20);font-weight:700;text-align:right}
.v-dc-qp{display:grid;grid-template-columns:.8fr 1.1fr 1.3fr;gap:var(--s2)}
.v-dc-qp input{text-align:right;font-variant-numeric:tabular-nums}
.v-dc .pricedev{white-space:nowrap}
.v-dc-photo .row{padding-inline:0}

/* ---- estimated cost (E1): confirm from the edit form; as-of past note ---- */
.v-dc-est{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s3);background:var(--sunk);color:var(--ink);font-weight:400}
.v-dc-est>span{flex:1 1 200px;min-width:0}
.v-dc-est b{font-weight:700}
.v-dc-est .btn{flex:none;min-height:44px}
.v-dc-past{display:flex;flex-wrap:wrap;align-items:center;gap:0 var(--s2);margin:0}
.v-dc-past .lnk{min-height:44px;padding:0 var(--s1)}

/* ---- 61-reader.css ---- */
/* 61-reader: photo reader, review sheet, Docs › Inbox. Selectors scoped to .v-reader / .v-inbox. */
.v-reader{display:flex;flex-direction:column;gap:12px;min-width:0}
.v-reader .rd-tabs{margin-top:4px}
.v-reader .rd-tabs button{min-height:44px}
.v-reader .rd-top{margin:0}
.v-inbox .sec{margin:0}

/* file picker: a big visible label, the input visually hidden but reachable */
.v-reader .rd-lbl{cursor:pointer;min-height:48px}
.v-reader .rd-file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.v-reader .rd-file:focus-visible+*,.v-reader .rd-lbl:focus-within{outline:2px solid var(--ink);outline-offset:2px}

/* queue rows: icon · name · action / state words · age (2 lines, 44px+) */
.v-reader .rd-list{display:flex;flex-direction:column}
.v-reader .rd-q{display:grid;grid-template-columns:28px minmax(0,1fr) auto;column-gap:8px;row-gap:1px;align-items:center;min-height:44px;padding:6px 0;border-bottom:1px solid var(--line)}
.v-reader .rd-ic{grid-column:1;grid-row:1/3;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;letter-spacing:.04em;color:var(--ink-2);border:1px solid var(--line-2);border-radius:2px}
.v-reader .rd-n{grid-column:2;grid-row:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.v-reader .rd-s{grid-column:2;grid-row:2;font-size:var(--t-12);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.v-reader .rd-b{grid-column:3;grid-row:1/3;display:flex;gap:4px;align-items:center;justify-content:flex-end}
.v-reader .rd-b .btn.sm{min-height:44px}
.v-reader .rd-x{color:var(--ink-2)}
@media (max-width:767px){.v-reader .rd-x{padding:0 6px;font-size:var(--t-12)}}

/* Added by Claude — check */
.v-inbox .rd-chk{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.v-inbox .rd-chk-m{min-width:0}
.v-inbox .rd-chk .row{border-bottom:0}
.v-inbox .rd-ok{min-height:44px}
/* per-line price flags under a check row, aligned with the row title (14px swatch + 8px gap) */
.v-inbox .rd-devs{list-style:none;margin:-2px 0 6px;padding:0 0 0 22px;display:flex;flex-direction:column;gap:2px}
.v-inbox .rd-devs li{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px;min-width:0}
.v-inbox .rd-dev-n{min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}

/* no assets capability / as-of past: one-line notes */
.v-reader .rd-noup{margin:0}
.v-reader .rd-past{display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;margin:0}
.v-reader .rd-past .lnk{min-height:44px;padding:0 4px}

/* review sheet: photo left, fields right on desktop; stacked on phone */
.v-reader.rd-rev{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.v-reader .rd-left,.v-reader .rd-right{min-width:0;display:flex;flex-direction:column;gap:12px}
.v-reader .rd-ph{background:var(--sunk);display:flex;align-items:center;justify-content:center;min-height:120px}
.v-reader .rd-ph img{display:block;max-width:100%;max-height:42vh;object-fit:contain}
@media (min-width:1100px){
  .v-reader.rd-rev{grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:start}
  .v-reader .rd-left{position:sticky;top:0}
  .v-reader .rd-ph img{max-height:78vh}
}
.v-reader .rd-kind{display:flex;flex-direction:column;gap:6px;padding:8px;border:1px solid var(--line);border-radius:var(--r-ctl)}
.v-reader .rd-kind.must{border-color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn);background:var(--warn-bg)}
.v-reader .rd-kind .seg{display:flex;flex-wrap:wrap;height:auto}
.v-reader .rd-kind .seg button{flex:1 1 30%;min-height:40px;border-top:1px solid var(--line-2);margin-top:-1px}
.v-reader .rd-cues{margin:0;overflow-wrap:anywhere}

/* SL core: namespace, dates, money formatting, DOM + storage helpers. No app state here. */
"use strict";

  U.t = (s) => {
    s = String(s == null ? "" : s);
    if (!AR.test(s)) return U.esc(s);
    return s.split(/([؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿][؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿\s\/\-–().،0-9]*[؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿]|[؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿])/)

  U.lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  U.ssGet = (k, d) => { try { const v = sessionStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
  U.ssSet = (k, v) => { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  /** Asset display URL for a stored asset id (dev harness maps fresh uploads to blob: URLs). */
  U.assetUrl = (id) => (id ? (window.__SL_DEV_BLOB && window.__SL_DEV_BLOB[id]) || "/_blob/" + id : "");
})(window.SL);

/* ---- 05-store.js ---- */
/* SL.store — capability boot, live subscriptions into SL.S, and every db write.
 * Raw state lives in SL.S (plain maps id → frozen doc data). Views never write to db directly:
 * they call SL.store.* so writes are serialized per document, stamped, and errors surface inline. */
(function (SL) {
  const U = SL.util;
  const COLLS = ["projects", "wallets", "jobs", "timesheets", "costs", "cash", "quotes", "inbox", "reports", "catalog", "config", "archive"];
  const DEFAULT_CONFIG = {
    schema: 2, foreman: "Sayed",
    trades: [
      { key: "ironsmith", name: "Iron smith", ar: "حداد", rate: 200, role: "master" },
      { key: "plasterer", name: "Plasterer", ar: "معلم لياسة", rate: 200, role: "master" },
      { key: "painter", name: "Painter", ar: "دهان", rate: 200, role: "master" },
      { key: "tiler", name: "Tiler", ar: "مبلط", rate: 200, role: "master" },
      { key: "laborer", name: "General laborer", ar: "عامل", rate: 150, role: "laborer" },
    ],
    defaults: { m: 200, l: 150, food: 150 },
    flags: { tolerance: 0.1, wayOff: 0.25, minObs: 2, noPhotoDays: 3, paperDays: 7, crewUnpaidDays: 7, idleDays: 2, countDiff: 50, quoteDays: 14, bigDoc: 5000 },
  };

  /** Raw live state. `ver` bumps on every snapshot so model caches can key on it. */
  const S = (SL.S = {
    ver: 0, ready: false, loaded: {}, live: true, lastSync: 0,
    db: null, assets: null, sample: null, downloads: null, user: null,
    canWrite: null, // true | false | null (= platform said nothing; let a refused write decide)
    isOwner: false,
    legacyCount: 0,
    config: DEFAULT_CONFIG,
    catalog: { crews: { items: {} }, equipment: { items: {}, kits: {} }, items: { items: {} }, suppliers: { items: {} } },
  });
  COLLS.forEach((c) => { if (c !== "config" && c !== "catalog") S[c] = {}; });

  const listeners = new Set();
  let scheduled = false;
  function changed() {
    S.ver++;
    if (scheduled) return;
    scheduled = true;
    (window.requestAnimationFrame || setTimeout)(() => { scheduled = false; listeners.forEach((fn) => { try { fn(); } catch (e) { console.error(e); } }); });
  }

  const store = (SL.store = {
    COLLS, DEFAULT_CONFIG, DOC_CAP: 5000,
    onChange: (fn) => { listeners.add(fn); return () => listeners.delete(fn); },
    changed,
    /** true when the viewer may write (null = unknown → optimistic) and not "view as investor". */
    canWrite: () => S.canWrite !== false && !SL.ui?.investorView,
    readOnly: () => S.canWrite === false,
  });

  /* ---------------- boot ---------------- */
  store.boot = async function () {
    // window.__SL_RUNTIME: an injected stand-in (local dev harness, static investor snapshot); else the claude.ai runtime
    const c = window.__SL_RUNTIME || window.claude;
    if (!c || typeof c.use !== "function") { S.noRuntime = true; S.ready = true; changed(); return; }
    const db = await c.use("db");
    if (!db) { S.noRuntime = true; S.ready = true; changed(); return; }
    S.db = db;
    // secondary capabilities resolve independently; never block first paint on them
    c.use("user").then(async (u) => {
      S.user = u;
      if (u) {
        try { const can = await u.can("data.write"); if (can === false) S.canWrite = false; else if (can === true) S.canWrite = true; } catch (e) {}
        try { S.isOwner = await u.isOwner(); } catch (e) {}
      }
      changed();
    });
    c.use("assets").then((a) => { S.assets = a; changed(); });
    c.use("downloads").then((d) => { S.downloads = d; changed(); });
    c.use("sample").then(async (s) => {
      S.sample = s;
      if (s) { try { S.sampleLimits = await s.limits(); } catch (e) { S.sampleLimits = null; } }
      changed();
    });
    for (const coll of COLLS) subscribe(coll);
    // legacy v1 docs: count only (doc meter + migration notice)
    db.collection("entries").get().then((snap) => { S.legacyCount = snap.size; changed(); }).catch(() => {});
  };

  /* Liveness is per collection: S.dead[coll] = error code while that listener is down. S.live = none down.
   * A dropped bridge ("unavailable" and other transient codes) is retried with a fresh onSnapshot a bounded
   * number of times; a refused or exhausted listener is terminal (S.liveTerminal → "Reload to reconnect"). */
  S.dead = {};
  const TERMINAL = new Set(["revoked", "invalid_argument", "resource_exhausted", "permission_denied", "not_granted"]);
  const RETRIES = 3, retries = {}, unsubs = {};
  function setLive() { const d = Object.keys(S.dead); S.live = !d.length; S.liveTerminal = d.some((c) => S.dead[c].terminal); }
  function subscribe(coll) {
    let off = null;
    try { if (unsubs[coll]) unsubs[coll](); } catch (e) {}
    off = S.db.collection(coll).onSnapshot(
      (snap) => {
        const map = {};
        snap.docs.forEach((d) => { if (d.exists) map[d.id] = Object.assign({ id: d.id }, d.data()); });
        if (coll === "config") S.config = mergeConfig(map.main);
        else if (coll === "catalog") S.catalog = {
          crews: map.crews || { items: {} }, equipment: map.equipment || { items: {}, kits: {} },
          items: map.items || { items: {} }, suppliers: map.suppliers || { items: {} },
        };
        else S[coll] = map;
        S.loaded[coll] = true;
        S.ready = COLLS.every((c) => S.loaded[c]);
        S.lastSync = Date.now();
        delete S.dead[coll]; retries[coll] = 0; setLive();
        changed();
      },
      (err) => {
        const code = (err && err.code) || "unavailable";
        const terminal = TERMINAL.has(code) || (retries[coll] || 0) >= RETRIES;
        S.dead[coll] = { code, terminal }; S.liveErr = code; setLive(); changed();
        try { if (off) off(); } catch (e) {}
        if (terminal) return;
        retries[coll] = (retries[coll] || 0) + 1;
        // randomized backoff (≈2 s, 6 s, 18 s) so several listeners don't reconnect in lockstep
        setTimeout(() => subscribe(coll), Math.round((2000 * Math.pow(3, retries[coll] - 1)) * (0.75 + Math.random() * 0.5)));
      }
    );
    unsubs[coll] = typeof off === "function" ? off : null;
  }
  function mergeConfig(doc) {
    const d = doc || {};
    return Object.assign({}, DEFAULT_CONFIG, d, {
      defaults: Object.assign({}, DEFAULT_CONFIG.defaults, d.defaults),
      flags: Object.assign({}, DEFAULT_CONFIG.flags, d.flags),
      trades: d.trades && d.trades.length ? d.trades.map((t) => Object.assign({ role: t.key === "laborer" ? "laborer" : "master" }, t)) : DEFAULT_CONFIG.trades,
    });
  }

  /* ---------------- writes ---------------- */
  const chains = new Map(); // path → promise (one write at a time per document)
  function serial(path, fn) {
    const prev = chains.get(path) || Promise.resolve();
    const next = prev.catch(() => {}).then(fn);
    chains.set(path, next);
    next.finally(() => { if (chains.get(path) === next) chains.delete(path); });
    return next;
  }
  function stamp(data, isCreate) {
    const now = Date.now();
    const out = Object.assign({}, data, { updatedAt: now });
    if (isCreate && out.createdAt == null) out.createdAt = now;
    return out;
  }
  /** Wrap a write: resolves {ok:true} or {ok:false, code, message}. Refused writes flip read-only when the platform said nothing. */
  async function guard(fn) {
    if (!S.db) return { ok: false, code: "unavailable", message: "Not connected" };
    if (S.canWrite === false) return { ok: false, code: "read_only", message: "View only" };
    try { const r = await fn(); return { ok: true, value: r }; }
    catch (e) {
      const code = (e && e.code) || "unavailable";
      if (code === "invalid_argument" && S.canWrite == null) { S.canWrite = false; changed(); }
      if (code === "quota_exceeded") { S.quotaFull = true; changed(); }
      console.warn("[store] write failed", code, e && e.message);
      return { ok: false, code, message: (e && e.message) || String(e) };
    }
  }
  store.errText = (r) => (!r || r.ok ? "" : r.code === "read_only" ? "View only: you can't change this ledger" : r.code === "quota_exceeded" ? "Storage full (5,000 documents). Archive a finished project in Settings › Data." : r.code === "unavailable" ? "Not saved: connection problem. Retry." : "Not saved: " + (r.message || r.code));

  /** Create (or replace) a document. Returns {ok, id}. */
  store.put = (coll, id, data) => { id = id || U.rid(coll.slice(0, 3)); const path = coll + "/" + id; return serial(path, () => guard(() => S.db.doc(path).set(stamp(data, true)))).then((r) => Object.assign(r, { id })); };
  store.add = (coll, data, prefix) => store.put(coll, U.rid(prefix || coll.slice(0, 3)), data);
  /** Merge-update an existing document (nested maps merge; arrays replace). */
  store.patch = (coll, id, data) => { const path = coll + "/" + id; return serial(path, () => guard(() => S.db.doc(path).update(stamp(data, false)))).then((r) => Object.assign(r, { id })); };
  /** Hard delete — only inbox items and never money docs. */
  store.remove = (coll, id) => { const path = coll + "/" + id; return serial(path, () => guard(() => S.db.doc(path).delete())); };
  /**
   * Merge into a doc that may not exist yet, without ever replacing one that does. The choice is made inside the
   * per-document queue (not at call time from a snapshot that may lag): update first; only when that fails because
   * the doc is missing (confirmed by a read) is it created with set(). patchFn(known) / createFn() build the bodies
   * when the write runs; `known` is the set of sub-keys (e.g. crew ids) this page has already written to that doc.
   */
  const known = new Map(); // path → Set of sub-keys written by this page (a doc this page created counts as existing)
  const MISSING = new Set(["invalid_argument", "not_found"]);

    return serial(path, () => guard(async () => {
      const ref = S.db.doc(path), k = known.get(path) || new Set();
      try { return await ref.update(stamp(patchFn(k), false)); }
      catch (e) {
        if (!e || !MISSING.has(e.code) || hasDoc(coll, id) || known.has(path)) throw e;
        let snap = null;
        try { snap = ref.get ? await ref.get() : null; } catch (e2) {}
        if (!snap || snap.exists) throw e; // exists (so the update was refused for another reason) or unknown: never overwrite
        return ref.set(stamp(createFn(), true));
      }
    })).then((r) => {
      if (r.ok) { const k = known.get(path) || new Set(); if (sub != null) k.add(sub); known.set(path, k); }
      return Object.assign(r, { id });
    });
  }
  store.upsert = upsert;
  function hasDoc(coll, id) { return coll === "catalog" ? !!(S.catalog[id] && S.catalog[id].id) : coll === "config" ? !!(S.config && S.config.id) : !!(S[coll] && S[coll][id]); }
  /** Patch a catalog map entry: catalog/<kind>.items[id] (or .kits[id]). */
  store.catalogPut = (kind, id, data, field) => {
    field = field || "items";
    const body = { [field]: { [id]: data } };
    return upsert("catalog", kind, () => body, () => Object.assign({ items: {}, kits: {} }, body));
  };

  /* ---------------- timesheets (crew days) ---------------- */
  store.tsId = (pid, sat) => pid + "_" + sat;
  /** Write one or more crew days: days = {date: {m,l,food,job?,plan?} | null}. Creates the week doc / crew block as needed.
   *  Whether the doc / block exists is decided when the write runs (see upsert), so quick successive writes to a
   *  new week never replace each other. */
  store.setDays = (pid, sat, crewId, days, blockInit) => {
    const id = store.tsId(pid, sat);
    const init = () => blockInit || store.newBlock(crewId);
    const hasBlock = (k) => { const doc = S.timesheets[id]; return !!(doc && doc.crews && doc.crews[crewId]) || k.has(crewId); };
    return upsert("timesheets", id,
      (k) => ({ crews: { [crewId]: hasBlock(k) ? { days } : Object.assign({}, init(), { days }) } }),
      () => ({ projectId: pid, weekStart: sat, crews: { [crewId]: Object.assign({ payments: {}, acks: {} }, init(), { days }) } }),
      crewId);
  };
  /** Frozen rates + default job for a new crew block, from the crew catalog → config defaults. */
  store.newBlock = (crewId) => {
    const c = (S.catalog.crews.items || {})[crewId] || {};
    const d = S.config.defaults || DEFAULT_CONFIG.defaults;
    const r = c.rates || {};
    return { rates: { m: U.num(r.m != null ? r.m : d.m), l: U.num(r.l != null ? r.l : d.l), food: U.num(r.food != null ? r.food : d.food) }, job: c.defaultJobId || "", note: "" };
  };
  store.patchBlock = (pid, sat, crewId, data) => {
    const id = store.tsId(pid, sat);
    const full = () => Object.assign({ days: {}, payments: {}, acks: {} }, store.newBlock(crewId), data);
    const hasBlock = (k) => { const doc = S.timesheets[id]; return !!(doc && doc.crews && doc.crews[crewId]) || k.has(crewId); };
    return upsert("timesheets", id,
      (k) => ({ crews: { [crewId]: hasBlock(k) ? data : full() } }),
      () => ({ projectId: pid, weekStart: sat, crews: { [crewId]: full() } }),
      crewId);
  };

  /* ---------------- payments ---------------- */
  /** Where a unit's payments live: returns {coll, id, wrap(payload)} for SL.model units. */
  function payTarget(u) {
    if (u.kind === "crew") return { coll: "timesheets", id: u.tsId, wrap: (p) => ({ crews: { [u.crewId]: p } }) };
    return { coll: "costs", id: u.id, wrap: (p) => p };
  }
  /**
   * Record a payment on a unit. amount in SAR. Returns {ok, ref} where ref undoes it via store.voidPay(ref).
   * opts: {amount, walletId, date, note, batch}
   */
  store.pay = async (u, opts) => {
    const key = "p" + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36);
    const t = payTarget(u);
    const pay = { date: opts.date || U.today(), amount: U.round2(opts.amount), walletId: opts.walletId, at: Date.now() };
    if (opts.note) pay.note = opts.note;
    if (opts.batch) pay.batch = opts.batch;
    const r = await store.patch(t.coll, t.id, t.wrap({ payments: { [key]: pay } }));
    // crewId only for crew-week units: rentals / other costs also carry a crewId, but their payments live on the cost doc
    return Object.assign(r, { ref: { coll: t.coll, id: t.id, key, crewId: u.kind === "crew" ? u.crewId : undefined } });
  };
  store.voidPay = (ref) => {
    const body = ref.coll === "timesheets" && ref.crewId ? { crews: { [ref.crewId]: { payments: { [ref.key]: { void: true, voidAt: Date.now() } } } } } : { payments: { [ref.key]: { void: true, voidAt: Date.now() } } };
    return store.patch(ref.coll, ref.id, body);
  };
  /** Ack / snooze a flag on its owning doc. target = {coll,id,crewId?} ; value = {at,note,fp,until?} or null to clear. */
  store.ack = (target, flagId, value) => {
    const v = value ? Object.assign({ at: Date.now(), cleared: false, until: "" }, value) : { cleared: true, at: Date.now() };
    const body = target.crewId ? { crews: { [target.crewId]: { acks: { [flagId]: v } } } } : { acks: { [flagId]: v } };
    return store.patch(target.coll, target.id, body);
  };

  /* ---------------- assets ---------------- */
  store.upload = async (file) => {
    if (!S.assets) return { ok: false, code: "not_granted", message: "Uploads need the ledger opened inside Claude by an editor" };
    try {
      const opts = file.type ? undefined : { type: /\.pdf$/i.test(file.name || "") ? "application/pdf" : "image/jpeg" };
      const r = await S.assets.upload(file, opts);
      return { ok: true, id: r.id, url: r.url, size: r.sizeBytes, type: r.contentType };
    } catch (e) { return { ok: false, code: (e && e.code) || "upstream_error", message: (e && e.message) || "Upload failed" }; }
  };

  /** Resolve once SL.S[coll][id] is present (a write lands in SL.S only when its snapshot arrives). → doc | null after ms. */
  store.waitFor = (coll, id, ms) => new Promise((res) => {
    const has = () => (coll === "catalog" ? S.catalog[id] && S.catalog[id].id : S[coll] && S[coll][id]);
    if (has()) return res(has());
    const t0 = Date.now(), off = store.onChange(() => { if (has() || Date.now() - t0 > (ms || 4000)) { off(); res(has() || null); } });
    setTimeout(() => { off(); res(has() || null); }, ms || 4000);
  });
  /** Count of docs (for the storage meter). */
  store.docCount = () => {
    let n = S.legacyCount || 0;
    for (const c of COLLS) { if (c === "config") n += S.config && S.config.id ? 1 : 0; else if (c === "catalog") n += ["crews", "equipment", "items", "suppliers"].filter((k) => S.catalog[k] && S.catalog[k].id).length; else n += Object.keys(S[c] || {}).length; }
    return n;
  };

  /** Offer a file to the viewer (CSV/JSON). */
  store.download = async (filename, data) => {
    if (!S.downloads) return { ok: false, code: "unavailable" };
    try { await S.downloads.save({ filename, data }); return { ok: true }; } catch (e) { return { ok: false, code: (e && e.code) || "declined" }; }
  };
})(window.SL);

/* ---- 10-model.js ---- */
/* SL.model — the money model. Pure over SL.S; every figure takes an as-of date D (ISO) and is in integer halalas (h).
 *   unit    = something that costs money and gets paid: a crew-week block, a purchase, service, other cost or rental.
 *   inc     = cost to date (accrued as of D)        paid = Σ payments dated ≤ D (not void)
 *   owed    = max(0, inc − paid)                     prepaid = max(0, paid − inc)      paidOff = min(paid, inc)
 * Identities (asserted in totals): paidOff + owed = cost ; paidOff + prepaid = paid. */
(function (SL) {
  const U = SL.util, S = () => SL.S;
  const M = (SL.model = {});
  const CATS = (M.CATS = {
    T: { key: "T", label: "Trades", long: "Trades (crew wages & food)", short: "Trades" },
    P: { key: "P", label: "Purchases", long: "Purchases (materials)", short: "Purch." },
    E: { key: "E", label: "Equipment", long: "Equipment rentals", short: "Equip." },
    S: { key: "S", label: "Services", long: "Services (cleaning, disposal, transport…)", short: "Serv." },
    O: { key: "O", label: "Other", long: "Other costs", short: "Other" },
  });
  M.CAT_ORDER = ["T", "P", "E", "S", "O"];
  M.SERVICE_SUBS = {
    cleaning: { label: "Cleaning", ar: "تنظيف" }, disposal: { label: "Disposal / debris", ar: "ترحيل مخلفات" },
    transport: { label: "Transport", ar: "نقل" }, water: { label: "Water truck", ar: "وايت ماء" },
    security: { label: "Security / guard", ar: "حراسة" }, other: { label: "Other service", ar: "" },
  };
  const KIND_CAT = { crew: "T", purchase: "P", rental: "E", service: "S", other: "O" };

  /* ---------------- caches keyed on SL.S.ver ---------------- */
  let cacheVer = -1, cache = {};
  function C() { if (cacheVer !== S().ver) { cacheVer = S().ver; cache = { calc: new Map() }; } return cache; }
  function memo(key, fn) { const c = C(); if (!(key in c)) c[key] = fn(); return c[key]; }

  /* ---------------- lookups ---------------- */
  M.projects = () => memo("projects", () => U.sortBy(Object.values(S().projects || {}), (p) => (p.order != null ? p.order : 1e9) + ":" + (p.createdAt || 0)));
  M.project = (pid) => (S().projects || {})[pid] || null;

/* SL.prices — the price book. Observations are priced lines (purchases, quotes, services, rentals, crew rates),

        fp: [u.key, stale.map((d) => d.date + ":" + d.m + ":" + d.l)], fixes: [X.go("Came / Didn't come", go)] }, base)));

/* ---------- wallet, capital and system rules: F1 F2 K1 K2 X1 X2 ---------- */
(function (SL) {

      <div class="td-ctl">${cell("m", X.stepVal(cid, date, "m", rec))}${cell("l", X.stepVal(cid, date, "l", rec))}${foodCtl}${jobCtl}${plan ? '<span class="t12 c-committed td-pw">Planned</span>' : ""}${ro ? "" : `<button type="button" class="td-rm" id="td-${U.esc(cid)}-rm" data-act="tdRemove" data-cid="${U.esc(cid)}" data-date="${date}" aria-label="${plan ? "Remove the plan" : "Didn't come: remove this day"}">✕ ${plan ? "Remove" : "Didn't come"}</button>`}</div></div>`;

/* ---- chunk 3: Today view — sections and registration ---- */
(function (SL) {
  "use strict";
  const U = SL.util, M = SL.model, ui = SL.ui;
  const X = (SL._today = SL._today || {});

  X.crewsSection = (pid, date, ro) => {
    const { withRec, active } = X.crewsFor(pid, date);
    const plans = X.plansOn(pid, date);
    let pm = 0, ph = 0, cm = 0, chh = 0;
    for (const cid of withRec) {
      const rec = X.day(pid, cid, date), h = X.dayH(rec, X.rates(pid, cid, date));
      if (rec.plan) { pm += X.heads(rec); ph += h; } else { cm += X.heads(rec); chh += h; }
    }
    let right = "";
    if (plans.length) right = '<span class="c-committed">planned ' + pm + " men · (" + ui.m(ph) + ")</span>";
    else if (withRec.length) right = cm + " men · " + ui.m(chh);
    let h = '<section class="sec td-crews">' + ui.sech("Crews today" + (date !== U.today() ? " · " + U.esc(U.dShort(date)) : ""), right || null);
    if (plans.length && !ro) h += `<button type="button" class="btn block td-allcame" id="td-allcame" data-act="confirmPlanned" data-date="${date}">✓ All came as planned</button>`;
    if (!withRec.length && !active.length) h += '<div class="empty">No crews logged ' + (date === U.today() ? "today" : "on " + U.esc(U.dShort(date))) + "</div>";
    for (const cid of withRec) h += X.crewRow(pid, cid, date, ro);
    for (const cid of active) h += X.crewRow(pid, cid, date, ro);
    if (!ro) h += '<div class="td-add"><button type="button" class="lnk" data-act="newCrew">+ Crew</button></div>';
    return h + "</section>";
  };

  /** Rentals on site that date (or unpriced and not returned), one line per crew. */
  X.onSiteSection = (pid, date, ro) => {
    const rs = M.unitsFor(pid).filter((u) => u.kind === "rental" && (u.onSite(date) || (u.noPrice && !u.out)));
    if (!rs.length) return "";
    const groups = U.groupBy(rs, (u) => u.crewId || "");
    let dayTot = 0, np = 0;
    const rows = [];
    for (const [cid, list] of Object.entries(groups)) {
      const priced = list.filter((u) => !u.noPrice && u.onSite(date)), unp = list.filter((u) => u.noPrice);
      const daily = U.sum(priced, (u) => u.daily);
      dayTot += daily; np += unp.length;
      const name = cid ? X.crewLabel(cid) : "No crew";
      const names = U.uniq(list.map((u) => (u.doc.desc || "Equipment").replace(/\s*\(.*\)\s*$/, ""))).slice(0, 3).join(", ");
      const amt = unp.length && !daily ? '<span class="unk">?</span>/day' : ui.mw(daily) + "/day";
      const w = unp.length ? `<span class="c-warn">? ${unp.length} No price · counts 0</span>` : "";
      const set = unp.length && !ro ? `<button type="button" class="lnk td-set" data-act="bulkPrice" data-crew="${U.esc(cid)}">Set</button>` : "";
      rows.push(`<div class="row nosw td-kit"><span class="t">${cid ? `<button type="button" class="td-kitname" data-go="${U.esc(ui.href("crew", cid, U.weekStart(date)))}">${name}</button>` : name} <span class="muted">· ${list.length} line${list.length > 1 ? "s" : ""}</span></span>` +
        `<span class="a num">${amt}</span><span class="f"></span><span class="m">${U.t(names)}${list.length > 3 ? " …" : ""}</span><span class="w">${w} ${set}</span></div>`);
    }
    const right = (np && !dayTot ? '<span class="unk">?</span>' : ui.mw(dayTot)) + "/day";
    return '<section class="sec td-onsite">' + ui.sech("On site · " + rs.length + " rental line" + (rs.length > 1 ? "s" : ""), right) + rows.join("") + "</section>";
  };

  /** That date's purchase / service / other costs. */
  X.boughtSection = (pid, date, ro) => {
    const D = U.today(); // Today is always live (spec part 1 §2.6)
    const us = U.sortBy(M.unitsFor(pid).filter((u) => (u.kind === "purchase" || u.kind === "service" || u.kind === "other") && u.date === date), (u) => u.doc.createdAt || 0);
    const tot = U.sum(us, (u) => M.calc(u, U.maxDate(D, date)).inc);
    let h = '<section class="sec td-bought">' + ui.sech("Bought " + (date === U.today() ? "today" : U.esc(U.dShort(date))), us.length ? ui.m(tot) : ui.mz(0));
    h += us.map((u) => ui.unitRow(u, U.maxDate(D, date))).join("");
    if (!us.length) h += '<div class="empty t13">Nothing bought ' + (date === U.today() ? "today" : "that day") + "</div>";
    // Photo needs the assets capability (null for readers, or when not granted here): no button rather than a dead end
    const photo = SL.S.assets ? `<button type="button" class="btn sec" id="td-photo" data-act="addPhoto" data-date="${date}">Photo of receipt</button>` : "";
    if (!ro) h += `<div class="btns td-addbuy">${photo}<button type="button" class="btn sec" id="td-typeit" data-act="addPurchase" data-date="${date}">Type it</button></div>`;
    return h + "</section>";
  };

  // Today and Week are always live (spec part 1 §2.6): no as-of band, and the default date is today, never ui.D().
  SL.views.today = {
    tab: "today",
    render(route, pid) {
      const date = X.isoArg(route.args[0]) || U.today(), ro = X.ro();
      return '<div class="v-today">' + X.head("today", date) + X.strip(pid, date) + (ro ? "" : X.staleBanner(pid)) +
        X.crewsSection(pid, date, ro) + X.onSiteSection(pid, date, ro) + X.boughtSection(pid, date, ro) + "</div>";
    },
  };
})(window.SL);

/* ---- chunk 4: Today actions — Came today, food toggle, day job, confirmPlanned, addCrewDay ---- */
(function (SL) {
  "use strict";
  const U = SL.util, M = SL.model, ui = SL.ui, A = SL.actions;
  const X = (SL._today = SL._today || {});
  const name = (cid) => U.esc(X.crewCat(cid).name || cid);
  /** Commit one day and offer Undo back to the previous record. */
  X.commitDay = async (pid, cid, date, rec, msg) => {
    const prev = M.crewDay(pid, cid, date).day;
    const r = await X.write(pid, cid, { [date]: rec });
    if (!r.ok) return r;
    ui.toast(msg, { undo: async () => { await X.write(pid, cid, { [date]: X.full(prev) }); } });
    return r;
  };

  A.tdCame = async (ds) => {
    if (X.ro()) return;
    const pid = ui.pid(), cid = ds.cid, date = ds.date || U.today();
    const rec = X.usualRec(pid, cid, date), h = X.dayH(rec, X.rates(pid, cid, date));
    rec.plan = date > U.today(); // a future day is a plan until someone confirms it
    await X.commitDay(pid, cid, date, rec, name(cid) + (rec.plan ? " planned " + U.esc(U.dShort(date)) : " came") + " · " + rec.m + "M " + rec.l + "L" + (rec.food ? " +food" : "") + " · " + (rec.plan ? "(" + U.m(h / 100) + ")" : U.m(h / 100)));
  };

  A.tdFood = async (ds) => {
    if (X.ro()) return;
    const pid = ui.pid(), cid = ds.cid, date = ds.date;
    const cur = M.crewDay(pid, cid, date).day; if (!cur) return;
    const on = U.num(cur.food) > 0, rec = Object.assign({}, cur, { food: on ? 0 : U.num(X.rates(pid, cid, date).food) }, cur.est ? { est: false } : {});
    await X.commitDay(pid, cid, date, rec, name(cid) + (on ? " · no food " : " · +food ") + U.esc(U.dShort(date)));
  };

  /** ▲▼ on a Today crew row: one person more or less. Only the one field is written (days merge), and taps made
   *  before the db echoes back build on the pending count, so quick taps never lose a step. */
  X.pend = X.pend || {};
  X.stepVal = (cid, date, f, rec) => {
    const k = cid + "|" + date + "|" + f, v = U.num(rec[f]);
    if (k in X.pend) { if (X.pend[k] === v) delete X.pend[k]; else return X.pend[k]; }
    return v;
  };
  A.tdStep = async (ds) => {
    if (X.ro()) return;
    const pid = ui.pid(), cid = ds.cid, date = ds.date, f = ds.field === "l" ? "l" : "m";
    const cur = X.day(pid, cid, date); if (!cur) return;
    const k = cid + "|" + date + "|" + f, base = k in X.pend ? X.pend[k] : U.num(cur[f]);
    const n = Math.max(0, base + (U.num(ds.dir) < 0 ? -1 : 1));
    if (n === base) return;
    X.pend[k] = n;
    ui.render();
    const val = { [f]: n }; if (cur.est) val.est = false;
    const r = await SL.store.setDays(pid, U.weekStart(date), cid, { [date]: val });
    if (!r.ok) { delete X.pend[k]; ui.render(); ui.toast(U.esc(SL.store.errText(r))); }
  };

  /** ✕ on a Today row: the crew didn't come (or the plan is off). Removes the day; Undo puts it back. */
  A.tdRemove = async (ds) => {
    if (X.ro()) return;
    const pid = ui.pid(), cid = ds.cid, date = ds.date, cur = M.crewDay(pid, cid, date).day;
    if (!cur) return;
    const r = await X.write(pid, cid, { [date]: null });
    if (!r.ok) return;
    ui.toast(name(cid) + " removed · " + U.esc(U.dShort(date)), { ms: 10000, undo: async () => { await X.write(pid, cid, { [date]: X.full(cur) }); } });
  };

  /** Job for one crew day only (job chips). */
  A.tdJob = (ds) => {
    if (X.ro()) return;
    const pid = ui.pid(), cid = ds.cid, date = ds.date;
    const start = X.dayJob(pid, cid, date);
    const save = async (sh) => {
      const cur = M.crewDay(pid, cid, date).day; if (!cur) return sh.close(true);
      const jid = sh.state.job || "";
      if (jid === (cur.job || X.blockJob(pid, cid, date))) return sh.close(true);
      const rec = Object.assign({}, cur, { job: jid === X.blockJob(pid, cid, date) ? "" : jid });
      sh.busy(true);
      const r = await X.write(pid, cid, { [date]: rec }, true);
      sh.busy(false);
      if (!r.ok) return sh.error(SL.store.errText(r));
      ui.rememberJob(pid, jid);
      sh.close(true);
      ui.toast(name(cid) + " · " + U.esc(U.dShort(date)) + " → " + U.esc(M.jobCode(jid) || "no job"), { undo: async () => { await X.write(pid, cid, { [date]: X.full(cur) }); } });
    };
    ui.sheet({
      title: name(cid) + " · " + U.esc(U.dShort(date)),
      state: { job: start },
      body: (sh) => '<p class="t12 muted">Job for this day only. The week stays on ' + U.esc(M.jobCode(X.blockJob(pid, cid, date)) || "no job") + ".</p>" + ui.jobChips(pid, sh.state.job, { seg: "job" }),
      onInput: (sh, f) => { if (f === "job") save(sh); },
      foot: () => '<button class="btn sec" data-act="close">Cancel</button><button class="btn" id="td-job-done" data-act="tdJobDone">Done</button>',
      acts: { tdJobDone: (d, el, ev, sh) => save(sh) },
    });
  };

  /** Confirm every planned crew on a date: one setDays per timesheet, dropping plan. */
  A.confirmPlanned = async (ds) => {
    if (X.ro()) return;
    const pid = ui.pid(), date = (ds && ds.date) || U.today();
    const plans = X.plansOn(pid, date);
    if (!plans.length) { ui.toast("Nothing planned on " + U.esc(U.dShort(date))); return; }
    // one write for the whole week doc: every planned crew block on this date flips to confirmed
    const tsId = SL.store.tsId(pid, U.weekStart(date));
    const body = (planFlag) => ({ crews: Object.fromEntries(plans.map(({ cid, rec }) => [cid, { days: { [date]: Object.assign(X.clean(rec), { plan: planFlag }) } }])) });
    const r = await SL.store.patch("timesheets", tsId, body(false));
    if (!r || !r.ok) { ui.toast("Not saved · " + U.esc(SL.store.errText(r || {}))); return; }
    const h = U.sum(plans, (x) => X.dayH(x.rec, X.rates(pid, x.cid, date)));
    ui.toast("Confirmed " + plans.length + " crew" + (plans.length > 1 ? "s" : "") + " · " + U.esc(U.dShort(date)) + " · " + U.m(h / 100),
      { undo: async () => { await SL.store.patch("timesheets", tsId, body(true)); } });
  };

  /** "+ day": Today if crews are planned today, else a crew picker → the crew grid. */
  A.addCrewDay = (ds) => {
    const pid = ui.pid(), today = U.today();
    if (X.plansOn(pid, today).length) return ui.go("today");
    const ids = U.uniq([...X.crewsFor(pid, today).withRec, ...X.crewsFor(pid, today).active, ...M.projectCrewIds(pid)]).filter((c) => M.crew(c) && M.crew(c).active !== false);
    ui.sheet({
      title: "Which crew?",
      body: () => (ids.length ? '<div class="td-pick">' + ids.map((cid) => `<button type="button" class="row nosw tap" data-act="tdPickCrew" data-cid="${U.esc(cid)}"><span class="t">${X.crewLabel(cid)}</span><span class="a"></span><span class="f"></span><span class="m">${U.esc((M.trade(X.crewCat(cid).masterTrade) || {}).name || "")}</span></button>`).join("") + "</div>" : '<div class="empty">No crews yet</div>') +
        (X.ro() ? "" : '<div class="td-add"><button type="button" class="lnk" data-act="newCrew">+ New crew</button></div>'),
      acts: { tdPickCrew: (d, el, ev, sh) => { sh.close(true); ui.go("crew", d.cid, U.weekStart(today)); } },
    });
  };
})(window.SL);

/* ---- chunk 5: Week view — crews × Sat–Fri matrix ---- */
(function (SL) {
  "use strict";
  const U = SL.util, M = SL.model, ui = SL.ui;
  const X = (SL._today = SL._today || {});

  /** Crews shown for a week: a block in that week, or active in the 14 days to its Friday (or brand new). */
  X.weekCrews = (pid, sat) => {
    const ts = (SL.S.timesheets || {})[SL.store.tsId(pid, sat)];
    const inWeek = Object.keys((ts && ts.crews) || {}).filter((cid) => ts.crews[cid]);
    const fri = U.addDays(sat, 6), f = X.crewsFor(pid, fri);
    const order = M.projectCrewIds(pid);
    const ids = U.uniq([...inWeek, ...f.withRec, ...f.active]);
    return U.sortBy(ids, (c) => { const i = order.indexOf(c); return i < 0 ? 999 : i; });
  };

  X.weekCell = (pid, cid, d, bj, ro) => {
    const rec = M.crewDay(pid, cid, d).day, fri = !M.isWorkDay(pid, d);
    let inner = "", cls = "wk-d" + (fri ? " off" : "") + (d === U.today() ? " now" : "");
    if (rec && (X.heads(rec) || U.num(rec.food))) {
      if (rec.plan) cls += " plan";
      const j = rec.job && rec.job !== bj ? '<small class="wk-j">' + U.esc(M.jobCode(rec.job)) + "</small>" : "";
      inner = `<span class="num">${U.num(rec.m)}·${U.num(rec.l)}</span>${U.num(rec.food) ? '<i class="wk-food" title="food"></i>' : ""}${j}`;
    } else inner = '<span class="faint">' + (fri ? "" : "·") + "</span>";
    const lab = U.esc(X.crewCat(cid).name || cid) + " " + U.esc(U.dShort(d)) + (rec ? " " + U.num(rec.m) + " masters " + U.num(rec.l) + " laborers" + (rec.plan ? " planned" : "") : " empty");
    return ro ? `<td class="${cls}"><span class="wk-in" aria-label="${lab}">${inner}</span></td>`
      : `<td class="${cls}"><button type="button" class="wk-in" id="wk-${U.esc(cid)}-${d}" data-act="cellSheet" data-cid="${U.esc(cid)}" data-date="${d}" data-field="m" aria-label="${lab}">${inner}</button></td>`;
  };

  X.weekMatrix = (pid, sat, ro) => {
    const days = U.weekDays(sat), D = U.today(), ids = X.weekCrews(pid, sat);
    if (!ids.length) return '<div class="empty">No crews this week' + (ro ? "" : ' · <button type="button" class="lnk" data-act="newCrew">+ Crew</button>') + "</div>";
    let h = '<div class="tscroll wk-scroll"><table class="wk"><thead><tr><th class="wk-c" scope="col">SAR</th>' +
      days.map((d) => `<th scope="col" class="wk-h${M.isWorkDay(pid, d) ? "" : " off"}${d === U.today() ? " now" : ""}">${U.esc(U.dStrip(d))}</th>`).join("") +
      '<th class="r wk-tot" scope="col">Cost</th><th class="r wk-tot" scope="col">Owed</th></tr></thead><tbody>';
    let tCost = 0, tOwed = 0;
    for (const cid of ids) {
      const bj = X.blockJob(pid, cid, sat), u = M.crewUnit(pid, sat, cid), r = u ? M.calc(u, D) : null;
      if (r) { tCost += r.inc; tOwed += r.owed; }
      const us = X.crewCat(cid).usual || {};
      h += `<tr><th class="wk-c" scope="row"><button type="button" class="wk-name" data-go="${U.esc(ui.href("crew", cid, sat))}"><span class="wk-n">${U.t(X.crewCat(cid).name || cid)}</span><span class="wk-meta">${bj ? U.esc(M.jobCode(bj)) + " · " : ""}${U.num(us.m)}·${U.num(us.l)}</span></button></th>`;
      h += days.map((d) => X.weekCell(pid, cid, d, bj, ro)).join("");
      h += `<td class="r wk-tot num">${r && r.inc ? ui.mw(r.inc) : '<span class="zero">–</span>'}</td><td class="r wk-tot num">${r && r.owed ? '<span class="c-owed">' + ui.mw(r.owed) + "</span>" : '<span class="zero">–</span>'}</td></tr>`;
    }
    h += "</tbody><tfoot>";
    const dh = days.map((d) => M.dayHeads(pid, d));
    h += '<tr><th class="wk-c" scope="row">Heads/day</th>' + dh.map((x) => `<td class="r num">${x.heads || (x.planned.heads ? "" : '<span class="zero">–</span>')}${x.planned.heads ? '<span class="c-committed">(' + x.planned.heads + ")</span>" : ""}</td>`).join("") + '<td class="r"></td><td class="r"></td></tr>';
    h += '<tr><th class="wk-c" scope="row">SAR/day</th>' + dh.map((x) => `<td class="r num">${x.h ? ui.mw(x.h) : x.planned.h ? '<span class="c-committed">(' + ui.mw(x.planned.h) + ")</span>" : '<span class="zero">–</span>'}</td>`).join("") +
      `<td class="r num">${tCost ? ui.mw(tCost) : '<span class="zero">–</span>'}</td><td class="r num">${tOwed ? '<span class="c-owed">' + ui.mw(tOwed) + "</span>" : '<span class="zero">–</span>'}</td></tr>`;

/* ---- chunk 6: Copy last week to plan ---- */
(function (SL) {
  "use strict";
  const U = SL.util, M = SL.model, ui = SL.ui, A = SL.actions;
  const X = (SL._today = SL._today || {});

  /** Plan records for this week from last week's same weekdays; never over a day that has a record, never before today. */
  X.copyPlan = (pid, sat) => {
    const lastTs = (SL.S.timesheets || {})[SL.store.tsId(pid, U.addDays(sat, -7))], today = U.today(), out = {};
    if (!lastTs) return out;
    for (const [cid, b] of Object.entries(lastTs.crews || {})) {
      if (!b) continue;
      for (const [d0, rec] of Object.entries(b.days || {})) {
        if (!rec || !(X.heads(rec) > 0)) continue;
        const d = U.addDays(d0, 7);
        if (d < today || X.day(pid, cid, d)) continue;
        const r = { m: U.num(rec.m), l: U.num(rec.l), food: U.num(rec.food), plan: true };
        if (rec.job && rec.job !== (b.job || "")) r.job = rec.job; // untagged days follow the week job (a new block starts on last week's)
        (out[cid] = out[cid] || {})[d] = r;
      }
    }
    return out;
  };

  A.tdCopyWeek = async (ds) => {
    if (X.ro()) return;
    const pid = ui.pid(), sat = U.weekStart(ds.sat || U.today());
    const plan = X.copyPlan(pid, sat), cids = Object.keys(plan);
    if (!cids.length) { ui.toast("Nothing to copy · every day already has a record"); return; }
    const done = [];
    const lastTs = (SL.S.timesheets || {})[SL.store.tsId(pid, U.addDays(sat, -7))] || {};
    for (const cid of cids) {
      // a new block starts like last week's (its rates and week job), as the crew grid's Copy last week does
      const prev = (lastTs.crews || {})[cid] || {}, nb = SL.store.newBlock(cid);
      const init = { rates: Object.assign({}, prev.rates || nb.rates), job: prev.job || nb.job, note: "" };
      const r = await X.write(pid, cid, plan[cid], true, init);
      if (!r.ok) { ui.toast("Not saved · " + U.esc(SL.store.errText(r))); break; }
      done.push(cid);
    }
    if (!done.length) return;
    const n = U.sum(done, (c) => Object.keys(plan[c]).length);
    const h = U.sum(done, (c) => U.sum(Object.values(plan[c]), (rec) => X.dayH(rec, X.rates(pid, c, sat))));
    ui.toast("Planned " + n + " crew day" + (n > 1 ? "s" : "") + " · (" + U.m(h / 100) + ")", {
      undo: async () => { for (const c of done) await X.write(pid, c, Object.fromEntries(Object.keys(plan[c]).map((d) => [d, null])), true); },
    });
  };
})(window.SL);

  X.full = (d) => (d ? Object.assign({ plan: false, job: "" }, U.clone(d)) : null);
  /** Write days for one crew-week; toast msg with Undo that writes `undo`. Returns ok. */
  X.writeDays = async (pid, sat, cid, days, undo, msg, init) => {
    if (!Object.keys(days).length) return false;
    const r = await SL.store.setDays(pid, sat, cid, days, init);
    if (!r.ok) return X.err(r);
    ui.toast(msg, { undo: undo ? async () => { const r2 = await SL.store.setDays(pid, sat, cid, undo); if (!r2.ok) X.err(r2); } : null });
    return true;
  };
  X.cname = (cid) => U.esc(M.crewName(cid));

  A.crewTick = async (d) => {
    const pid = ui.pid(), { cid, sat, date } = d, T = U.today();
    const raw = X.rawDay(pid, sat, cid, date), old = X.full(raw);
    let val, msg;
    if (!raw) {
      const us = X.usual(cid), r = X.rates(pid, sat, cid), fut = date > T;
      val = { m: us.m, l: us.l, food: U.num(r.food), plan: fut };
      msg = `${X.cname(cid)} ${fut ? "planned" : "came"} ${U.esc(U.dShort(date))} · ${us.m} M · ${us.l} L`;
    } else if (raw.plan) {
      if (date <= T) { val = { plan: false }; msg = `Confirmed ${X.cname(cid)} · ${U.esc(U.dShort(date))}`; }
      else { val = null; msg = `Plan removed · ${U.esc(U.dShort(date))}`; }
    } else { val = null; msg = `Cleared ${X.cname(cid)} · ${U.esc(U.dShort(date))}`; }
    return X.writeDays(pid, sat, cid, { [date]: val }, { [date]: old }, msg);
  };

  A.crewFood = async (d) => {
    const pid = ui.pid(), { cid, sat, date } = d;
    const raw = X.rawDay(pid, sat, cid, date);
    if (!raw) { ui.toast("Tick the day first, then set food"); return; }
    const rate = U.num(X.rates(pid, sat, cid).food), cur = U.num(raw.food);
    const food = cur > 0 ? 0 : rate || U.num((SL.S.config.defaults || {}).food);
    // setting food by hand makes the day's amount no longer an estimate
    const val = raw.est ? { food, est: false } : { food }, back = raw.est ? { food: cur, est: true } : { food: cur };
    return X.writeDays(pid, sat, cid, { [date]: val }, { [date]: back }, `Food ${U.esc(U.dShort(date))} · ${food ? U.mw(food) : "none"}`);
  };

  A.crewConfirm = async (d) => {
    const pid = ui.pid(), { cid, sat } = d, due = X.duePlans(pid, sat, cid);

    for (const dt of due) { days[dt] = { plan: false }; undo[dt] = { plan: true }; }
    return X.writeDays(pid, sat, cid, days, undo, `Confirmed ${X.cname(cid)} · ${due.map((x) => U.esc(U.wd(x))).join(", ")}`);
  };

  /** E1: Ryan checked the estimated days of this crew-week, so their amounts stop being estimates. */
  A.crewEstOk = async (d) => {
    if (ui.readOnlyUI()) return;
    const pid = ui.pid(), { cid, sat } = d, b = X.block(pid, sat, cid);
    const est = Object.keys((b && b.days) || {}).filter((dt) => { const r = X.rawDay(pid, sat, cid, dt); return r && r.est && !r.plan; });
    if (!est.length) return;
    const days = {}, undo = {};
    for (const dt of est) { days[dt] = { est: false }; undo[dt] = { est: true }; }
    return X.writeDays(pid, sat, cid, days, undo, `Confirmed amounts · ${X.cname(cid)} · ${est.map((x) => U.esc(U.wd(x))).join(", ")}`);
  };

  /** No money actions for viewers or while an as-of date is set (a bar rendered before the switch can still be tapped). */
  X.noPay = () => {
    if (ui.readOnlyUI()) return true;
    if (ui.isPast()) { ui.toast("Viewing as of " + U.esc(U.dShort(ui.D())) + " · go back to today to pay"); return true; }
    return false;
  };

  A.crewPay = async (d) => {
    if (X.noPay()) return;
    const u = M.unit(d.key); if (!u) return;
    if (SL.actions.payNow) return SL.actions.payNow({ key: d.key });

  };

  A.crewOtherPay = (d) => {

      title: "Pay " + X.cname(u.crewId) + " · " + U.esc(U.dWeek(u.weekStart)),
      state: { amt: U.sar(r.owed) || "", wid: M.payer(u), date: U.today(), note: "" },
      body: (sh) => `<p class="t13">Cost ${ui.mz(r.inc)} · Paid off ${ui.mz(r.paidOff)} · ${r.owed ? '<span class="c-owed">Owed ' + ui.m(r.owed) + "</span>" : "Owed –"}</p>` +
        ui.field({ id: "crew-op-amt", f: "amt", label: "Amount (SAR)", value: sh.state.amt, num: true, hint: "Less than owed = part pay · more = an advance (Prepaid)" }) +
        '<div class="fld"><label>Paid by</label>' + ui.payVia("wid", sh.state.wid, pid, { notYet: false }) + "</div>" +
        ui.field({ id: "crew-op-date", f: "date", label: "Date", type: "date", value: sh.state.date }) +
        ui.field({ id: "crew-op-note", f: "note", label: "Note", value: sh.state.note, attrs: 'placeholder="e.g. advance to the lead (سلفة)"' }),
      foot: () => '<button class="btn sec" data-act="close">Cancel</button><button class="btn" data-act="save" id="crew-op-save">Record payment</button>',
      acts: {
        save: async (x, el, ev, sh) => {
          const amt = U.num(sh.state.amt);
          if (!(amt > 0)) return sh.error("Enter an amount above 0");
          if (!U.isISO(sh.state.date)) return sh.error("Pick a date");
          sh.busy(true);
          const res = await SL.store.pay(u, { amount: amt, walletId: sh.state.wid, date: sh.state.date, note: sh.state.note });
          sh.busy(false);

          ui.toast(`Paid ${X.cname(u.crewId)} ${U.m(amt)}${X.isFloat(sh.state.wid) ? " from float" : " (Ryan)"}`, { undo: async () => { const r2 = await SL.store.voidPay(res.ref); if (!r2.ok) X.err(r2); } });
        },
      },
    });
  };
})(window.SL);

/* ---- crew grid actions: copy last week, repeat, count cells (local digit sheet fallback) ---- */
(function (SL) {

  const X = SL._crew;

    for (const dt of rp.dates) {
      days[dt] = { m: U.num(src.m), l: U.num(src.l), food: U.num(src.food), job: src.job || "", plan: true };

  X.eqList = () => U.sortBy(Object.entries(M.equipment()).filter(([, e]) => e && e.active !== false).map(([id, e]) => Object.assign({ id }, e)), (e) => X.norm(e.name));
  X.eqMatch = (q) => {
    const n = X.norm(q);

  };
  X.eqExact = (q) => { const n = X.norm(q); return !!n && X.eqList().some((e) => [e.name, e.ar, ...(e.aliases || [])].some((s) => X.norm(s) === n)); };

    rs.sort((a, b) => (b.crewId === cid) - (a.crewId === cid) || (b.createdAt || 0) - (a.createdAt || 0));

  /** Observed rental rates for an item: {n, min, max, last, lastSupplier} in SAR, or null. */

/* ---- bulk pricing: the sheet and save ---- */
(function (SL) {
  "use strict";
  const U = SL.util, M = SL.model, ui = SL.ui, A = SL.actions;
  const X = SL._crew;

  A.bulkPrice = (d) => {
    d = d || {};
    const pid = ui.pid();
    if (ui.readOnlyUI()) return;
    const us = X.bpUnits(pid);
    const st0 = { l: X.bpInit(pid, us) };
    const snap = JSON.stringify(st0.l);
    ui.sheet({
      title: `Price rentals · ${us.length} no price`,
      state: st0,
      wide: true,
      dirty: (sh) => JSON.stringify(sh.state.l) !== snap,
      body: (sh) => X.bpBody(sh, pid, us),
      foot: (sh) => us.length ? `<div class="t12" style="flex-basis:100%" data-out="bpsum">${X.bpSum(sh.state, us)}</div><button class="btn sec" data-act="close">Cancel</button><button class="btn" id="bp-save" data-act="save">Save prices</button>` : '<button class="btn sec" data-act="close">Close</button>',
      onInput: (sh) => sh.out("bpsum", X.bpSum(sh.state, us)),
      after: (sh) => {
        if (!d.focus || sh._focused) return;
        sh._focused = true;
        const f = sh.el.querySelector("#bp-r-" + CSS.escape(d.focus));
        if (f) setTimeout(() => { try { f.scrollIntoView({ block: "center" }); f.focus({ preventScroll: true }); } catch (e) {} }, 80);
      },
      acts: {
        same: (x, el, ev, sh) => {
          const lines = us.filter((u) => u.doc.equipmentId === x.eq);
          const src = lines.map((u) => sh.state.l[u.id]).find((l) => U.num(l.rate) > 0);
          if (!src) return sh.error("Type a rate on one " + X.eqName(x.eq) + " line first");
          for (const u of lines) { sh.state.l[u.id].rate = U.num(src.rate); sh.state.l[u.id].unit = src.unit; }
          sh.err = ""; sh.refresh();
        },
        save: (x, el, ev, sh) => X.bpSave(sh, pid, us),
      },
    });
  };

  X.bpSave = async (sh, pid, us) => {
    const ready = X.bpReady(sh.state, us).filter((u) => { const x = sh.state.l[u.id]; return U.num(x.rate) !== U.num(u.doc.rate) || x.in !== (u.doc.in || "") || x.unit !== (u.doc.rateUnit || "day"); });
    const bad = us.find((u) => { const x = sh.state.l[u.id]; return x.rate !== "" && (!(U.num(x.rate) >= 0) || !isFinite(U.num(x.rate))); });
    if (bad) return sh.error("Rates must be numbers of 0 or more");
    const late = ready.find((u) => u.doc.out && sh.state.l[u.id].in > u.doc.out);
    if (late) return sh.error("An in-date is after its return date");
    if (!ready.length) return sh.error("Type at least one rate (and in-date) to save");
    sh.busy(true);
    const undo = [], learned = new Set(), unl = [];
    for (const u of ready) {
      const x = sh.state.l[u.id];
      const r = await SL.store.patch("costs", u.id, { rate: U.num(x.rate), rateUnit: x.unit, in: x.in, date: x.in });
      if (!r.ok) { sh.busy(false); sh.error(SL.store.errText(r) + (undo.length ? ` (${undo.length} saved)` : "")); return; }
      undo.push({ id: u.id, v: { rate: U.num(u.doc.rate), rateUnit: u.doc.rateUnit || "day", in: u.doc.in || "", date: u.doc.date || "" } });
      const eq = u.doc.equipmentId;
      if (eq && !learned.has(eq)) { learned.add(eq); unl.push(await X.learnRate(eq, x.rate, x.unit)); }
    }
    sh.busy(false);
    sh.close(true);
    ui.toast(`Priced ${undo.length} rental line${undo.length > 1 ? "s" : ""}`, {
      undo: async () => { for (const x of undo) { const r = await SL.store.patch("costs", x.id, x.v); if (!r.ok) return X.err(r); } await X.unlearn(unl); },
    });
  };
})(window.SL);

(function (SL) {
